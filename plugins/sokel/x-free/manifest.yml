plugin:
  desc: 使用账号 Cookie 搜索和读取 X 推文、查看用户资料、发帖、回复与删除，无需官方 API 套餐。
  doc: README.md
  icon: brand:x
  label: X（免费读写）
  name: x-free
  org: sokel
  version: v0.1.0

credential:
  fields:
    - help: 在已登录的 x.com 页面打开开发者工具，在 Application → Cookies 中复制 auth_token 的值。
      label: 登录令牌
      name: auth_token
      required: true
      type: secret
    - help: 复制同一次登录会话的 ct0 Cookie 值；不要填写整个 Cookie 请求头。
      label: CSRF 令牌
      name: ct0
      required: true
      type: secret
    - help: 可选，填写插件容器可访问的 HTTP 或 HTTPS 代理地址。
      label: 代理地址
      name: proxy
      type: secret

operations:
  - desc: 按 X 搜索语法读取最新匹配推文，返回有界批次；结果可能少于请求数量。
    id: search
    inputs:
      - desc: 支持 from:账号、关键词等 X 搜索语法，最多 500 个字符。
        label: 搜索内容
        name: query
        required: true
        type: string
      - default: 20
        desc: 1 到 100，默认 20；不提供跨次调用的分页游标。
        goType: int
        label: 返回条数
        name: limit
        type: number
    label: 搜索推文
    outputs:
      - fields:
          - label: 推文 ID
            name: id
            required: true
            type: string
          - label: 正文
            name: text
            required: true
            type: text
          - label: 推文链接
            name: url
            required: true
            type: string
          - desc: 上游提供的发布时间；缺失时为空。
            label: 发布时间
            name: created_at
            type: string
          - label: 作者 ID
            name: author_id
            type: string
          - label: 作者账号
            name: author_username
            type: string
          - label: 回复目标 ID
            name: reply_to_id
            type: string
          - goType: int
            label: 点赞数
            name: like_count
            type: number
          - goType: int
            label: 转帖数
            name: repost_count
            type: number
          - goType: int
            label: 回复数
            name: reply_count
            type: number
        goType: Post
        label: 推文列表
        name: posts
        required: true
        type: array
      - goType: int
        label: 返回数量
        name: count
        required: true
        type: number
    timeoutSec: 120
  - desc: 读取指定账号最近的推文；用于定时监控时，请按推文 ID 在工作流中去重。
    id: user_timeline
    inputs:
      - desc: 账号名，可带 @；不要填写个人主页链接。
        label: 用户账号
        name: username
        required: true
        type: string
      - default: 20
        desc: 1 到 100，默认 20；不提供跨次调用的分页游标。
        goType: int
        label: 返回条数
        name: limit
        type: number
    label: 获取用户推文
    outputs:
      - fields:
          - label: 推文 ID
            name: id
            required: true
            type: string
          - label: 正文
            name: text
            required: true
            type: text
          - label: 推文链接
            name: url
            required: true
            type: string
          - desc: 上游提供的发布时间；缺失时为空。
            label: 发布时间
            name: created_at
            type: string
          - label: 作者 ID
            name: author_id
            type: string
          - label: 作者账号
            name: author_username
            type: string
          - label: 回复目标 ID
            name: reply_to_id
            type: string
          - goType: int
            label: 点赞数
            name: like_count
            type: number
          - goType: int
            label: 转帖数
            name: repost_count
            type: number
          - goType: int
            label: 回复数
            name: reply_count
            type: number
        goType: Post
        label: 推文列表
        name: posts
        required: true
        type: array
      - goType: int
        label: 返回数量
        name: count
        required: true
        type: number
    timeoutSec: 120
  - desc: 按推文 ID 读取正文、作者与互动数量。
    id: get_post
    inputs:
      - label: 推文 ID
        name: id
        required: true
        type: string
    label: 获取推文
    outputs:
      - fields:
          - label: 推文 ID
            name: id
            required: true
            type: string
          - label: 正文
            name: text
            required: true
            type: text
          - label: 推文链接
            name: url
            required: true
            type: string
          - desc: 上游提供的发布时间；缺失时为空。
            label: 发布时间
            name: created_at
            type: string
          - label: 作者 ID
            name: author_id
            type: string
          - label: 作者账号
            name: author_username
            type: string
          - label: 回复目标 ID
            name: reply_to_id
            type: string
          - goType: int
            label: 点赞数
            name: like_count
            type: number
          - goType: int
            label: 转帖数
            name: repost_count
            type: number
          - goType: int
            label: 回复数
            name: reply_count
            type: number
        goType: Post
        label: 推文
        name: post
        required: true
        type: json
    timeoutSec: 60
  - id: get_user
    inputs:
      - desc: 账号名，可带 @；不要填写个人主页链接。
        label: 用户账号
        name: username
        required: true
        type: string
    label: 获取用户资料
    outputs:
      - fields:
          - label: 用户 ID
            name: id
            required: true
            type: string
          - label: 用户账号
            name: username
            required: true
            type: string
          - label: 显示名称
            name: name
            type: string
          - label: 简介
            name: description
            type: text
          - goType: int
            label: 关注者数
            name: followers_count
            type: number
          - goType: int
            label: 关注数
            name: following_count
            type: number
          - label: 主页链接
            name: url
            required: true
            type: string
        goType: User
        label: 用户资料
        name: user
        required: true
        type: json
  - desc: 使用凭证对应的账号发布文本；填写回复目标时作为回复发布。写入失败不会自动重试。
    id: post
    inputs:
      - desc: 文本长度与账号发帖权限由 X 校验。
        label: 正文
        name: text
        required: true
        type: text
      - desc: 留空发布新推文；填写推文 ID 发布回复。
        label: 回复目标 ID
        name: reply_to
        type: string
    label: 发布或回复推文
    outputs:
      - fields:
          - label: 推文 ID
            name: id
            required: true
            type: string
          - label: 正文
            name: text
            required: true
            type: text
          - label: 推文链接
            name: url
            required: true
            type: string
          - desc: 上游提供的发布时间；缺失时为空。
            label: 发布时间
            name: created_at
            type: string
          - label: 作者 ID
            name: author_id
            type: string
          - label: 作者账号
            name: author_username
            type: string
          - label: 回复目标 ID
            name: reply_to_id
            type: string
          - goType: int
            label: 点赞数
            name: like_count
            type: number
          - goType: int
            label: 转帖数
            name: repost_count
            type: number
          - goType: int
            label: 回复数
            name: reply_count
            type: number
        goType: Post
        label: 推文
        name: post
        required: true
        type: json
    timeoutSec: 60
  - desc: 删除当前账号有权删除的推文；操作不可撤销，失败不会自动重试。
    id: delete_post
    inputs:
      - label: 推文 ID
        name: id
        required: true
        type: string
    label: 删除推文
    outputs:
      - label: 已删除
        name: deleted
        required: true
        type: boolean
      - label: 推文 ID
        name: id
        required: true
        type: string
    timeoutSec: 60
  - desc: 通过一次只读时间线请求验证登录状态和网络连接，不发帖。
    id: health_check
    label: 凭证体检
    outputs:
      - label: 可用
        name: ok
        required: true
        type: boolean
      - label: 说明
        name: message
        type: string

codegen:
  - lang: python
    out: sokel_gen.py
deployment:
  targets:
  - kind: container
    ref: ghcr.io/sokel-dev/sokel-plugin-x-free:0.1.0@sha256:5b6ca8d2e092582a61bfb1c305da37410859cc5d519e6b1ce9956bf78a3a2885
