            - desc: https://news.ycombinator.com/item?id=…，回复评论就点这里
              label: HN 上的地址
              name: permalink
              required: true
              type: string
            - desc: 帖子的分数；评论没有公开分数，为 0
              goType: int
              label: 得分
              name: score
              required: true
              type: number
            - desc: 帖子的评论总数；评论为 0
              goType: int
              label: 评论数
              name: comments
              required: true
              type: number
            - desc: 评论所在的帖子；帖子本身为自己的 id
              label: 所属帖子 id
              name: story_id
              required: true
              type: string
            - label: 所属帖子标题
              name: story_title
              type: string
            - desc: 评论回复的是哪一条（帖子或另一条评论）；帖子为空
              label: 上一级 id
              name: parent_id
              type: string
            - desc: RFC3339，UTC
              label: 发布时间
              name: created_at
              required: true
              type: string
            - desc: 只在「取评论」里有意义：1 = 直接回复帖子，2 = 回复评论，以此类推
              goType: int
              label: 层级
              name: depth
              required: true
              type: number
          goType: Item
          label: 结果
          name: items
          required: true
          type: array
        - goType: int
          label: 条数
          name: count
          required: true
          type: number
    - desc: 取一条帖子下的全部评论，按讨论顺序平铺（带层级）。可只取某个时刻之后的新评论
      id: hn_thread_comments
      inputs:
        - desc: 也可以直接粘 HN 地址
          label: 帖子 id
          name: id
          required: true
          type: string
        - desc: RFC3339 时间；留空 = 全部
          label: 只要这之后的
          name: since
          type: string
      label: 取评论
      outputs:
        - desc: 讨论顺序（先父后子），depth 是层级
          fields:
            - label: 条目 id
              name: id
              required: true
              type: string
            - desc: story / comment / job / poll
              label: 类型
              name: type
              required: true
              type: string
            - label: 作者
              name: author
              required: true
              type: string
            - desc: 帖子才有；评论为空
              label: 标题
