            - desc: 由 text_html 去掉标签、还原转义得到；链接帖通常为空
              label: 正文（纯文本）
              name: text
              type: string
            - desc: HN 返回的原样内容
              label: 正文（HN 原文 HTML）
              name: text_html
              type: string
            - desc: 链接帖指向的地址；讨论帖与评论为空
              label: 外链
              name: url
              type: string
            - desc: https://news.ycombinator.com/item?id=…，回复评论就点这里
              label: HN 上的地址
              name: permalink
              required: true
              type: string
