              label: 得分
              name: score
              required: true
              type: number
            - desc: 帖子的评论总数；评论为 0
              goType: int
              label: 评论数
              name: comments
              required: true
              type: number
            - desc: 评论所在的帖子；帖子本身为自己的 id
              label: 所属帖子 id
              name: story_id
              required: true
              type: string
            - label: 所属帖子标题
              name: story_title
              type: string
            - desc: 评论回复的是哪一条（帖子或另一条评论）；帖子为空
              label: 上一级 id
              name: parent_id
              type: string
            - desc: RFC3339，UTC
              label: 发布时间
              name: created_at
              required: true
              type: string
            - desc: 只在「取评论」里有意义：1 = 直接回复帖子，2 = 回复评论，以此类推
              goType: int
              label: 层级
              name: depth
              required: true
              type: number
          goType: Item
          label: 评论
          name: items
          required: true
          type: array
        - goType: int
          label: 条数
          name: count
          required: true
          type: number
        - label: 帖子标题
          name: title
          required: true
          type: string
plugin:
    desc: 读榜单、帖子、评论，按关键词搜索；有人评论你的帖子、或回复你的评论时触发工作流。
    doc: README.md
    label: Hacker News
    name: hackernews
    org: sokel
    version: v0.1.0
deployment:
  targets:
  - kind: container
    ref: ghcr.io/sokel-dev/sokel-plugin-hackernews:latest
