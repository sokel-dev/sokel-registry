              name: permalink
              required: true
              type: string
            - desc: 帖子的分数；评论没有公开分数，为 0
              goType: int
              label: 得分
              name: score
              required: true
              type: number
            - desc: 帖子的评论总数；评论为 0
              goType: int
              label: 评论数
              name: comments
              required: true
              type: number
            - desc: 评论所在的帖子；帖子本身为自己的 id
              label: 所属帖子 id
              name: story_id
              required: true
              type: string
            - label: 所属帖子标题
              name: story_title
              type: string
            - desc: 评论回复的是哪一条（帖子或另一条评论）；帖子为空
              label: 上一级 id
              name: parent_id
              type: string
            - desc: RFC3339，UTC
              label: 发布时间
              name: created_at
              required: true
              type: string
            - desc: 只在「取评论」里有意义：1 = 直接回复帖子，2 = 回复评论，以此类推
              goType: int
              label: 层级
              name: depth
              required: true
              type: number
          goType: Item
          label: 条目
          name: items
          required: true
          type: array
        - goType: int
          label: 条数
          name: count
          required: true
          type: number
    - desc: 按关键词搜帖子和评论，最新的在前。看谁在讨论你的项目就用它
      id: hn_search
      inputs:
        - desc: 项目名、域名、仓库地址都行；多个词之间是「且」
          label: 关键词
          name: query
          required: true
          type: string
        - default: all
          label: 范围
          name: kind
          options:
            - label: 帖子和评论
              value: all
            - label: 只看帖子
              value: story
            - label: 只看评论
              value: comment
          type: enum
        - default: 0
          desc: 0 = 不限
          goType: int
          label: 最近多少小时
          name: since_hours
          type: number
        - default: 20
          desc: 默认 20，最多 100
          goType: int
          label: 条数
          name: limit
          type: number
      label: 搜索
      outputs:
        - desc: 按时间倒序
          fields:
            - label: 条目 id
              name: id
              required: true
              type: string
            - desc: story / comment / job / poll
              label: 类型
              name: type
              required: true
              type: string
            - label: 作者
              name: author
              required: true
              type: string
            - desc: 帖子才有；评论为空
