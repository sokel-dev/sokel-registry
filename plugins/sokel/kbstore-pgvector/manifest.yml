    name: extensions
    type: string
  - label: 说明
    name: message
    required: true
    type: string
plugin:
  desc: 知识库存储引擎插件（Postgres + pgvector），与 kbstore-es 实现同一份存储契约。
  doc: README.md
  label: 知识库存储（pgvector）
  name: kbstore-pgvector
  org: sokel
