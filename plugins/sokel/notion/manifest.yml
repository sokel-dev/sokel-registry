# Generated by cmd/gen-from-db. The contract comes from ../plugin-builtin/notion/schema (the plugin's own declaration);
# display name and description come from the platform DB. Original platform id: notion;
# migration claims it under the same id.
credential:
  auth:
    kind: oauth
    provider: notion
  fields:
  - desc: notion.so/profile/integrations 建一个「内部」集成，「密钥」页复制 ntn_ 开头那串；走 OAuth 授权则留空。**填完还要去 Notion 里把页面「⋯ → 连接」给这个集成**，否则什么都读不到
    label: 内部集成密钥
    name: token
    type: secret
  - desc: 点「授权」后自动写入，勿手填
    label: 访问令牌（授权注入）
    name: access_token
    type: secret
  - desc: 勿手填
    label: 刷新令牌（授权注入）
    name: refresh_token
    type: secret
  - desc: 如 http://127.0.0.1:7897；部署环境直连不了 Notion 时必填
    label: 出站代理
    name: proxy
    type: text
  - desc: 逗号分隔的数据源 id 或链接（数据库链接直接贴即可）；留空 = 不产事件。改完保存即生效，事件源会自动重启
    label: 监听的数据源
    name: watch_data_sources
    type: text
  - default: '60'
    desc: 默认 60；Notion 限流 3 次/秒，盯的表越多别调得越短
    label: 轮询间隔（秒）
    name: poll_seconds
    type: text
  - desc: 事件源自动维护，勿手填
    label: 轮询游标
    name: watch_cursor
    type: text
deployment:
  targets:
  - kind: container
    ref: ghcr.io/sokel-dev/sokel-plugins/sokel-plugin-notion:latest
events:
- fields:
  - label: 页面 id
    name: page_id
    required: true
    type: string
  - desc: 这一行属于哪张表
    label: 数据源 id
    name: data_source_id
    required: true
    type: string
  - label: 链接
    name: url
    type: string
  - label: 标题
    name: title
    type: string
  - label: 创建时间
    name: created_time
    type: string
  - label: 最后编辑时间
    name: last_edited_time
    type: string
  - desc: 属性名与类型由该数据源的表结构决定；值已归一化
    label: 属性
    name: props
    opaque: true
    type: json
  id: page_created
  label: 新增行
- fields:
  - label: 页面 id
    name: page_id
    required: true
    type: string
  - desc: 这一行属于哪张表
    label: 数据源 id
    name: data_source_id
    required: true
    type: string
  - label: 链接
    name: url
    type: string
  - label: 标题
    name: title
    type: string
  - label: 创建时间
    name: created_time
    type: string
  - label: 最后编辑时间
    name: last_edited_time
    type: string
  - desc: 属性名与类型由该数据源的表结构决定；值已归一化
    label: 属性
    name: props
    opaque: true
    type: json
  id: page_updated
  label: 行被修改
events_common:
- page_id
- data_source_id
operations:
- id: notion_block_append
  inputs:
  - label: 页面或块 ID
    name: block_id
    required: true
    type: string
  - desc: Notion 的块对象数组，原样透传。普通正文用「改页面正文」更省事，这里是给 markdown 表达不了的块（嵌入、看板、数据库块）留的口子
    label: 块
    name: blocks
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
  label: 追加原始块
  outputs:
  - goType: int
    label: 写入块数
    name: count
    required: true
    type: number
  - itemType: string
    label: 块 id
    name: block_ids
    type: array
- id: notion_comment_create
  inputs:
  - desc: 与讨论串 id 二选一
    label: 页面 ID
    name: page_id
    type: string
  - desc: 回某一串评论；来自「列评论」
    label: 讨论串 ID
    name: discussion_id
    type: string
  - label: 内容
    name: text
    required: true
    type: text
  label: 加评论
  outputs:
  - label: 评论 id
    name: id
    required: true
    type: string
  - label: 讨论串 id
    name: discussion_id
    type: string
- id: notion_db_create
  inputs:
  - desc: 数据库必须挂在某一页下
    label: 父页面 ID
    name: parent_page_id
    required: true
    type: string
  - label: 名称
    name: title
    required: true
    type: string
  - desc: 例：{"名称":{"title":{}},"状态":{"select":{"options":[{"name":"待办"},{"name":"完成"}]}}}；必须**恰好有一个** title 列，否则 Notion 拒绝
    label: 列
    name: properties
    opaque: true
    required: true
    type: json
  label: 建数据库
  outputs:
  - label: 数据库 id
    name: database_id
    required: true
    type: string
  - desc: 往里建行用这个
    label: 数据源 id
    name: data_source_id
    type: string
  - label: 链接
    name: url
    type: string
- id: notion_page_create
  inputs:
  - default: page
    label: 父类别
    name: parent_type
    options:
    - label: 挂在某一页下
      value: page
    - label: 作为数据源的一行
      value: data_source
    type: enum
  - desc: 父页面 id 或数据源 id；贴链接也行
    label: 父 ID
    name: parent_id
    required: true
    type: string
  - desc: 数据源行的标题会写进它的标题列（不必再在 props 里给一遍）
    label: 标题
    name: title
    type: string
  - desc: 归一化写法：{"状态":"进行中","标签":["A","B"],"截止":"2026-08-20"}；父是页面时忽略
    label: 属性
    name: props
    opaque: true
    type: json
  - desc: 留空 = 建一个空页面
    label: 正文（markdown）
    name: markdown
    type: text
  - desc: 一个 emoji，如 📌
    label: 图标
    name: icon
    type: string
  label: 建页面
  outputs:
  - label: 页面 id
    name: id
    required: true
    type: string
  - label: 链接
    name: url
    type: string
  - label: 标题
    name: title
    type: string
- id: notion_page_get
  inputs:
  - desc: 贴完整 Notion 链接也行，会自己抠出 id
    label: 页面 ID
    name: page_id
    required: true
    type: string
  - default: true
    desc: 勾选后多一次请求，取整页 markdown
    label: 同时取正文
    name: with_content
    type: boolean
  label: 读页面
  outputs:
  - label: 页面 id
    name: id
    required: true
    type: string
  - label: 链接
    name: url
    type: string
  - label: 标题
    name: title
    type: string
  - desc: with_content=false 时为空
    label: 正文（markdown）
    name: markdown
    type: text
  - desc: true = 页面太大，markdown 只是一部分
    label: 正文被截断
    name: truncated
    type: boolean
  - desc: 属性名与类型由所在数据源的表结构决定；值已归一化
    label: 属性
    name: props
    opaque: true
    type: json
  - desc: Notion 原样的属性 JSON；归一化会丢信息的类型（rollup/formula）在这里取
    label: 属性（原样）
    name: properties_raw
    opaque: true
    type: json
  - label: 父类别
    name: parent_type
    type: string
  - label: 父 id
    name: parent_id
    type: string
  - label: 创建时间
    name: created_time
    type: string
  - label: 最后编辑时间
    name: last_edited_time
    type: string
  - label: 在回收站
    name: in_trash
    type: boolean
- id: notion_db_schema
  inputs:
  - label: 数据源 ID
    name: data_source_id
    required: true
    type: string
  label: 取表结构
  outputs:
  - label: 数据源 id
    name: data_source_id
    required: true
    type: string
  - label: 所属数据库 id
    name: database_id
    type: string
  - label: 名称
    name: title
    type: string
  - fields:
    - desc: 写入属性时用的键
      label: 列名
      name: name
      required: true
      type: string
    - label: 列 id
      name: id
      type: string
    - desc: title / rich_text / number / select / status / multi_select / date / people / files / checkbox / url / email / phone_number / relation / formula / rollup …
      label: 类型
      name: type
      required: true
      type: string
    - desc: select / status / multi_select 才有
      itemType: string
      label: 候选值
      name: options
      type: array
    - desc: false = Notion 算出来的（formula/rollup/created_time…），写入会被拒
      label: 可写
      name: writable
      required: true
      type: boolean
    goType: PropSpec
    label: 列
    name: properties
    required: true
    type: array
- id: notion_user_get
  inputs:
  - desc: 留空 = 读本集成自己的机器人身份
    label: 用户 ID
    name: user_id
    type: string
  label: 读成员
  outputs:
  - label: 用户 id
    name: id
    required: true
    type: string
  - label: 名字
    name: name
    type: string
  - label: 类别
    name: type
    type: string
  - label: 邮箱
    name: email
    type: string
  - label: 头像
    name: avatar_url
    type: string
- id: notion_block_children
  inputs:
  - desc: 页面本身就是块，贴页面 id 即读整页顶层块
    label: 块或页面 ID
    name: block_id
    required: true
    type: string
  - default: 100
    desc: 默认 100，上限 500；不递归子块
    goType: int
    label: 最多几块
    name: max_items
    type: number
  label: 读子块
  outputs:
  - desc: Notion 的块对象数组，形状由块类型决定（25 种，且随版本增补），原样透传
    label: 块
    name: blocks
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
  - goType: int
    label: 块数
    name: count
    required: true
    type: number
  - label: 下一页游标
    name: next_cursor
    type: string
- id: notion_comment_list
  inputs:
  - label: 页面或块 ID
    name: block_id
    required: true
    type: string
  - default: 100
    goType: int
    label: 最多几条
    name: max_items
    type: number
  label: 列评论
  outputs:
  - fields:
    - label: 评论 id
      name: id
      required: true
      type: string
    - desc: 回同一串评论时带上它
      label: 讨论串 id
      name: discussion_id
      type: string
    - label: 内容（纯文本）
      name: text
      type: string
    - label: 时间
      name: created_time
      type: string
    - label: 作者 id
      name: created_by_id
      type: string
    goType: Comment
    label: 评论
    name: comments
    required: true
    type: array
  - goType: int
    label: 条数
    name: count
    required: true
    type: number
- id: notion_db_list
  inputs:
  - desc: 贴完整 Notion 链接也行
    label: 数据库 ID
    name: database_id
    required: true
    type: string
  label: 列出数据源
  outputs:
  - label: 数据库 id
    name: database_id
    required: true
    type: string
  - label: 名称
    name: title
    type: string
  - desc: 单源库只有一个；查询与建行用它的 id
    fields:
    - label: 数据源 id
      name: id
      required: true
      type: string
    - label: 名称
      name: name
      type: string
    goType: DataSourceRef
    label: 数据源
    name: data_sources
    required: true
    type: array
  - desc: 单源库直接接这个往下走
    label: 首个数据源 id
    name: first_data_source_id
    type: string
- id: notion_user_list
  inputs:
  - default: 100
    goType: int
    label: 最多几人
    name: max_items
    type: number
  label: 列成员
  outputs:
  - desc: 写「负责人」这类 people 属性要用这里的 id
    fields:
    - label: 用户 id
      name: id
      required: true
      type: string
    - label: 名字
      name: name
      type: string
    - desc: person / bot
      label: 类别
      name: type
      type: string
    - desc: 仅 person，且集成有权限时才有
      label: 邮箱
      name: email
      type: string
    - label: 头像
      name: avatar_url
      type: string
    goType: User
    label: 成员
    name: users
    required: true
    type: array
  - goType: int
    label: 人数
    name: count
    required: true
    type: number
- id: notion_db_query
  inputs:
  - desc: 用「列出数据源」从数据库 id 取；贴数据库链接时会当作单源库自动取第一个数据源
    label: 数据源 ID
    name: data_source_id
    required: true
    type: string
  - desc: Notion 的过滤 DSL，原样透传。例：{"property":"状态","status":{"equals":"进行中"}}
    label: 过滤
    name: filter
    opaque: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
  - desc: Notion 的排序数组，原样透传。例：[{"property":"更新时间","direction":"descending"}]
    label: 排序
    name: sorts
    opaque: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
  - default: 100
    desc: 默认 100，上限 1000；自动翻页
    goType: int
    label: 最多几行
    name: max_items
    type: number
  - desc: 接着上次的 next_cursor 往下取
    label: 起始游标
    name: start_cursor
    type: string
  label: 查询数据源
  outputs:
  - desc: 每行的属性已归一化到 props
    fields:
    - label: 页面 id
      name: id
      required: true
      type: string
    - label: 链接
      name: url
      type: string
    - label: 标题
      name: title
      type: string
    - desc: emoji 或图片链接
      label: 图标
      name: icon
      type: string
    - label: 父类别
      name: parent_type
      type: string
    - label: 父 id
      name: parent_id
      type: string
    - label: 创建时间
      name: created_time
      type: string
    - label: 最后编辑时间
      name: last_edited_time
      type: string
    - label: 在回收站
      name: in_trash
      type: boolean
    - desc: 属性名与类型由该数据源的表结构决定，运行时才知道；值已归一化（文本→字符串、多选→字符串数组、日期→{start,end}）
      label: 属性
      name: props
      opaque: true
      type: json
    goType: PageItem
    label: 行
    name: pages
    required: true
    type: array
  - goType: int
    label: 行数
    name: count
    required: true
    type: number
  - label: 还有更多
    name: has_more
    type: boolean
  - label: 下一页游标
    name: next_cursor
    type: string
- id: notion_search
  inputs:
  - desc: 只匹配标题，不搜正文；留空 = 列出集成能看到的全部
    label: 关键词
    name: query
    type: string
  - default: all
    label: 只要哪一类
    name: type
    options:
    - label: 页面和数据源
      value: all
    - label: 只要页面
      value: page
    - label: 只要数据源
      value: data_source
    type: enum
  - default: 50
    desc: 默认 50，上限 200；自动翻页
    goType: int
    label: 最多几条
    name: max_items
    type: number
  label: 搜索
  outputs:
  - desc: 要正文用「读页面」，要行用「查询数据源」
    fields:
    - label: id
      name: id
      required: true
      type: string
    - desc: page / data_source / database
      label: 类别
      name: object
      required: true
      type: string
    - label: 标题
      name: title
      type: string
    - label: 链接
      name: url
      type: string
    - desc: page / data_source / database / workspace
      label: 父类别
      name: parent_type
      type: string
    - label: 父 id
      name: parent_id
      type: string
    - label: 最后编辑时间
      name: last_edited_time
      type: string
    goType: SearchItem
    label: 命中
    name: items
    required: true
    type: array
  - goType: int
    label: 条数
    name: count
    required: true
    type: number
- id: notion_page_trash
  inputs:
  - label: 页面 ID
    name: page_id
    required: true
    type: string
  - desc: 勾选 = 从回收站拿回来
    label: 改为恢复
    name: restore
    type: boolean
  label: 删除/恢复页面
  outputs:
  - label: 页面 id
    name: id
    required: true
    type: string
  - desc: API 只能移进回收站，不能彻底删除
    label: 在回收站
    name: in_trash
    required: true
    type: boolean
- id: notion_page_content
  inputs:
  - label: 页面 ID
    name: page_id
    required: true
    type: string
  - default: append
    label: 怎么改
    name: mode
    options:
    - label: 追加到末尾
      value: append
    - label: 整页替换
      value: replace
    - label: 搜索替换（改一段）
      value: edit
    type: enum
  - desc: append / replace 用
    label: 内容（markdown）
    name: markdown
    type: text
  - desc: edit 用；必须与页面里的文字一字不差
    label: 要替换的原文
    name: old_str
    type: text
  - desc: edit 用；留空 = 删掉这段
    label: 替换成
    name: new_str
    type: text
  - desc: edit 用；默认只替换第一处
    label: 替换全部匹配
    name: replace_all
    type: boolean
  label: 改页面正文
  outputs:
  - label: 页面 id
    name: id
    required: true
    type: string
  - desc: Notion 回的当前全文
    label: 改完后的正文
    name: markdown
    type: text
  - label: 正文被截断
    name: truncated
    type: boolean
- id: notion_page_update
  inputs:
  - label: 页面 ID
    name: page_id
    required: true
    type: string
  - desc: 留空 = 不改
    label: 标题
    name: title
    type: string
  - desc: 只给要改的列；没提到的列不动。清空某列用 null
    label: 属性
    name: props
    opaque: true
    type: json
  - desc: 一个 emoji；留空 = 不改
    label: 图标
    name: icon
    type: string
  label: 改页面属性
  outputs:
  - label: 页面 id
    name: id
    required: true
    type: string
  - label: 链接
    name: url
    type: string
- id: notion_db_update_schema
  inputs:
  - label: 数据源 ID
    name: data_source_id
    required: true
    type: string
  - desc: 留空 = 不改
    label: 改名
    name: title
    type: string
  - desc: 只给要改的列。加列 {"新列":{"number":{}}}；删列 {"旧列":null}；改名 {"旧列":{"name":"新名"}}
    label: 列改动
    name: properties
    opaque: true
    type: json
  label: 改表结构
  outputs:
  - label: 数据源 id
    name: data_source_id
    required: true
    type: string
  - fields:
    - desc: 写入属性时用的键
      label: 列名
      name: name
      required: true
      type: string
    - label: 列 id
      name: id
      type: string
    - desc: title / rich_text / number / select / status / multi_select / date / people / files / checkbox / url / email / phone_number / relation / formula / rollup …
      label: 类型
      name: type
      required: true
      type: string
    - desc: select / status / multi_select 才有
      itemType: string
      label: 候选值
      name: options
      type: array
    - desc: false = Notion 算出来的（formula/rollup/created_time…），写入会被拒
      label: 可写
      name: writable
      required: true
      type: boolean
    goType: PropSpec
    label: 改完后的列
    name: properties
    required: true
    type: array
- id: notion_file_upload
  inputs:
  - label: 文件
    name: file
    required: true
    type: file
  - desc: 留空 = 用文件自带的名字
    label: 文件名
    name: filename
    type: string
  label: 上传文件
  outputs:
  - desc: 用法：追加块 {"type":"file","file":{"type":"file_upload","file_upload":{"id":"<这个 id>"}}}，或写进 files 属性
    label: 文件引用 id
    name: file_upload_id
    required: true
    type: string
  - label: 文件名
    name: filename
    type: string
