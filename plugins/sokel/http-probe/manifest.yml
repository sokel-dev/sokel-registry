plugin:
  org: sokel
  name: http-probe
  label: HTTP 直连探针
  version: 1.0.0
  desc: 零部署的 HTTP 直连参考件：按操作映射直调上游 JSON API（默认演示打平台自身 /healthz）
transports:
  - kind: http
operations:
  - id: get_health
    label: 探活
    desc: GET {端点}/healthz —— 端点填平台地址（如 http://server:8088）即可零部署调通；换成任何返回 JSON 的服务同理
    http:
      method: GET
      path: /healthz
    outputs:
      - name: ok
        label: 存活
        type: boolean
      - name: version
        label: 版本
        type: string
