      goType: int
    - name: content
      label: 回答正文
      type: text
      required: true
    - name: openai_response
      label: 兼容协议原始响应
      type: text
    - name: openai_converted
      label: 兼容协议转换确认
      type: boolean
    - name: finish_reason
      label: 结束原因
      type: string
    - name: reasoning
