- id: ocr
  label: Recognize a document
  desc: Recognize PDF, Word, PowerPoint or images; up to 100 MiB and 1,000 pages.
    Returns readable text, original text and structured layout, with warnings for
    incomplete pages.
  timeoutSec: 240
  inputs:
  - name: file
    label: Document
    type: file
    required: true
  - name: purpose
    label: Recognition mode
    type: enum
    default: text_recognition
    desc: Defaults to text recognition when no mode is selected.
    options:
    - value: text_recognition
      label: Text recognition
    - value: rich_layout_recognition
      label: Rich layout recognition
  outputs:
  - name: id
    label: Recognition ID
    type: string
    required: true
  - name: purpose
    label: Recognition mode
    type: string
    required: true
  - name: page_count
    label: Page count
    type: number
    required: true
    goType: int
  - name: pages
    label: Recognized pages
    type: array
    required: true
    fields:
    - name: index
      type: number
      required: true
      goType: int
    - name: text
      label: Readable text
      type: string
      required: true
      desc: Layout metadata removed; Markdown, tables and formulas retained
    - name: raw_text
      label: Original text
      type: string
      required: true
      desc: Unmodified upstream page text, including layout markers
    - name: layout
      label: Layout regions
      type: array
      required: true
      fields:
      - name: type
        label: Region type
        type: string
        required: true
        desc: Original ref label; unannotated text uses text
      - name: text
        label: Region text
        type: string
        required: true
      - name: boxes
        label: Normalized boxes
        type: array
        required: true
        desc: Top-left origin; coordinates range from 0 to 1000 relative to page width
          and height
        fields:
        - name: x1
          label: Left X
          type: number
          required: true
        - name: y1
          label: Top Y
          type: number
          required: true
        - name: x2
          label: Right X
          type: number
          required: true
        - name: y2
          label: Bottom Y
          type: number
          required: true
      - name: text_range
        label: Page text range
        type: array
        desc: Unicode character offsets [start,end) in the readable page text; omitted
          for empty regions
        itemType: number
    - name: finish_reason
      type: string
      required: true
    goType: Page
  - name: text
    label: Combined text
    type: text
    required: true
    desc: Readable page texts joined by a blank line
  - name: raw_text
    label: Original text
    type: text
    required: true
    desc: Original page texts joined by a blank line; includes layout markers
  - name: usage
    label: Token usage
    type: json
    required: true
    fields:
    - name: input_tokens
      type: number
      required: true
      goType: int
    - name: output_tokens
      type: number
      required: true
      goType: int
    - name: total_tokens
      type: number
      required: true
      goType: int
    goType: TokenUsage
  - name: warnings
    label: Warnings
    type: array
    required: true
    itemType: string
