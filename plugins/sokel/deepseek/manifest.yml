      required: true
    - name: language
      label: 语种
      type: string
      desc: 识别出的语种；空 = 上游没说
    - name: duration_ms
      label: 时长（毫秒）
      type: number
      desc: 0 = 未知
      goType: int
    - name: usage
      label: 计量
      type: json
      desc: audio_seconds（音频秒数）/ token 各家能给几项给几项
      fields:
      - name: prompt_tokens
        label: 输入 token
        type: number
        required: true
        goType: int
      - name: completion_tokens
        label: 输出 token
        type: number
        required: true
        goType: int
      - name: total_tokens
        label: 合计
        type: number
        required: true
        goType: int
      - name: cached_prompt_tokens
        label: 缓存命中
        type: number
