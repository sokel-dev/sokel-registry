credential:
  fields:
  - label: API Key
    name: api_key
    placeholder: sk-...
    required: true
    type: secret
  - default: https://api.deepseek.com
    help: 该厂商的 OpenAI 兼容地址
    label: Base URL
    name: base_url
    type: url
deployment:
  env:
  - default: deepseek
    desc: 只启用本插件这一个成员（基础容器是全量基础插件合一镜像；token 是单插件身份凭据）
    name: SOKEL_BASE_PLUGINS
    required: true
  note: 平台部署套件已内置同款容器承接本插件，通常无需部署；此命令用于在别的机器上再起一个出站副本（横向扩容/就近出网）。
  targets:
  - kind: container
    ref: registry.cn-hangzhou.aliyuncs.com/wisburg/sokel-base-plugins@sha256:79c8883110ee0343133a8c6b4b0adbd8a3b63e9ddaa27bcec74f6cd29ea93b81
implements:
- capability: llm/chat
  operations:
  - id: chat
    label: 对话
    desc: 按 canonical 请求调用上游模型，返回完整回答
    timeoutSec: 300
    inputs:
    - name: chat
      label: 对话请求
      type: json
      required: true
      desc: 平台的 canonical 请求（模型名已解析为上游真名）
      fields:
      - name: Model
        label: 上游模型名
        type: string
        required: true
      - name: System
        label: 系统提示
        type: string
      - name: Messages
        label: 对话消息
        type: array
        required: true
        fields:
        - name: Role
          label: 角色
          type: string
          required: true
          desc: user / assistant / tool
        - name: Content
          label: 内容
          type: string
        - name: Media
          label: 媒体输入
          type: array
          fields:
          - name: Modality
            label: 模态
            type: string
            required: true
            desc: image / audio / video / document
          - name: MIME
            label: MIME
            type: string
          - name: Form
            label: 形态
            type: string
            required: true
            desc: inline=平台传字节（data URL）；uri=只给地址，模型自己去取
          - name: Value
            label: 取值
            type: string
            required: true
            desc: Form=inline 时是 data URL；Form=uri 时是地址
        - name: ToolCalls
          label: 工具调用
          type: array
          fields:
          - name: ID
            label: 调用 id
            type: string
            required: true
          - name: Name
            label: 函数名
            type: string
            required: true
          - name: Args
            label: 参数
            type: json
            desc: 形状由该函数的 JSON Schema 决定，运行期才知道
            opaque: true
          - name: Meta
            label: 厂商回传状态
            type: json
            fields:
            - name: vendor
              label: 厂商
              type: string
              required: true
            - name: data
              label: 数据
              type: json
              desc: 厂商私有,平台与别家都不解释
              opaque: true
        - name: ToolCallID
          label: 对应的调用 id
          type: string
        - name: Meta
          label: 厂商回传状态
          type: json
          fields:
          - name: vendor
            label: 厂商
            type: string
            required: true
          - name: data
            label: 数据
            type: json
            desc: 厂商私有,平台与别家都不解释
            opaque: true
      - name: Temperature
        label: 随机性
        type: number
      - name: MaxTokens
        label: 最大输出 token
        type: number
        goType: int
      - name: TopP
        label: top_p
        type: number
      - name: Stop
        label: 停止序列
        type: array
        itemType: string
      - name: ResponseFormat
        label: 结构化输出
        type: json
        fields:
        - name: Type
          label: 档位
          type: string
          required: true
          desc: text / json_object / json_schema
        - name: Schema
          label: JSON Schema
          type: json
          desc: 由调用方给出，形状随其业务而定
          opaque: true
        - name: Name
          label: schema 名
          type: string
      - name: Reasoning
        label: 推理
        type: json
        fields:
        - name: Effort
          label: 力度
          type: string
          desc: off / low / medium / high
        - name: Style
          label: 入参方言
          type: string
          desc: vendor default when empty | reasoning_effort | enable_thinking | thinking
            | deepseek | thinking_type
      - name: Tools
        label: 函数工具
        type: array
        fields:
        - name: Name
          label: 函数名
          type: string
          required: true
        - name: Description
          label: 说明
          type: string
        - name: Parameters
          label: 参数 JSON Schema
          type: json
          desc: 函数参数的形状由调用方定义，是任意 JSON Schema
          opaque: true
        - name: Strict
          label: 严格参数校验
          type: boolean
      - name: ToolChoice
        label: 工具选择
        type: json
        fields:
        - name: Mode
          label: 模式
          type: string
          required: true
          desc: auto / none / required / function
        - name: Name
          label: 函数名
          type: string
          desc: Mode=function 时指定的函数名
      - name: ParallelToolCalls
        label: 并行工具调用
