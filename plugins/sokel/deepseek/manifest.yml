  timeoutSec: 60
  inputs:
  - name: file_id
    label: Remote file ID
    type: string
    required: true
  outputs:
  - name: file
    label: Remote file
    type: json
    required: true
    fields:
    - name: id
      type: string
      required: true
    - name: object
      type: string
      required: true
    - name: bytes
      type: number
      required: true
      goType: int64
    - name: created_at
      type: number
      required: true
      goType: int64
    - name: filename
      type: string
      required: true
    - name: purpose
      type: string
      required: true
    - name: expires_at
      type: number
      goType: int64
    goType: RemoteFile
- id: delete_file
  label: Delete an uploaded file
  desc: Deletes the named file from the DeepSeek account; conversations referencing
    it can no longer use it.
  timeoutSec: 60
  inputs:
  - name: file_id
    label: Remote file ID
    type: string
    required: true
  outputs:
  - name: id
    label: Deleted file ID
    type: string
    required: true
  - name: deleted
    label: Deleted
    type: boolean
    required: true
- id: chatbot
  label: Chat with application tools
  desc: DeepSeek Flash chat with web/image search, deep thinking, URL reading, file
    input, title generation and content safety. Keep the returned message unchanged
    in conversation history.
  timeoutSec: 900
  inputs:
  - name: prompt
    label: User message
    type: string
    required: true
  - name: history
    label: Conversation history
    type: json
    desc: Object with a messages array of original Chat Completions messages, including
      server_tool_calls, reasoning_content and latest_reminder messages; preserve
      returned messages verbatim
    opaque: true
  - name: file_ids
    label: Uploaded file IDs
    type: array
    itemType: string
  - name: latest_reminder
    label: User metadata marker
    type: string
    desc: YYYY-MM-DD,weekday,location,Web or App,language; for example 2026-11-14,Saturday,Shanghai,Web,English
  - name: web_search
    label: Web and image search
    type: boolean
  - name: read_url
    label: Read URLs
    type: boolean
  - name: thinking
    label: Deep thinking
    type: boolean
  - name: safety_level
    label: Content safety
    type: enum
    default: high
    options:
    - value: low
    - value: high
  - name: generate_title
    label: Generate conversation title
    type: boolean
  - name: max_tokens
    label: Max tokens per inference step
    type: number
    goType: int
  outputs:
  - name: content
    label: Answer
    type: text
    required: true
  - name: reasoning
    label: Thinking
    type: text
    required: true
  - name: title
    label: Conversation title
    type: string
    required: true
  - name: finish_reason
    label: Finish reason
    type: string
    required: true
  - name: message
    label: Assistant message
    type: json
    required: true
    desc: Original assistant message, including citations, server tool calls and per-step
      state; append unchanged to history.messages
    opaque: true
  - name: response
    label: Raw response
    type: json
    required: true
    desc: Complete upstream Chat Completions response, including usage and safety
      metadata
    opaque: true
- id: speech_stream
  label: Synthesize text chunks
  desc: Send ordered text chunks through the WebSocket TTS API; returns a WAV file
    after a successful finish event.
  timeoutSec: 900
  inputs:
  - name: chunks
    label: Ordered text chunks
    type: array
    required: true
    itemType: string
  - name: voice
    label: Voice
    type: enum
    default: stella
    options:
    - value: stella
    - value: tide
  - name: filter_markdown
    label: Remove Markdown formatting
    type: boolean
    default: true
  outputs:
  - name: audio
    label: Audio file
    type: file
    required: true
  - name: sample_rate
    label: Sample rate
    type: number
    required: true
    goType: int
  - name: duration_ms
    label: Duration in milliseconds
    type: number
    required: true
    goType: int
plugin:
  desc: DeepSeek chat, speech synthesis, transcription, OCR, web search, page reading
    and document APIs.
  label: DeepSeek
  name: deepseek
  org: sokel
  version: v1.1.5
  doc: README.md
