      - name: total_tokens
        label: 合计
        type: number
        required: true
        goType: int
      - name: cached_prompt_tokens
        label: 缓存命中
        type: number
        goType: int
      - name: characters
        label: 字符数
        type: number
        goType: int
      - name: audio_seconds
        label: 音频秒数
        type: number
      - name: video_seconds
        label: 视频秒数
        type: number
      - name: images
        label: 图片张数
        type: number
        goType: int
      goType: Usage
    - name: tool_calls
      label: 工具调用
      type: array
      fields:
      - name: id
        label: 调用 id
        type: string
        required: true
      - name: name
        label: 函数名
        type: string
        required: true
      - name: args
        label: 参数
        type: json
        required: true
        desc: 参数形状由该函数的 JSON Schema 决定，运行期才知道
        opaque: true
      - name: meta
        label: 厂商回传状态
        type: json
        fields:
        - name: vendor
          label: 厂商
          type: string
          required: true
        - name: data
          label: 数据
          type: json
          desc: 厂商私有
          opaque: true
      goType: ToolCall
    - name: json
      label: 结构化结果
      type: json
      desc: 结构化输出的结果，形状由调用方给的 JSON Schema 决定
      opaque: true
    - name: reasoning_notice
      label: 推理注记
      type: string
      desc: 请求的推理语义被就近执行时的一句提示（如 GLM-5.3 家族关不掉思考）；空 = 忠实执行
    - name: meta
