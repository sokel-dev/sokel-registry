- capability: embedding
  operations:
  - id: embeddings
    label: 向量化
    desc: 一批文本 → 一批向量（与输入等长同序）
    timeoutSec: 120
    inputs:
    - name: model
      label: 上游模型名
      type: string
      desc: 由平台路由填入；TEI 那类一进程一模型的实现会忽略它
    - name: texts
      label: 待向量化文本
      type: array
      required: true
      itemType: string
    - name: target_dims
      label: 目标维度
      type: number
      desc: Matryoshka 截断：想要几维（0/留空=模型默认）。1024 维的存储只要 3072 维的三分之一，质量损失很小。不支持的家忽略它——实际维度看出参
        dims
      goType: int
    - name: purpose
      label: 口径
      type: string
      desc: 这批文本要拿来干什么：retrieval_document（被检索的一方）/ retrieval_query（发起检索的一方）/ similarity
        / classification；留空=不声明。检索型模型对查询与文档处理不同，用错不报错但召回会变差
    outputs:
    - name: status
      label: 上游状态码
      type: number
      required: true
      goType: int
    - name: dims
      label: 向量维度
      type: number
      required: true
      goType: int
    - name: flat
      label: 向量（扁平）
      type: array
      required: true
      desc: len == len(texts) * dims；第 i 条 = flat[i*dims:(i+1)*dims]，与 texts 同序
      itemType: number
    - name: purpose_applied
      label: 实际施加的口径
      type: string
      required: true
      desc: 实现**真正**施加了哪个口径；空 = 没施加（这家没这个概念，或这个模型不支持）
- capability: rerank
  operations:
  - id: rerank
    label: 重排序
    desc: query + 候选文本 → 相关度分数（与输入等长同序）
    timeoutSec: 120
    inputs:
    - name: model
      label: 上游模型名
      type: string
    - name: query
      label: 查询
      type: string
      required: true
    - name: texts
      label: 候选文本
      type: array
      required: true
      itemType: string
    outputs:
    - name: status
      label: 上游状态码
      type: number
      required: true
      goType: int
    - name: scores
      label: 相关度
      type: array
      required: true
      desc: 与 texts 等长同序
      itemType: number
    - name: score_scale
      label: 分数量纲
      type: string
      required: true
      desc: normalized_01 = 分数在 [0,1]，可直接与阈值比；unbounded = 原始 logit，可正可负，只能用于排序；留空
        = 端点没说，未知
- capability: speech
  operations:
  - id: speech
    label: 语音合成
    desc: Text to 24 kHz WAV audio; voices stella and tide; language is detected automatically
    timeoutSec: 900
    inputs:
    - name: model
      label: 上游模型名
      type: string
      desc: 由平台路由填入
    - name: text
      label: 文本
      type: text
      required: true
      desc: 要念的文本；风格标签（如 (开心) / [笑]）算文本的一部分，原样透传
    - name: voice
      label: 音色
      type: string
      default: stella
      desc: stella (female) or tide (male)
    - name: format
      label: 格式
      type: string
      default: wav
      desc: wav (default) or pcm16; both return a playable WAV container
    - name: speed
      label: 语速倍率
      type: number
      desc: Not supported by DeepSeek; leave empty
    - name: instructions
      label: 风格指令
      type: text
      desc: Not supported by DeepSeek; leave empty
    - name: sample_rate
      label: 采样率
      type: number
      desc: Fixed at 24000 Hz; leave empty or set 24000
      goType: int
    - name: voice_sample
      label: 音色样本
      type: json
      desc: Not supported by DeepSeek; leave empty
      fields:
      - name: Modality
        label: 模态
        type: string
        required: true
        desc: image / audio / video / document
      - name: MIME
        label: MIME
        type: string
      - name: Form
        label: 形态
        type: string
        required: true
        desc: inline=平台传字节（data URL）；uri=只给地址，模型自己去取
      - name: Value
        label: 取值
        type: string
        required: true
        desc: Form=inline 时是 data URL；Form=uri 时是地址
      goType: MediaPart
    - name: extra_body
      label: 额外 body
      type: json
      desc: 'Optional filter_markdown boolean (upstream default: true)'
      opaque: true
    outputs:
    - name: status
      label: 上游状态码
      type: number
      required: true
      goType: int
    - name: file
      label: Audio file
      type: file
      required: true
    - name: audio
      label: 音频
      type: json
      required: true
      desc: inline data URL；MIME 与容器一致（audio/mpeg / audio/wav）
      fields:
      - name: modality
        label: 模态
        type: string
        required: true
        desc: image / audio / video / document
      - name: mime
        label: MIME
        type: string
      - name: form
        label: 形态
        type: string
        required: true
        desc: inline=data URL；uri=上游给的地址
      - name: value
        label: 取值
        type: string
        required: true
      goType: MediaOut
    - name: sample_rate
      label: 采样率
      type: number
      desc: 0 = 上游没说
      goType: int
    - name: duration_ms
      label: 时长（毫秒）
      type: number
      desc: 0 = 未知
      goType: int
    - name: spoken_text
      label: 实际念的文本
      type: text
      desc: 上游改写过请求文本时（润色 / 自动生成播报稿）给出；空 = 念的就是请求文本
    - name: usage
      label: 计量
      type: json
      desc: characters（字符）/ token 各家能给几项给几项，平台按部署的计价单位取
      fields:
      - name: prompt_tokens
        label: 输入 token
        type: number
        required: true
        goType: int
      - name: completion_tokens
        label: 输出 token
        type: number
        required: true
        goType: int
      - name: total_tokens
        label: 合计
        type: number
        required: true
        goType: int
      - name: cached_prompt_tokens
        label: 缓存命中
        type: number
        goType: int
      - name: characters
        label: 字符数
        type: number
        goType: int
      - name: audio_seconds
        label: 音频秒数
        type: number
      - name: video_seconds
        label: 视频秒数
        type: number
      - name: images
        label: 图片张数
        type: number
        goType: int
      goType: Usage
- capability: transcription
