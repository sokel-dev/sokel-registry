        label: 模态
        type: string
        required: true
        desc: image / audio / video / document
      - name: mime
        label: MIME
        type: string
      - name: form
        label: 形态
        type: string
        required: true
        desc: inline=data URL；uri=上游给的地址
      - name: value
        label: 取值
        type: string
        required: true
      goType: MediaOut
