- capability: content/process
  operations:
  - id: process
    label: Extract document content
    desc: OCR one document into standard content with original file and character
      references. Raw page layout remains available through Recognize a document.
    timeoutSec: 240
    inputs:
    - name: files
      label: Document files
      type: array
      required: true
      desc: Exactly one authorized platform file
      fields:
      - name: id
        type: string
        required: true
      - name: url
        type: string
        required: true
      - name: name
        type: string
        required: true
      - name: mime
        type: string
        required: true
      - name: size
        type: number
        required: true
        goType: int64
      - name: data
        type: array
        required: true
        itemType: number
      goType: File
    - name: options
      label: Options
      type: json
      desc: Defaults to text recognition when no mode is selected.
      fields:
      - name: purpose
        label: Recognition mode
        type: enum
        default: text_recognition
        desc: Defaults to text recognition when no mode is selected.
        options:
        - value: text_recognition
          label: Text recognition
        - value: rich_layout_recognition
          label: Rich layout recognition
      goType: ProcessOptions
    outputs:
    - name: content
      label: Standard content
      type: json
      required: true
      fields:
      - name: schemaVersion
        label: 结构版本
        type: number
        required: true
        desc: 固定为 1；用于校验内容结构版本。
        goType: int
      - name: title
        label: 内容标题
        type: string
        desc: 可选的人类可读标题，例如图片文件名或文章标题。
      - name: sources
        label: 原始来源
        type: array
        required: true
        desc: 1–10,000 个原件或原文；来源 id 在本次内容内唯一。
        fields:
        - name: id
          label: 来源 ID
          type: string
          required: true
          desc: 本次内容内唯一，例如 source-1；供 locators.sourceId 与 assetIds 引用。
        - name: kind
          label: 来源类型
          type: string
          required: true
          desc: text / pdf / image / audio / video / file / web；按原始内容类型填写。
        - name: fileId
          label: 平台原件 ID
          type: string
          desc: 取自 files 的真实 id（旧版 input.files）；与 url、非空 text 至少提供一项，不能虚构。
        - name: url
          label: 原始地址
          type: string
          desc: HTTP(S) 原文或原件地址；不得带用户名密码；与 fileId、非空 text 至少一项。
        - name: mime
          label: 媒体类型
          type: string
          desc: 原件的 MIME，例如 image/png；优先保留平台传入的文件元数据。
        - name: text
          label: 原始文本
          type: string
          desc: 字符定位的基准；与 fileId、url 至少一项非空。
        - name: pages
          label: 页面尺寸
          type: array
          desc: 每页声明 number、width、height；使用 pageNo 或 bbox 时必须声明对应页。
          fields:
          - name: number
            label: 页码
            type: number
            required: true
            desc: 从 1 开始，同一来源中不重复；单张图片使用第 1 页。
            goType: int
          - name: width
            label: 页面宽度
            type: number
            required: true
            desc: 正数，PDF 单位 point，图片单位 pixel；使用原件真实尺寸。
          - name: height
            label: 页面高度
            type: number
            required: true
            desc: 正数，与 width 使用相同单位；用于校验定位区域边界。
        - name: durationMs
          label: 总时长
          type: number
          desc: 音视频长度，单位毫秒，非负；声明后时间定位不得超出此范围。
          goType: int64
      - name: blocks
        label: 内容块
        type: array
        required: true
        desc: 1–10,000 个可检索、可引用的块；text 与 html 合计不超过 16 MiB UTF-8 字节。
        fields:
        - name: id
          label: 块 ID
          type: string
          required: true
          desc: 本次内容内唯一，例如 block-1；供 derivedFrom 关联。
        - name: type
          label: 块类型
          type: string
          required: true
          desc: text / title / list / quote / code / formula / table / image / audio
            / video / file / header / footer / page_number。
        - name: text
          label: 可检索正文
          type: string
          desc: OCR 文字、转写或段落正文；与非空 html、assetIds 至少一项。
        - name: html
          label: HTML 内容
          type: string
          desc: 表格等富文本表达；建议同时提供 text 便于检索。
        - name: assetIds
          label: 引用原件
          type: array
          desc: 填写 sources 的 id，不是平台文件 ID；对应来源须有 fileId 或 url。
          itemType: string
        - name: locators
          label: 来源定位
          type: array
          desc: 指向原件的页、区域、时间或文字范围；与 derivedFrom 至少一项非空。
          fields:
          - name: sourceId
            label: 来源 ID
            type: string
            required: true
            desc: 必须匹配 sources 中的 id；仅提供此字段表示定位到整份来源。
          - name: pageNo
            label: 定位页码
            type: number
            desc: 从 1 开始，必须在对应来源的 pages 中声明；有 bbox 时必填。
            goType: int
          - name: bbox
            label: 定位区域
            type: json
            desc: 矩形 {llx,lly,urx,ury}，非负、宽高为正且不越界；只使用真实坐标，同时提供 pageNo。
            fields:
            - name: llx
              label: 左下角 X 坐标
              type: number
              required: true
              desc: 矩形的 X 下界，须 ≥ 0 且小于 urx；单位由 coordinateSpace 指定。
            - name: lly
              label: 左下角 Y 坐标
              type: number
              required: true
              desc: 矩形的 Y 下界，须 ≥ 0 且小于 ury；先按原件的坐标约定转换。
            - name: urx
              label: 右上角 X 坐标
              type: number
              required: true
              desc: 矩形的 X 上界，须大于 llx 且不超过页面 width。
            - name: ury
              label: 右上角 Y 坐标
              type: number
              required: true
              desc: 矩形的 Y 上界，须大于 lly 且不超过页面 height。
          - name: coordinateSpace
            label: 坐标单位
            type: string
            desc: 有 bbox 时必填：PDF 用 pdf_points，其他来源用 pixels；无 bbox 时省略。
          - name: startMs
            label: 开始时间
            type: number
            desc: 音视频片段开始位置，单位毫秒；与 endMs 同时提供，0 ≤ startMs < endMs。
            goType: int64
          - name: endMs
            label: 结束时间
            type: number
            desc: 音视频片段结束位置，单位毫秒；大于 startMs 且不超过已声明的 durationMs。
            goType: int64
          - name: textRange
            label: 文本范围
            type: array
            desc: '[start,end) 的两个整数；按 Unicode 字符计数且位于 source.text 内，不是字节或 UTF-16
              单元。'
            itemType: number
        - name: derivedFrom
          label: 派生自哪些块
          type: array
          desc: 摘要或合并内容引用已有块 id；必须存在且不能形成循环；与 locators 至少一项非空。
          itemType: string
      goType: Item
    - name: warnings
      label: Warnings
      type: array
      required: true
      itemType: string
- capability: websearch
  operations:
  - id: web_search
    label: Search the web
    desc: 'Search with DeepSeek; supports site:, lang:, before: and after: operators.'
    timeoutSec: 120
    inputs:
    - name: query
      label: Query
      type: string
      required: true
      desc: 1–128 Unicode characters
    - name: count
      label: Result count
      type: number
      default: 10
      goType: int
    - name: ori_question
      label: Original question
      type: string
    - name: localization
      label: Localization IP address
      type: string
    - name: need_content
      label: Include page content
      type: boolean
    - name: lang
      label: Language
      type: string
      desc: 'Appended as a lang: query operator'
    outputs:
    - name: results
      label: Search results
      type: array
      required: true
      fields:
      - name: title
        type: string
        required: true
      - name: url
        type: string
        required: true
      - name: snippet
        type: string
        required: true
      - name: summary
        type: string
        required: true
      - name: content
        type: string
        required: true
      - name: source
        type: string
        required: true
      - name: published
        type: string
        required: true
      - name: site_name
        type: string
        required: true
      - name: site_icon
        type: string
        required: true
      - name: date
        type: string
        required: true
      - name: rerank_score
        type: number
        required: true
      - name: authority
        type: number
        required: true
        goType: int
      goType: SearchResult
    - name: count
      label: Result count
      type: number
      required: true
      goType: int
    - name: answer
      label: Direct answer
      type: string
      required: true
      desc: 'Empty: the search API does not synthesize an answer'
