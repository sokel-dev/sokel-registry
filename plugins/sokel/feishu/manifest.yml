credential:
    fields:
        - desc: 开放平台「开发者后台 → 凭证与基础信息」里的 App ID（cli_ 开头）
          label: App ID
          name: app_id
          required: true
          type: text
        - desc: 同页的 App Secret。只在插件内部换 tenant_access_token，不进节点与日志
          label: App Secret
          name: app_secret
          required: true
          type: secret
        - desc: feishu=国内（open.feishu.cn）；lark=国际版（open.larksuite.com）。默认 feishu
          label: 平台
          name: domain
          options:
            - label: feishu
              value: feishu
            - label: lark
              value: lark
          type: select
events:
    - fields:
        - label: 群 ID
          name: chat_id
          required: true
          type: string
        - label: 群名
          name: chat_name
          type: string
        - label: 拉人者 open_id
          name: inviter_open_id
          type: string
        - desc: 飞书 im.chat.member.bot.added_v1 的原始事件，形状由开放平台定义
          label: 原始事件
          name: raw
          opaque: true
          required: true
          type: json
          types:
            - json
            - array
            - string
            - number
            - boolean
      id: bot_added
      label: bot 被拉进群
    - fields:
        - label: 对话 ID
          name: chat_id
          type: string
        - label: 卡片消息 ID
          name: message_id
          required: true
          type: string
        - label: 点击者 open_id
          name: operator_open_id
          required: true
          type: string
        - desc: 卡片里给按钮配的 value——用它区分点了哪个钮
          label: 按钮值
          name: action_value
          opaque: true
          required: true
          type: json
          types:
            - json
            - array
            - string
            - number
            - boolean
        - desc: 卡片表单收集的值（没有表单则为空），键名由卡片作者定义
          label: 表单值
          name: form_values
          opaque: true
          type: json
          types:
            - json
            - array
            - string
            - number
            - boolean
        - desc: 飞书 card.action.trigger 的原始回调，形状由开放平台定义
          label: 原始事件
          name: raw
          opaque: true
          required: true
          type: json
          types:
            - json
            - array
            - string
            - number
            - boolean
      id: card_action
      label: 卡片按钮点击
    - fields:
        - desc: 回消息用它（receive_id_type=chat_id）
          label: 对话 ID
          name: chat_id
          required: true
          type: string
        - label: 对话类型
          name: chat_type
          options:
            - label: 单聊
              value: p2p
            - label: 群聊
              value: group
          required: true
          type: enum
        - desc: reply_message 认它
          label: 消息 ID
          name: message_id
          required: true
          type: string
        - label: 发送者 open_id
          name: sender_open_id
          required: true
          type: string
        - desc: text/image/file/post/audio…
          label: 消息类型
          name: message_type
          required: true
          type: string
        - desc: text 消息的正文（已去掉 @bot 标记）；非文本消息为空
          label: 文本
          name: text
          type: text
        - label: 是否@了bot
          name: mentioned_bot
          required: true
          type: boolean
        - desc: 飞书 im.message.receive_v1 的原始事件，形状由开放平台定义且随版本增补
          label: 原始事件
          name: raw
          opaque: true
          required: true
          type: json
          types:
            - json
            - array
            - string
            - number
            - boolean
      id: message
      label: 收到消息
events_common:
    - chat_id
operations:
    - desc: 把用户拉进 bot 所在的群（bot 需有拉人权限）
      id: add_chat_members
      inputs:
        - label: 群 ID
          name: chat_id
          required: true
          type: string
        - itemType: string
          label: 成员 open_id 列表
          name: user_open_ids
          required: true
          type: array
      label: 拉人进群
      outputs:
        - desc: 不存在/不可见的用户；全成功时为空
          itemType: string
          label: 未拉进的 ID
          name: invalid_ids
          required: true
          type: array
    - desc: 新增一条记录。fields 键=字段名：文本填字符串、数字填数字、单选填选项名、多选填选项名数组
      id: bitable_create_record
      inputs:
        - desc: 表格 URL 里 base/ 后那串（bascn…）
          label: 多维表格 token
          name: app_token
          required: true
          type: string
        - desc: URL 里 table= 后那串（tbl…）
          label: 数据表 ID
          name: table_id
          required: true
          type: string
        - desc: 键=字段名，值按字段类型：文本→字符串、数字→数字、单选→选项名、多选→数组、日期→毫秒时间戳；形状由表格列配置决定
          label: 字段值
          name: fields
          opaque: true
          required: true
          type: json
      label: 多维表格·加记录
      outputs:
        - label: 记录 ID
          name: record_id
          required: true
          type: string
    - id: bitable_delete_record
      inputs:
        - desc: 表格 URL 里 base/ 后那串（bascn…）
          label: 多维表格 token
          name: app_token
          required: true
          type: string
        - desc: URL 里 table= 后那串（tbl…）
          label: 数据表 ID
          name: table_id
          required: true
          type: string
        - label: 记录 ID
          name: record_id
          required: true
          type: string
      label: 多维表格·删记录
      outputs:
        - label: 成功
          name: ok
          required: true
          type: boolean
    - desc: 按条件查记录。需要 bitable:app 权限，且把多维表格分享给应用（添加为协作者）
      id: bitable_list_records
      inputs:
        - desc: 表格 URL 里 base/ 后那串（bascn…）
          label: 多维表格 token
          name: app_token
          required: true
          type: string
        - desc: URL 里 table= 后那串（tbl…）
          label: 数据表 ID
          name: table_id
          required: true
          type: string
        - desc: 如 CurrentValue.[状态]="待处理"；留空取全部
          label: 筛选公式
          name: filter
          type: string
        - desc: 默认 100，上限 500
          goType: int
          label: 每页条数
          name: page_size
          type: number
        - label: 翻页标记
          name: page_token
          type: string
      label: 多维表格·查记录
      outputs:
        - fields:
            - label: 记录 ID
              name: record_id
              required: true
              type: string
            - desc: 键=字段名，值形状随字段类型（文本串/数字/选项数组…），由多维表格列配置决定
              label: 字段
              name: fields
              opaque: true
              required: true
              type: json
          goType: BitableRecord
          label: 记录列表
          name: records
          required: true
          type: array
        - goType: int
          label: 总数
          name: total
          required: true
          type: number
        - label: 翻页标记
          name: page_token
          required: true
          type: string
        - label: 还有更多
          name: has_more
          required: true
          type: boolean
    - desc: 按 record_id 更新记录的部分字段（没提到的字段不动）
      id: bitable_update_record
      inputs:
        - desc: 表格 URL 里 base/ 后那串（bascn…）
          label: 多维表格 token
          name: app_token
          required: true
          type: string
        - desc: URL 里 table= 后那串（tbl…）
          label: 数据表 ID
          name: table_id
          required: true
          type: string
        - label: 记录 ID
          name: record_id
          required: true
          type: string
        - desc: 键=字段名，值按字段类型；只更新提到的字段
          label: 字段值
          name: fields
          opaque: true
          required: true
          type: json
      label: 多维表格·改记录
      outputs:
        - label: 成功
          name: ok
          required: true
          type: boolean
    - desc: 直调任意开放平台接口（tenant_access_token 由插件管理）。typed 操作没覆盖的能力走这里
      id: call
      inputs:
        - default: POST
          label: HTTP 方法
          name: method
          options:
            - label: GET
              value: GET
            - label: POST
              value: POST
            - label: PUT
              value: PUT
            - label: PATCH
              value: PATCH
            - label: DELETE
              value: DELETE
          type: enum
        - desc: 以 /open-apis/ 开头，如 /open-apis/im/v1/messages?receive_id_type=chat_id
          label: 接口路径
          name: path
          required: true
          type: string
        - desc: 请求体 JSON，键名照飞书开放平台文档；本插件不介入
          label: 请求体
          name: body
          opaque: true
          type: json
      label: 通用调用
      outputs:
        - desc: 0=成功；非 0 时 msg 里有飞书的报错
          goType: int
          label: 业务码
          name: code
          required: true
          type: number
        - label: 说明
          name: msg
          required: true
          type: string
        - desc: 飞书应答的 data 字段，形状随接口而变，由开放平台文档定义
          label: 数据
          name: data
          opaque: true
          required: true
          type: json
          types:
            - json
            - array
            - string
            - number
            - boolean
    - desc: 创建群聊并拉入成员，bot 自动入群
      id: create_chat
      inputs:
        - label: 群名
          name: name
          required: true
          type: string
        - label: 群描述
          name: description
          type: string
        - desc: ou_ 开头；可留空建空群
          itemType: string
          label: 成员 open_id 列表
          name: user_open_ids
          type: array
      label: 建群
      outputs:
        - label: 群 ID
          name: chat_id
          required: true
          type: string
    - desc: 在文档末尾追加 Markdown 内容（日报流水、持续记录类场景）
      id: docx_append
      inputs:
        - desc: docx_create 的产出，或文档 URL 里 docx/ 后那串
          label: 文档 ID
          name: document_id
          required: true
          type: string
        - desc: Markdown，转换规则同 docx_create
          label: 内容
          name: markdown
          required: true
          type: text
      label: 追加到云文档
      outputs:
        - goType: int
          label: 追加的块数
          name: block_count
          required: true
          type: number
    - desc: 新建一篇云文档（docx），可带初始 Markdown 内容。需要 docx:document 权限
      id: docx_create
      inputs:
        - label: 标题
          name: title
          required: true
          type: string
        - desc: 放进哪个文件夹（网盘 URL 里 folder/ 后那串）。留空放在应用自己的空间——**用户在网盘里看不到**，所以通常要填
          label: 文件夹 token
          name: folder_token
          type: string
        - desc: Markdown：# 标题 / 列表 / 代码块 / 引用会转成对应文档块，其余按段落
          label: 初始内容
          name: markdown
          type: text
      label: 创建云文档
      outputs:
        - label: 文档 ID
          name: document_id
          required: true
          type: string
        - label: 文档链接
          name: url
          required: true
          type: string
    - desc: 把文件传到云空间的指定文件夹。与发文件不同：进网盘可长期存、可分享链接
      id: drive_upload
      inputs:
        - label: 文件
          name: file
          required: true
          type: file
        - desc: 网盘 URL 里 folder/ 后那串。**必填**——应用空间里的文件用户看不到
          label: 文件夹 token
          name: folder_token
          required: true
          type: string
      label: 上传到网盘
      outputs:
        - label: 文件 token
          name: file_token
          required: true
          type: string
        - label: 文件链接
          name: url
          required: true
          type: string
    - desc: 按邮箱或手机号换 open_id（发私信前必经的一跳）。需要「通过手机号或邮箱获取用户 ID」权限
      id: get_user
      inputs:
        - desc: 与手机号至少填一个
          label: 邮箱
          name: email
          type: string
        - desc: 带国家码，如 +8613800138000
          label: 手机号
          name: mobile
          type: string
      label: 查用户
      outputs:
        - desc: ou_ 开头；发消息用它
          label: open_id
          name: open_id
          required: true
          type: string
        - desc: 企业内的用户 ID；未授权时为空
          label: user_id
          name: user_id
          type: string
    - desc: 用 app_id/app_secret 换一次 tenant_access_token 并查 bot 信息——token 换不出来即凭证失效
      id: health_check
      label: 检查凭证
      outputs:
        - label: 可用
          name: ok
          required: true
          type: boolean
        - label: bot 名称
          name: bot_name
          required: true
          type: string
        - label: 说明
          name: message
          required: true
          type: string
    - desc: 列出 bot 已加入的群（拿 chat_id 用于发消息）
      id: list_chats
      inputs:
        - desc: 上一批返回的 page_token
          label: 翻页标记
          name: page_token
          type: string
      label: 群列表
      outputs:
        - fields:
            - label: 群 ID
              name: chat_id
              required: true
              type: string
            - label: 群名
              name: name
              required: true
              type: string
            - label: 群描述
              name: description
              type: string
            - label: 群主 open_id
              name: owner_id
              type: string
            - label: 是否外部群
              name: external
              type: boolean
          goType: Chat
          label: 群列表
          name: chats
          required: true
          type: array
        - desc: 还有下一页时非空
          label: 翻页标记
          name: page_token
          required: true
          type: string
        - label: 还有更多
          name: has_more
          required: true
          type: boolean
    - desc: 撤回 bot 自己发的消息（发出 24 小时内）
      id: recall_message
      inputs:
        - label: 消息 ID
          name: message_id
          required: true
          type: string
      label: 撤回消息
      outputs:
        - label: 成功
          name: ok
          required: true
          type: boolean
    - desc: 在会话里回复某条消息（被回复的消息上方有引用）。message_id 通常来自「收到消息」事件
      id: reply_message
      inputs:
        - desc: om_ 开头；来自事件或发送操作的产出
          label: 消息 ID
          name: message_id
          required: true
          type: string
        - desc: 与 markdown 二选一；都填时用 markdown
          label: 文本
          name: text
          type: text
        - desc: 以卡片渲染
          label: Markdown
          name: markdown
          type: text
      label: 回复消息
      outputs:
        - desc: om_ 开头；回复/撤回都认它
          label: 消息 ID
          name: message_id
          required: true
          type: string
        - label: 所在对话 ID
          name: chat_id
          required: true
          type: string
    - desc: 发完整的交互卡片 JSON（按钮/下拉/表单）。按钮点击经「卡片按钮点击」事件回到工作流
      id: send_card
      inputs:
        - desc: 群聊填 chat_id（oc_ 开头）；单聊填对方 open_id（ou_ 开头）或 email
          label: 接收方 ID
          name: receive_id
          required: true
          type: string
        - default: chat_id
          label: ID 类型
          name: receive_id_type
          options:
            - label: 群聊 chat_id（oc_…）
              value: chat_id
            - label: 用户 open_id（ou_…）
              value: open_id
            - label: 用户 user_id
              value: user_id
            - label: 用户 union_id
              value: union_id
            - label: 用户邮箱
              value: email
          type: enum
        - desc: 在飞书「卡片搭建工具」里拼好后把 JSON 粘进来
          label: 卡片 JSON
          name: card
          opaque: true
          required: true
          type: json
      label: 发交互卡片
      outputs:
        - desc: om_ 开头；回复/撤回都认它
          label: 消息 ID
          name: message_id
          required: true
          type: string
        - label: 所在对话 ID
          name: chat_id
          required: true
          type: string
    - desc: 上传文件换 file_key 并发送，两步包成一步
      id: send_file
      inputs:
        - desc: 群聊填 chat_id（oc_ 开头）；单聊填对方 open_id（ou_ 开头）或 email
          label: 接收方 ID
          name: receive_id
          required: true
          type: string
        - default: chat_id
          label: ID 类型
          name: receive_id_type
          options:
            - label: 群聊 chat_id（oc_…）
              value: chat_id
            - label: 用户 open_id（ou_…）
              value: open_id
            - label: 用户 user_id
              value: user_id
            - label: 用户 union_id
              value: union_id
            - label: 用户邮箱
              value: email
          type: enum
        - desc: 任意类型，≤30MB（更大走网盘上传）
          label: 文件
          name: file
          required: true
          type: file
      label: 发文件
      outputs:
        - desc: om_ 开头；回复/撤回都认它
          label: 消息 ID
          name: message_id
          required: true
          type: string
        - label: 所在对话 ID
          name: chat_id
          required: true
          type: string
        - label: 文件 key
          name: file_key
          required: true
          type: string
    - desc: 上传图片换 image_key 并发送，两步包成一步
      id: send_image
      inputs:
        - desc: 群聊填 chat_id（oc_ 开头）；单聊填对方 open_id（ou_ 开头）或 email
          label: 接收方 ID
          name: receive_id
          required: true
          type: string
        - default: chat_id
          label: ID 类型
          name: receive_id_type
          options:
            - label: 群聊 chat_id（oc_…）
              value: chat_id
            - label: 用户 open_id（ou_…）
              value: open_id
            - label: 用户 user_id
              value: user_id
            - label: 用户 union_id
              value: union_id
            - label: 用户邮箱
              value: email
          type: enum
        - desc: jpg/png/webp/gif/bmp，≤10MB
          label: 图片
          name: image
          required: true
          type: file
      label: 发图片
      outputs:
        - desc: om_ 开头；回复/撤回都认它
          label: 消息 ID
          name: message_id
          required: true
          type: string
        - label: 所在对话 ID
          name: chat_id
          required: true
          type: string
        - desc: 可存下来复用，免得重复上传
          label: 图片 key
          name: image_key
          required: true
          type: string
    - desc: 以卡片形式渲染 Markdown（加粗/链接/列表/代码块/分割线）。工作流产出的报告用它最顺手
      id: send_markdown
      inputs:
        - desc: 群聊填 chat_id（oc_ 开头）；单聊填对方 open_id（ou_ 开头）或 email
          label: 接收方 ID
          name: receive_id
          required: true
          type: string
        - default: chat_id
          label: ID 类型
          name: receive_id_type
          options:
            - label: 群聊 chat_id（oc_…）
              value: chat_id
            - label: 用户 open_id（ou_…）
              value: open_id
            - label: 用户 user_id
              value: user_id
            - label: 用户 union_id
              value: union_id
            - label: 用户邮箱
              value: email
          type: enum
        - desc: 卡片头；留空则不带头
          label: 标题
          name: title
          type: string
        - default: blue
          label: 标题色
          name: title_color
          options:
            - label: 蓝
              value: blue
            - label: 浅蓝
              value: wathet
            - label: 青
              value: turquoise
            - label: 绿
              value: green
            - label: 黄
              value: yellow
            - label: 橙
              value: orange
            - label: 红
              value: red
            - label: 洋红
              value: carmine
            - label: 紫
              value: violet
            - label: 紫罗兰
              value: purple
            - label: 灰
              value: grey
          type: enum
        - desc: 飞书 lark_md 方言：**加粗**、[链接](url)、有序/无序列表、`代码`、--- 分割线
          label: Markdown 正文
          name: markdown
          required: true
          type: text
      label: 发 Markdown
      outputs:
        - desc: om_ 开头；回复/撤回都认它
          label: 消息 ID
          name: message_id
          required: true
          type: string
        - label: 所在对话 ID
          name: chat_id
          required: true
          type: string
    - desc: 发一条纯文本；可在文本里用 <at user_id="ou_xxx"></at> @人，或 <at user_id="all"></at> @所有人
      id: send_text
      inputs:
        - desc: 群聊填 chat_id（oc_ 开头）；单聊填对方 open_id（ou_ 开头）或 email
          label: 接收方 ID
          name: receive_id
          required: true
          type: string
        - default: chat_id
          label: ID 类型
          name: receive_id_type
          options:
