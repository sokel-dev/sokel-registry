# Generated by cmd/gen-from-db. The contract comes from ../plugin-builtin/umeng/schema (the plugin's own declaration);
# display name and description come from the platform DB. Original platform id: umeng;
# migration claims it under the same id.
credential:
    fields:
        - desc: 友盟控制台 Android 应用的 AppKey。只推 iOS 可留空
          label: Android AppKey
          name: android_app_key
          type: text
        - label: Android Master Secret
          name: android_master_secret
          type: secret
        - label: iOS AppKey
          name: ios_app_key
          type: text
        - label: iOS Master Secret
          name: ios_master_secret
          type: secret
operations:
    - desc: 撤销**尚未发送**的任务类消息（定时任务/排队中）；已下发的收不回
      id: cancel
      inputs:
        - default: android
          label: 平台
          name: platform
          options:
            - label: Android
              value: android
            - label: iOS
              value: ios
          type: enum
        - label: 任务 ID
          name: task_id
          required: true
          type: string
      label: 撤销任务
      outputs:
        - label: 成功
          name: ok
          required: true
          type: boolean
    - desc: 用配好的平台各查一次（拿一个不存在的任务号问状态）——钥匙错当场暴露，不会真推送
      id: health_check
      label: 检查凭证
      outputs:
        - label: 可用
          name: ok
          required: true
          type: boolean
        - label: 说明
          name: message
          required: true
          type: string
    - desc: 友盟 U-Push：按 device_token 单播/列播（≤500 个），或全量广播。Android 与 iOS 各用各的友盟 App（凭证里按平台配）
      id: push
      inputs:
        - default: android
          label: 平台
          name: platform
          options:
            - label: Android
              value: android
            - label: iOS
              value: ios
          type: enum
        - desc: 多个逗号分隔（≤500）；**留空 = 全量广播**，想清楚再发
          label: 设备 token
          name: device_tokens
          type: string
        - label: 标题
          name: title
          required: true
          type: string
        - label: 内容
          name: body
          required: true
          type: text
        - desc: 自定义键值对，客户端点开通知时拿到；形状由你的 App 约定
          label: 附加参数
          name: extras
          opaque: true
          type: json
        - default: true
          desc: iOS 区分生产/测试证书环境；Android 测试模式只发给测试设备
          label: 生产模式
          name: production
          type: boolean
      label: 推送
      outputs:
        - desc: 广播/列播回任务 ID（可查状态/撤销）；单播是消息类，回 msg_id，无任务统计
          label: 任务 ID
          name: task_id
          required: true
          type: string
    - desc: 查广播/列播任务的下发进度（单播消息类没有任务统计——友盟的约定）
      id: task_status
      inputs:
        - default: android
          label: 平台
          name: platform
          options:
            - label: Android
              value: android
            - label: iOS
              value: ios
          type: enum
        - label: 任务 ID
          name: task_id
          required: true
          type: string
      label: 查任务状态
      outputs:
        - desc: 0排队 1发送中 2完成 3失败 4撤销 5过期 6筛选为空 7定时未开始
          goType: int
          label: 状态码
          name: status
          required: true
          type: number
        - label: 状态
          name: status_text
          required: true
          type: string
        - goType: int
          label: 下发数
          name: sent_count
          required: true
          type: number
        - goType: int
          label: 打开数
          name: open_count
          required: true
          type: number
plugin:
    desc: App 推送的友盟通道：按设备 token 单播/列播，或全量广播。与「阿里云」插件的
    doc: README.md
    label: 友盟推送
    name: umeng
    org: sokel
    version: v1.0.0
deployment:
  targets:
  - kind: container
    ref: ghcr.io/sokel-dev/sokel-plugins/sokel-plugin-umeng:latest
