# Generated by cmd/gen-from-db from the platform DB (one-off migration; see that program's header comment).
# Original platform id: p_s3. Migration MUST claim it under the same id: credentials, channels,
# access groups and model deployments all hold foreign keys to it, so changing the id would silently
# orphan everything users have configured.
credential:
    fields:
        - label: Bucket
          name: bucket
          required: true
          type: text
        - label: Endpoint
          name: endpoint
          placeholder: http://127.0.0.1:9000（AWS 官方留空）
          type: url
        - default: us-east-1
          label: Region
          name: region
          type: text
        - label: Access Key
          name: access_key
          required: true
          type: secret
        - label: Secret Key
          name: secret_key
          required: true
          type: secret
        - label: 库级前缀
          name: prefix
          placeholder: stores/reports
          type: text
        - desc: 公开桶或绑了 CDN 时填，链接永久有效；留空则签发限时直连链接
          label: 对外访问域名
          name: public_base_url
          placeholder: https://cdn.example.com（公开桶/CDN；留空则用限时签名链接）
          type: url
        - default: "true"
          desc: 自建（MinIO 等）用 true；AWS 官方用 false
          label: Path-Style 寻址
          name: path_style
          options:
            - "true"
            - "false"
          type: select
deployment:
    env:
        - default: s3
          desc: 只启用本插件这一个成员（基础容器是全量基础插件合一镜像；token 是单插件身份凭据）
          name: SOKEL_BASE_PLUGINS
          required: true
    note: 平台部署套件已内置同款容器承接本插件，通常无需部署；此命令用于在别的机器上再起一个出站副本（横向扩容/就近出网）。
    targets:
        - kind: container
          ref: ghcr.io/sokel-dev/sokel/sokel-base-plugins:latest
implements:
    - capability: objectstore
      operations:
        - desc: 按前缀列出桶内对象；marker 翻页（对账靠它扫全桶）
          id: object_list
          inputs:
            - label: 前缀
              name: prefix
              type: string
            - desc: 上一页返回的 marker；空=从头
              label: 翻页标记
              name: marker
              type: string
            - default: 1000
              goType: int
              label: 单页上限
              name: limit
              type: number
          label: 列出对象
          outputs:
            - fields:
                - label: 对象 Key
                  name: key
                  required: true
                  type: string
                - goType: int64
                  label: 字节数
                  name: size
                  required: true
                  type: number
                - label: 内容类型
                  name: mime
                  required: true
                  type: string
                - label: ETag
                  name: etag
                  required: true
                  type: string
                - desc: RFC3339
                  label: 更新时间
                  name: updated_at
                  required: true
                  type: string
              goType: Object
              label: 对象列表
              name: objects
              required: true
              type: array
            - desc: 空=已到末页
              label: 下一页标记
              name: marker
              type: string
          timeoutSec: 120
        - desc: 查单个对象的大小/类型/ETag；不存在时 exists=false（不是报错）
          id: object_stat
          inputs:
            - label: 对象 Key
              name: key
              required: true
              type: string
          label: 对象信息
          outputs:
            - label: 是否存在
              name: exists
              required: true
              type: boolean
            - fields:
                - label: 对象 Key
                  name: key
                  required: true
                  type: string
                - goType: int64
                  label: 字节数
                  name: size
                  required: true
                  type: number
                - label: 内容类型
                  name: mime
                  required: true
                  type: string
                - label: ETag
                  name: etag
                  required: true
                  type: string
                - desc: RFC3339
                  label: 更新时间
                  name: updated_at
                  required: true
                  type: string
              goType: Object
              label: 对象信息
              name: object
              type: json
          timeoutSec: 30
        - desc: 把一个平台文件写进桶；同 key 覆盖
          id: object_put
          inputs:
            - label: 对象 Key
              name: key
              required: true
              type: string
            - desc: 平台文件引用；字节由插件经文件通道拉取
              label: 文件
              name: file
              required: true
              type: file
          label: 写入对象
          outputs:
            - fields:
                - label: 对象 Key
                  name: key
                  required: true
                  type: string
                - goType: int64
                  label: 字节数
                  name: size
                  required: true
                  type: number
                - label: 内容类型
                  name: mime
                  required: true
                  type: string
                - label: ETag
                  name: etag
                  required: true
                  type: string
                - desc: RFC3339
                  label: 更新时间
                  name: updated_at
                  required: true
                  type: string
              goType: Object
              label: 写入结果
              name: object
              required: true
              type: json
          timeoutSec: 600
        - desc: 把桶里的对象取回为平台文件引用
          id: object_get
          inputs:
            - label: 对象 Key
              name: key
              required: true
              type: string
            - desc: 空=取 key 的最后一段
              label: 文件名
              name: name
              type: string
          label: 读出对象
          outputs:
            - label: 文件
              name: file
              required: true
              type: file
          timeoutSec: 600
        - desc: 按 key 批量删除；已不存在的视为成功（幂等）
          id: object_delete
          inputs:
            - itemType: string
              label: 对象 Key 列表
              name: keys
              required: true
              type: array
          label: 删除对象
          outputs:
            - goType: int
              label: 删除数
              name: deleted
              required: true
              type: number
          timeoutSec: 120
        - desc: 取对象的可直接访问链接：公开域名（永久）或签名链接（限时）；都不支持则报错，平台退回代理下载
          id: object_link
          inputs:
            - label: 对象 Key
              name: key
              required: true
              type: string
            - default: 900
              desc: 仅签名链接用；公开域名链接忽略它
              goType: int
              label: 有效期(秒)
              name: expires
              type: number
          label: 直连链接
          outputs:
            - label: 链接
              name: url
              required: true
              type: string
            - desc: public=公开域名，永久有效；presigned=签名链接，到期失效
              label: 链接类型
              name: kind
              options:
                - label: 公开域名
                  value: public
                - label: 签名链接
                  value: presigned
              required: true
              type: enum
            - desc: RFC3339；public 为空
              label: 失效时间
              name: expires_at
              type: string
          timeoutSec: 30
operations:
    - desc: 列一次对象（最多 1 条）验证密钥、桶名与区域是否配对
      id: health_check
      label: 检查凭证
      outputs:
        - label: 可用
          name: ok
          required: true
          type: boolean
        - label: 说明
          name: message
          required: true
          type: string
plugin:
    desc: 一份实现覆盖 MinIO / 阿里云 OSS / 腾讯 COS / Cloudflare R2 等 S3 兼容服务——
    label: S3 兼容对象存储
    name: s3
    org: sokel
    version: v1.0.0
