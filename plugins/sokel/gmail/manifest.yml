plugin:
  desc: 读写你的 Gmail：列邮件 / 读邮件 / 发邮件，并可作为事件源——收到新邮件时触发工作流。
  doc: README.md
  label: Gmail
  name: gmail
  org: sokel
  version: v1.0.1

credential:
  auth:
    kind: oauth
    provider: google
    scopes:
      - https://www.googleapis.com/auth/gmail.readonly
  fields:
    - desc: 授权后由平台自动换取，勿手填
      label: 访问令牌（平台注入）
      name: access_token
      type: secret
    - desc: 点凭证行的「授权」获取，勿手填
      label: 刷新令牌（授权获取）
      name: refresh_token
      type: secret
    - desc: 新邮件事件源自动维护，勿手填
      label: 轮询游标
      name: history_id
      type: text

events:
  - fields:
      - label: 邮件 ID
        name: message_id
        required: true
        type: string
      - label: 会话 ID
        name: thread_id
        required: true
        type: string
      - label: 主题
        name: subject
        type: string
      - label: 发件人
        name: from
        type: string
      - label: 收件人
        name: to
        type: string
      - label: 日期
        name: date
        type: string
      - desc: Gmail 给的短摘要，判断要不要细读用
        label: 摘要
        name: snippet
        type: string
      - label: 有附件
        name: has_attachments
        type: boolean
      - desc: 该邮件的标签 id 列表（如 INBOX/UNREAD/CATEGORY_PROMOTIONS）
        itemType: string
        label: 标签
        name: label_ids
        type: array
    id: message_received
    label: 收到新邮件

operations:
  - id: gmail_attachment
    inputs:
      - label: 邮件 ID
        name: message_id
        required: true
        type: string
      - desc: 来自「读邮件」输出的 attachments
        label: 附件 ID
        name: attachment_id
        required: true
        type: string
      - desc: 落盘用；留空则用附件自带的名字
        label: 文件名
        name: filename
        type: string
    label: 取附件
    outputs:
      - label: 附件文件
        name: file
        required: true
        type: file
  - id: gmail_get
    inputs:
      - desc: 来自「列邮件」或新邮件事件
        label: 邮件 ID
        name: message_id
        required: true
        type: string
    label: 读邮件
    outputs:
      - label: 邮件 ID
        name: id
        required: true
        type: string
      - label: 会话 ID
        name: thread_id
        required: true
        type: string
      - label: 主题
        name: subject
        type: string
      - label: 发件人
        name: from
        type: string
      - label: 收件人
        name: to
        type: string
      - label: 日期
        name: date
        type: string
      - label: 正文（纯文本）
        name: text
        type: text
      - label: 正文（HTML）
        name: html
        type: text
      - label: 摘要
        name: snippet
        type: string
      - desc: 附件清单；字节要用「取附件」再拉
        fields:
          - label: 附件 id
            name: attachment_id
            required: true
            type: string
          - label: 文件名
            name: filename
            required: true
            type: string
          - label: 类型
            name: mime_type
            required: true
            type: string
          - goType: int
            label: 字节数
            name: size
            required: true
            type: number
        goType: AttachmentRef
        label: 附件
        name: attachments
        required: true
        type: array
      - desc: 该邮件的标签 id 列表
        itemType: string
        label: 标签
        name: label_ids
        type: array
  - desc: 打一次 Gmail 的 users.getProfile，报授权是否还有效、授的是哪个邮箱
    id: health_check
    label: 检查凭证
    outputs:
      - label: 可用
        name: ok
        required: true
        type: boolean
      - label: 邮箱
        name: email
        type: string
      - goType: int
        label: 邮件总数
        name: messages_total
        type: number
      - label: 说明
        name: message
        required: true
        type: string
  - id: gmail_list
    inputs:
      - desc: 与 Gmail 搜索框同一套语法，如 is:unread from:boss@x.com newer_than:2d
        label: 搜索条件
        name: query
        type: string
      - desc: 逗号分隔，如 INBOX,UNREAD
        label: 标签
        name: label_ids
        type: string
      - desc: 默认 20，上限 100
        goType: int
        label: 最多几封
        name: max_results
        type: number
      - desc: 勾选后逐封拉详情（慢且更耗配额）；只要 id 就别勾
        label: 同时取正文
        name: with_detail
        type: boolean
    label: 列邮件
    outputs:
      - desc: 邮件列表；with_detail=false 时每项只有 id/thread_id 有值
        fields:
          - label: 邮件 id
            name: id
            required: true
            type: string
          - label: 会话 id
            name: thread_id
            required: true
            type: string
          - desc: 需 with_detail=true；否则为空
            label: 主题
            name: subject
            type: string
          - desc: 需 with_detail=true；否则为空
            label: 发件人
            name: from
            type: string
          - desc: 需 with_detail=true；否则为空
            label: 收件人
            name: to
            type: string
          - desc: 需 with_detail=true；否则为空
            label: 日期
            name: date
            type: string
          - desc: 需 with_detail=true；否则为空
            label: 正文(纯文本)
            name: text
            type: string
          - desc: 需 with_detail=true；否则为空
            label: 正文(HTML)
            name: html
            type: string
          - desc: 需 with_detail=true；否则为空
            label: 摘要
            name: snippet
            type: string
          - desc: 需 with_detail=true；否则为空
            fields:
              - label: 附件 id
                name: attachment_id
                required: true
                type: string
              - label: 文件名
                name: filename
                required: true
                type: string
              - label: 类型
                name: mime_type
                required: true
                type: string
              - goType: int
                label: 字节数
                name: size
                required: true
                type: number
            label: 附件
            name: attachments
            type: array
          - desc: 需 with_detail=true；否则为空
            itemType: string
            label: 标签
            name: label_ids
            type: array
          - label: 错误
            name: error
            type: string
        goType: MessageItem
        label: 邮件
        name: messages
        required: true
        type: array
      - goType: int
        label: 条数
        name: count
        required: true
        type: number
      - label: 下一页令牌
        name: next_page_token
        type: string
deployment:
  targets:
  - kind: container
    ref: ghcr.io/sokel-dev/sokel-plugin-gmail:1.0.1@sha256:91c8cac384f692d8d6877deaa3781c82fa8e58778bbd275940f0fec2c628acf5
