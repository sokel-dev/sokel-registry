credential:
    auth:
        kind: oauth
        provider: threads
        scopes:
            - threads_basic
            - threads_content_publish
    fields:
        - desc: 点「授权」后由平台写入，勿手填。**60 天到期**且 Threads 没有刷新令牌——到期后重新点一次「授权」即可
          label: 访问令牌（授权注入）
          name: access_token
          type: secret
        - desc: 如 http://127.0.0.1:7897；部署环境直连不了 graph.threads.net 时必填
          label: 出站代理
          name: proxy
          type: text
operations:
    - desc: 查一次账号与**剩余发布额度**（每 24 小时 250 条）。ok=false 多半是令牌 60 天到期了
      id: health_check
      label: 检查凭证
      outputs:
        - label: 凭证可用
          name: ok
          required: true
          type: boolean
        - label: 说明
          name: message
          required: true
          type: string
        - label: 账号
          name: username
          type: string
        - goType: int
          label: 24 小时内已发
          name: quota_used
          type: number
        - goType: int
          label: 24 小时配额
          name: quota_total
          type: number
    - desc: 发一条 Threads（建容器 + 发布两步已包在里面），可带图/视频或回复别人
      id: th_post_create
      inputs:
        - desc: 上限 500 字符
          label: 正文
          name: text
          required: true
          type: text
        - desc: 最多 20 个（多个自动变成轮播）。Threads 会**自己去下载**这些文件，所以它们必须公网可达——绑平台文件即可，平台会给带签名的地址
          itemType: file
          label: 图片/视频
          name: media
          type: array
        - desc: 已经在公网上的图片/视频地址；与上面的文件二选一或混用
          itemType: string
          label: 媒体地址
          name: media_urls
          type: array
        - desc: 填了就是回复
          label: 回复给（帖子 id）
          name: reply_to_id
          type: string
        - default: everyone
          label: 谁能回复
          name: reply_control
          options:
            - label: 所有人可回复
              value: everyone
            - label: 仅我关注的人
              value: accounts_you_follow
            - label: 仅被提及的人
              value: mentioned_only
          type: enum
      label: 发帖
      outputs:
        - label: 帖子 id
          name: id
          required: true
          type: string
        - desc: 可直接点开或发进通知
          label: 链接
          name: url
          required: true
          type: string
    - desc: 把多段文本发成一串首尾相连的帖子；第一条可带媒体
      id: th_post_thread
      inputs:
        - desc: 按顺序逐条发出，后一条自动回复前一条。本操作不替你断句
          itemType: string
          label: 每条正文
          name: texts
          required: true
          type: array
        - label: 接在谁后面
          name: reply_to_id
          type: string
        - itemType: file
          label: 首条的媒体
          name: media
          type: array
        - default: 1000
          desc: 默认 1000。Threads 的发布是异步的，间隔太短容易撞上「上一条还没就绪」
          goType: int
          label: 每条之间停顿（毫秒）
          name: interval_ms
          type: number
      label: 发帖串
      outputs:
        - desc: 按发出顺序；中途失败时是**已经发出去的那几条**
          itemType: string
          label: 各条 id
          name: ids
          required: true
          type: array
        - label: 首条 id
          name: root_id
          required: true
          type: string
        - label: 首条链接
          name: root_url
          required: true
          type: string
        - goType: int
          label: 发出条数
          name: count
          required: true
          type: number
plugin:
    desc: 发帖、发帖串。免费、无按次计费；受众规模是这批海外渠道里最大的之一。
    doc: README.md
    label: Threads
    name: threads
    org: sokel
    version: v1.0.0
deployment:
  targets:
  - kind: container
    ref: registry.cn-hangzhou.aliyuncs.com/wisburg/sokel-plugin-threads:latest
