plugin:
  desc: 取视频信息、下载视频/音频、抓字幕文本（基于 yt-dlp）
  doc: README.md
  label: YouTube
  name: youtube
  version: v0.2.1
  org: sokel

operations:
  - desc: 只读元数据，不下载。用来在下载前判断时长/体积，或只需要标题与简介时。
    id: video_info
    inputs:
      - desc: 视频页地址或 11 位 video id
        label: 视频链接
        name: url
        required: true
        type: string
    label: 取视频信息
    outputs:
      - label: 视频 ID
        name: id
        required: true
        type: string
      - label: 标题
        name: title
        required: true
        type: string
      - label: 频道
        name: uploader
        type: string
      - desc: YYYY-MM-DD
        label: 发布日期
        name: upload_date
        type: string
      - goType: int
        label: 时长(秒)
        name: duration_seconds
        required: true
        type: number
      - goType: int
        label: 播放量
        name: view_count
        type: number
      - label: 简介
        name: description
        type: text
      - label: 封面链接
        name: thumbnail
        type: string
      - label: 规范链接
        name: webpage_url
        required: true
        type: string
      - label: 是否直播
        name: is_live
        type: boolean
      - desc: 含自动生成的字幕
        itemType: string
        label: 可用字幕语言
        name: subtitle_langs
        type: array
      - fields:
          - label: 格式 ID
            name: format_id
            required: true
            type: string
          - label: 容器
            name: ext
            type: string
          - goType: int
            label: 高度
            name: height
            type: number
          - goType: int
            label: 帧率
            name: fps
            type: number
          - desc: 上游没给时为 0
            label: 体积(MB)
            name: filesize_mb
            type: number
        goType: Format
        label: 可选清晰度
        name: formats
        type: array
    timeoutSec: 120
  - desc: 下载后把文件交回平台，画布里流转的是文件引用。**这是重活**：默认超时 15 分钟， 且默认限制 720p / 512MB——不限的话一条 4K 长视频能把磁盘和上传通道占满。
    id: download
    inputs:
      - label: 视频链接
        name: url
        required: true
        type: string
      - default: "720"
        label: 清晰度
        name: quality
        options:
          - label: 480p
            value: "480"
          - label: 720p（默认）
            value: "720"
          - label: 1080p
            value: "1080"
          - label: 最高（可能很大）
            value: best
        type: enum
      - desc: 填了就忽略「清晰度」，直接下 video_info 列出的那个 format_id。 很多下载站的「质量列表」就是这么来的：先列上游已有的流，再让你点一个。
        label: 指定格式
        name: format_id
        type: string
      - default: 512
        desc: 超过就**不下载**、直接报错——比下到一半失败可读得多。**填 0 = 不限**。 平台侧的分块上传本身没有体积上限，真正的天花板是插件容器的磁盘与本操作的超时； 默认给 512 只是因为「不限」意味着第一个粘 4K 长视频链接的人就能把磁盘填满， 而那种故障看起来跟下载毫无关系。
        goType: int
        label: 体积上限(MB)
        name: max_filesize_mb
        type: number
      - desc: 留空则用视频标题
        label: 文件名
        name: filename
        type: string
    label: 下载视频
    outputs:
      - label: 文件
        name: file
        required: true
        type: file
      - label: 标题
        name: title
        required: true
        type: string
      - goType: int
        label: 时长(秒)
        name: duration_seconds
        required: true
        type: number
      - label: 体积(MB)
        name: filesize_mb
        required: true
        type: number
      - label: 容器
        name: ext
        required: true
        type: string
      - label: 规范链接
        name: webpage_url
        required: true
        type: string
      - desc: 高清视频在上游是「视频轨 + 音频轨」两条流，取回来要用 ffmpeg 合并成一个文件 （只是换容器，不重新编码，很快）。360p 及以下上游有单文件版，直接下就行。
        label: 是否做了合并
        name: merged
        required: true
        type: boolean
    timeoutSec: 900
  - desc: 只取音频轨。**默认不转码**——上游的音频本来就是独立的一条流，原样拿下来最快也无损失。 指定 mp3/m4a/opus 时才会用 ffmpeg 转一道（慢一点、且是有损再压一次）。
    id: download_audio
    inputs:
      - label: 视频链接
        name: url
        required: true
        type: string
      - default: source
        label: 音频格式
        name: audio_format
        options:
          - label: 原样（不转码，最快）
            value: source
          - label: MP3（转码，通用性最好）
            value: mp3
          - label: M4A/AAC（转码）
            value: m4a
          - label: Opus（转码，同码率音质最好）
            value: opus
        type: enum
      - default: "192"
        desc: 只在转码时有意义；原样下载时上游给多少就是多少。
        label: 码率
        name: bitrate
        options:
          - value: "128"
          - value: "192"
          - value: "256"
          - value: "320"
        type: enum
      - default: 256
        desc: 填 0 = 不限。音频通常只有视频的十分之一，很少撞上
        goType: int
        label: 体积上限(MB)
        name: max_filesize_mb
        type: number
      - desc: 留空则用视频标题
        label: 文件名
        name: filename
        type: string
    label: 下载音频
    outputs:
      - label: 文件
        name: file
        required: true
        type: file
      - label: 标题
        name: title
        required: true
        type: string
      - goType: int
        label: 时长(秒)
        name: duration_seconds
        required: true
        type: number
      - label: 体积(MB)
        name: filesize_mb
        required: true
        type: number
      - label: 容器
        name: ext
        required: true
        type: string
      - label: 编码
        name: codec
        type: string
      - desc: true = 经 ffmpeg 重新编码（有损）；false = 上游原始音频轨，逐字节没动过。
        label: 是否转过码
        name: transcoded
        required: true
        type: boolean
      - label: 规范链接
        name: webpage_url
        required: true
        type: string
    timeoutSec: 600
  - desc: 取字幕并转成纯文本（去时间轴、去重复行）。优先人工字幕，没有就用自动生成的。 不下载视频本身，比「下载→转写」快一个数量级，也不花转写的钱。
    id: transcript
    inputs:
      - label: 视频链接
        name: url
        required: true
        type: string
      - default: zh-Hans
        desc: 按 BCP-47 前缀匹配，如 zh / zh-Hans / en；没有该语言时回落到第一个可用字幕
        label: 语言
        name: lang
        type: string
    label: 抓字幕文本
    outputs:
      - label: 字幕文本
        name: text
        required: true
        type: text
      - label: 实际语言
        name: lang_used
        required: true
        type: string
      - desc: 自动字幕有错字，用于摘要可以，用于引用要核对
        label: 是否自动生成
        name: automatic
        required: true
        type: boolean
      - label: 标题
        name: title
        required: true
        type: string
      - goType: int
        label: 字符数
        name: char_count
        required: true
        type: number
    timeoutSec: 300
  - desc: 平台约定的保留 id。这里没有凭证，检的是 yt-dlp 与 ffmpeg 在不在、以及出网通不通。
    id: health_check
    label: 凭证体检
    outputs:
      - label: 可用
        name: ok
        required: true
        type: boolean
      - label: 说明
        name: message
        type: string

codegen:
  - lang: python
    out: sokel_gen.py
deployment:
  targets:
  - kind: container
    ref: ghcr.io/sokel-dev/sokel-plugin-youtube:0.2.1@sha256:8bb513ccc0b973c0e9b70a0c7d6f162dacdf4348df5e76c158aff03b03388638
