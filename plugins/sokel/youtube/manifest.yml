plugin:
  desc: 取视频信息、下载视频/音频、抓字幕文本（基于 yt-dlp）
  doc: README.md
  label: YouTube
  name: youtube
  version: v0.4.1
  org: sokel

credential:
  fields:
    - help: 粘贴 Netscape 格式 cookies.txt 的完整内容；留空使用部署配置或匿名访问。
      label: 登录 Cookies
      name: cookies
      type: secret
    - help: 可选，填写插件进程可访问的代理地址；留空使用 YTDLP_PROXY。
      label: 代理地址
      name: proxy
      type: secret

operations:
  - desc: 按频道列表顺序获取最近的视频、Shorts 或直播记录，仅取元数据，不下载媒体；可选 cookies 与代理凭证。
    id: channel_latest
    inputs:
      - desc: 频道链接或 @账号，例如 https://www.youtube.com/@YouTube
        label: 频道账号
        name: channel
        required: true
        type: string
      - default: videos
        label: 发布类型
        name: content_type
        options:
          - label: 视频
            value: videos
          - label: Shorts
            value: shorts
          - label: 直播记录
            value: streams
        type: enum
      - default: 10
        desc: 1 到 50；默认最近 10 条
        goType: int
        label: 返回条数
        name: limit
        type: number
      - default: all
        desc: 仅按上游明确标记筛选；未知权限不会归入公开，空结果不代表没有公开视频。
        label: 访问权限筛选
        name: access_filter
        options:
          - label: 全部
            value: all
          - label: 仅明确公开
            value: public
          - label: 仅会员专享
            value: members_only
        type: enum
      - default: 50
        desc: 1 到 50；筛选或本批时间排序时必须不小于返回条数。仅处理该范围，结果可能不足返回条数。
        goType: int
        label: 扫描上限
        name: scan_limit
        type: number
    label: 获取账号最新发布
    outputs:
      - label: 频道名称
        name: channel_name
        type: string
      - label: 频道 ID
        name: channel_id
        type: string
      - label: 频道链接
        name: channel_url
        required: true
        type: string
      - goType: int
        label: 返回数量
        name: count
        required: true
        type: number
      - desc: 本次扫描范围内去重后的有效视频数，不是全站总数
        goType: int
        label: 已检查视频数
        name: scanned_count
        type: number
      - desc: 已检查视频中权限未明确标记的数量；筛选公开或会员时排除
        goType: int
        label: 权限未知数
        name: unknown_access_count
        type: number
      - fields:
          - label: 视频 ID
            name: id
            required: true
            type: string
          - label: 标题
            name: title
            type: string
          - label: 视频链接
            name: url
            required: true
            type: string
          - desc: YYYY-MM-DD；可能由相对时间估算，请结合时间精度字段；缺失为空
            label: 发布日期
            name: upload_date
            type: string
          - goType: int
            label: 时长(秒)
            name: duration_seconds
            type: number
          - goType: int
            label: 播放量
            name: view_count
            type: number
          - label: 封面链接
            name: thumbnail
            type: string
          - label: 直播状态
            name: live_status
            type: string
          - desc: public=公开；subscriber_only=频道会员；premium_only=Premium；private=私密；unlisted=不公开列出；needs_auth=需登录；unknown=未知。不保证当前账号可播放。
            label: 访问权限
            name: availability
            type: string
          - desc: ISO 8601 UTC；由列表相对时间估算，不是精确发布时间；缺失为空
            label: 估算发布时间
            name: published_at
            type: string
          - desc: approximate=相对时间估算；date=仅日期；unknown=未知
            label: 发布时间精度
            name: published_time_precision
            type: string
          - desc: ISO 8601 UTC；可能是未来预约时间，不等同于上传时间；缺失为空
            label: 直播或首映时间
            name: release_at
            type: string
          - desc: false 时 duration_seconds 的 0 只是缺省值
            label: 时长是否已知
            name: duration_known
            type: boolean
          - desc: false 时 view_count 的 0 只是缺省值
            label: 播放量是否已知
            name: view_count_known
            type: boolean
          - desc: 上游列表提供的摘要，可能截断或为空
            label: 简介
            name: description
            type: string
          - label: 频道名称
            name: channel_name
            type: string
          - label: 频道 ID
            name: channel_id
            type: string
          - label: 频道链接
            name: channel_url
            type: string
        goType: ChannelVideo
        label: 发布列表
        name: videos
        type: array
    timeoutSec: 120
  - desc: 按关键词搜索全站视频；可保留相关度顺序，或在扫描范围内按发布时间排序。仅取元数据，不下载媒体。
    id: search
    inputs:
      - desc: 1 到 500 个字符；作为完整关键词搜索，不执行输入中的链接或指令
        label: 搜索关键词
        name: query
        required: true
        type: string
      - default: relevance
        label: 排序方式
        name: sort
        options:
          - label: 相关度
            value: relevance
          - label: 本批按发布时间
            value: date
        type: enum
      - default: 10
        desc: 1 到 50；默认 10 条
        goType: int
        label: 返回条数
        name: limit
        type: number
      - default: all
        desc: 仅按上游明确标记筛选；未知权限不会归入公开，空结果不代表没有公开视频。
        label: 访问权限筛选
        name: access_filter
        options:
          - label: 全部
            value: all
          - label: 仅明确公开
            value: public
          - label: 仅会员专享
            value: members_only
        type: enum
      - default: 50
        desc: 1 到 50；筛选或本批时间排序时必须不小于返回条数。仅处理该范围，结果可能不足返回条数。
        goType: int
        label: 扫描上限
        name: scan_limit
        type: number
    label: 全站搜索视频
    outputs:
      - label: 搜索关键词
        name: query
        required: true
        type: string
      - goType: int
        label: 返回数量
        name: count
        required: true
        type: number
      - desc: 本次扫描范围内去重后的有效视频数，不是全站总数
        goType: int
        label: 已检查视频数
        name: scanned_count
        type: number
      - desc: 已检查视频中权限未明确标记的数量；筛选公开或会员时排除
        goType: int
        label: 权限未知数
        name: unknown_access_count
        type: number
      - fields:
          - label: 视频 ID
            name: id
            required: true
            type: string
          - label: 标题
            name: title
            type: string
          - label: 视频链接
            name: url
            required: true
            type: string
          - desc: YYYY-MM-DD；可能由相对时间估算，请结合时间精度字段；缺失为空
            label: 发布日期
            name: upload_date
            type: string
          - goType: int
            label: 时长(秒)
            name: duration_seconds
            type: number
          - goType: int
            label: 播放量
            name: view_count
            type: number
          - label: 封面链接
            name: thumbnail
            type: string
          - label: 直播状态
            name: live_status
            type: string
          - desc: public=公开；subscriber_only=频道会员；premium_only=Premium；private=私密；unlisted=不公开列出；needs_auth=需登录；unknown=未知。不保证当前账号可播放。
            label: 访问权限
            name: availability
            type: string
          - desc: ISO 8601 UTC；由列表相对时间估算，不是精确发布时间；缺失为空
            label: 估算发布时间
            name: published_at
            type: string
          - desc: approximate=相对时间估算；date=仅日期；unknown=未知
            label: 发布时间精度
            name: published_time_precision
            type: string
          - desc: ISO 8601 UTC；可能是未来预约时间，不等同于上传时间；缺失为空
            label: 直播或首映时间
            name: release_at
            type: string
          - desc: false 时 duration_seconds 的 0 只是缺省值
            label: 时长是否已知
            name: duration_known
            type: boolean
          - desc: false 时 view_count 的 0 只是缺省值
            label: 播放量是否已知
            name: view_count_known
            type: boolean
          - desc: 上游列表提供的摘要，可能截断或为空
            label: 简介
            name: description
            type: string
          - label: 频道名称
            name: channel_name
            type: string
          - label: 频道 ID
            name: channel_id
            type: string
          - label: 频道链接
            name: channel_url
            type: string
        goType: ChannelVideo
        label: 视频列表
        name: videos
        type: array
    timeoutSec: 120
  - desc: 只读元数据，不下载。用来在下载前判断时长/体积，或只需要标题与简介时。
    id: video_info
    inputs:
      - desc: 视频页地址或 11 位 video id
        label: 视频链接
        name: url
        required: true
        type: string
    label: 取视频信息
    outputs:
      - label: 视频 ID
        name: id
        required: true
        type: string
      - label: 标题
        name: title
        required: true
        type: string
      - label: 频道
        name: uploader
        type: string
      - desc: YYYY-MM-DD
        label: 发布日期
        name: upload_date
        type: string
      - goType: int
        label: 时长(秒)
        name: duration_seconds
        required: true
        type: number
      - goType: int
        label: 播放量
        name: view_count
        type: number
      - label: 简介
        name: description
        type: text
      - label: 封面链接
        name: thumbnail
        type: string
      - label: 规范链接
        name: webpage_url
        required: true
        type: string
      - label: 是否直播
        name: is_live
        type: boolean
      - desc: 含自动生成的字幕
        itemType: string
        label: 可用字幕语言
        name: subtitle_langs
        type: array
      - fields:
          - label: 格式 ID
            name: format_id
            required: true
            type: string
          - label: 容器
            name: ext
            type: string
          - goType: int
            label: 高度
            name: height
            type: number
          - goType: int
            label: 帧率
            name: fps
            type: number
          - desc: 上游没给时为 0
            label: 体积(MB)
            name: filesize_mb
            type: number
        goType: Format
        label: 可选清晰度
        name: formats
        type: array
    timeoutSec: 120
  - desc: 下载后把文件交回平台，画布里流转的是文件引用。**这是重活**：默认超时 15 分钟， 且默认限制 720p / 512MB——不限的话一条 4K 长视频能把磁盘和上传通道占满。
    id: download
    inputs:
      - label: 视频链接
        name: url
        required: true
        type: string
      - default: "720"
        label: 清晰度
        name: quality
        options:
          - label: 480p
            value: "480"
          - label: 720p（默认）
            value: "720"
          - label: 1080p
            value: "1080"
          - label: 最高（可能很大）
            value: best
        type: enum
      - desc: 填了就忽略「清晰度」，直接下 video_info 列出的那个 format_id。 很多下载站的「质量列表」就是这么来的：先列上游已有的流，再让你点一个。
        label: 指定格式
        name: format_id
        type: string
      - default: 512
        desc: 超过就**不下载**、直接报错——比下到一半失败可读得多。**填 0 = 不限**。 平台侧的分块上传本身没有体积上限，真正的天花板是插件容器的磁盘与本操作的超时； 默认给 512 只是因为「不限」意味着第一个粘 4K 长视频链接的人就能把磁盘填满， 而那种故障看起来跟下载毫无关系。
        goType: int
        label: 体积上限(MB)
        name: max_filesize_mb
        type: number
      - desc: 留空则用视频标题
        label: 文件名
        name: filename
        type: string
    label: 下载视频
    outputs:
      - label: 文件
        name: file
        required: true
        type: file
      - label: 标题
        name: title
        required: true
        type: string
      - goType: int
        label: 时长(秒)
        name: duration_seconds
        required: true
        type: number
      - label: 体积(MB)
        name: filesize_mb
        required: true
        type: number
      - label: 容器
        name: ext
        required: true
        type: string
      - label: 规范链接
        name: webpage_url
        required: true
        type: string
      - desc: 高清视频在上游是「视频轨 + 音频轨」两条流，取回来要用 ffmpeg 合并成一个文件 （只是换容器，不重新编码，很快）。360p 及以下上游有单文件版，直接下就行。
        label: 是否做了合并
        name: merged
        required: true
        type: boolean
    timeoutSec: 900
  - desc: 只取音频轨。**默认不转码**——上游的音频本来就是独立的一条流，原样拿下来最快也无损失。 指定 mp3/m4a/opus 时才会用 ffmpeg 转一道（慢一点、且是有损再压一次）。
    id: download_audio
    inputs:
      - label: 视频链接
        name: url
        required: true
        type: string
      - default: source
        label: 音频格式
        name: audio_format
        options:
          - label: 原样（不转码，最快）
            value: source
          - label: MP3（转码，通用性最好）
            value: mp3
          - label: M4A/AAC（转码）
            value: m4a
          - label: Opus（转码，同码率音质最好）
            value: opus
        type: enum
      - default: "192"
        desc: 只在转码时有意义；原样下载时上游给多少就是多少。
        label: 码率
        name: bitrate
        options:
          - value: "128"
          - value: "192"
          - value: "256"
          - value: "320"
        type: enum
      - default: 256
        desc: 填 0 = 不限。音频通常只有视频的十分之一，很少撞上
        goType: int
        label: 体积上限(MB)
        name: max_filesize_mb
        type: number
      - desc: 留空则用视频标题
        label: 文件名
        name: filename
        type: string
    label: 下载音频
    outputs:
      - label: 文件
        name: file
        required: true
        type: file
      - label: 标题
        name: title
        required: true
        type: string
      - goType: int
        label: 时长(秒)
        name: duration_seconds
        required: true
        type: number
      - label: 体积(MB)
        name: filesize_mb
        required: true
        type: number
      - label: 容器
        name: ext
        required: true
        type: string
      - label: 编码
        name: codec
        type: string
      - desc: true = 经 ffmpeg 重新编码（有损）；false = 上游原始音频轨，逐字节没动过。
        label: 是否转过码
        name: transcoded
        required: true
        type: boolean
      - label: 规范链接
        name: webpage_url
        required: true
        type: string
    timeoutSec: 600
  - desc: 取字幕并转成纯文本（去时间轴、去重复行）。优先人工字幕，没有就用自动生成的。 不下载视频本身，比「下载→转写」快一个数量级，也不花转写的钱。
    id: transcript
    inputs:
      - label: 视频链接
        name: url
        required: true
        type: string
      - default: zh-Hans
        desc: 按 BCP-47 前缀匹配，如 zh / zh-Hans / en；没有该语言时回落到第一个可用字幕
        label: 语言
        name: lang
        type: string
    label: 抓字幕文本
    outputs:
      - label: 字幕文本
        name: text
        required: true
        type: text
      - label: 实际语言
        name: lang_used
        required: true
        type: string
      - desc: 自动字幕有错字，用于摘要可以，用于引用要核对
        label: 是否自动生成
        name: automatic
        required: true
        type: boolean
      - label: 标题
        name: title
        required: true
        type: string
      - goType: int
        label: 字符数
        name: char_count
        required: true
        type: number
    timeoutSec: 300
  - desc: 检查 cookies 格式、本地工具和代理出网；登录状态是否有效需通过具体视频试调用确认。
    id: health_check
    label: 凭证体检
    outputs:
      - label: 可用
        name: ok
        required: true
        type: boolean
      - label: 说明
        name: message
        type: string

codegen:
  - lang: python
    out: sokel_gen.py
deployment:
  targets:
  - kind: container
    ref: ghcr.io/sokel-dev/sokel-plugin-youtube:0.4.1@sha256:ff93601081dbf5f1c7392a44cf7680afdd4ed9b9d691cf91b04adae3c6fefd93
