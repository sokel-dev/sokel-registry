# The contract section is generated by sokel-gen export yaml ../plugin-builtin/registry-tools/plugin and embedded here.
# Re-export after changing the schema so the registry prefill matches the replica's self-reported contract byte for byte.
plugin:
  name: registry-tools
  org: sokel
  label: 社区分发工具
  desc: 分发管线的构建脚：把审核通过的插件提交集合构建成 index.json 与逐文件产物（发布/下线都由重建 index 表达）；校验与仓库 CLI 同源。
  version: v1.0.0
deployment:
  targets:
  - kind: container
    ref: ghcr.io/sokel-dev/sokel/sokel-base-plugins:latest
  env:
  - name: SOKEL_BASE_PLUGINS
    desc: 只启用本插件这一个成员（基础容器是全量基础插件合一镜像；token 是单插件身份凭据）
    default: registry-tools
    required: true
operations:
  - desc: 校验每份 manifest（分发门准入：版本必填合法、契约真能导出）并产出 index.json 与逐文件内容；任一条目不过门则整体不产出（problems 逐条回显）。可选校验 advisories.json（结构 / ref 必须在索引里 / 版本表达式合法）。
    id: build_index
    inputs:
      - desc: 当前应上架的全部条目——发布=加进来重建，下架=去掉重建（消费端按 delisted 链路处理消失的条目）
        fields:
          - desc: 目录身份 <org>/<name> 的前半；须与 manifest 里的 plugin.org 一致
            label: 组织
            name: org
            required: true
            type: string
          - desc: 目录身份的后半；须与 manifest 里的 plugin.name 一致
            label: 插件名
            name: name
            required: true
            type: string
          - desc: YAML 或 JSON
            label: manifest 原文
            name: manifest
            required: true
            type: string
          - desc: locales/<lang>.json 的内容
            fields:
              - label: 语言
                name: lang
                required: true
                type: string
              - desc: JSON：原文串→译文
                label: 内容
                name: content
                required: true
                type: string
            label: 翻译文件
            name: locales
            type: array
          - desc: README.md 原文（进详情页的说明书）
            label: 使用说明
            name: readme
            type: string
        goType: SubmissionEntry
        label: 提交集合
        name: entries
        required: true
        type: array
      - desc: advisories.json 原文（可选）；校验结构、ref 引用与版本表达式，坏了整体拒绝
        label: 安全通告文件
        name: advisories
        type: string
    label: 构建分发索引
    outputs:
      - desc: false = 有条目不过门，index 为空，看 problems
        label: 是否通过
        name: ok
        required: true
        type: boolean
      - desc: 索引原文（ok=false 时为空）
        label: index.json
        name: index
        type: string
      - desc: manifest / locales / README 逐文件铺开（相对 registry 根），与 index 一起传对象存储
        fields:
          - label: 路径
            name: path
            required: true
            type: string
          - label: 内容
            name: content
            required: true
            type: string
        goType: OutFile
        label: 产物文件
        name: files
        type: array
      - fields:
          - label: 条目
            name: ref
            required: true
            type: string
          - label: 原因
            name: error
            required: true
            type: string
        goType: Problem
        label: 不过门清单
        name: problems
        type: array
