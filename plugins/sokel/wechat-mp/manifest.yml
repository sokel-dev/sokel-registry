credential:
    fields:
        - desc: 公众号后台「设置与开发 → 基本配置」里的开发者 ID
          label: AppID
          name: app_id
          required: true
          type: text
        - desc: 同一页的开发者密码。**只在生成时显示一次**，丢了只能重置（重置会让旧的立刻失效）
          label: AppSecret
          name: app_secret
          required: true
          type: secret
        - desc: 一般不用填（微信在境内）。填了要注意：**白名单认的是出口 IP**，走代理后出口是代理的 IP
          label: 出站代理
          name: proxy
          type: text
operations:
    - desc: 把一篇文章写进公众号草稿箱，产出 media_id。可在后台肉眼复核后再发布
      id: mp_draft_add
      inputs:
        - desc: 最多 64 字
          label: 标题
          name: title
          required: true
          type: string
        - desc: 支持基础 HTML；**不支持 script/iframe/外部样式表**。正文里的图片必须先过「上传图片」换成微信域名的地址，外链图一律显示不出来
          label: 正文（HTML）
          name: content
          required: true
          type: text
        - desc: '**必填**，来自「上传图片」（用途选「封面」）。没有封面图微信直接拒收'
          label: 封面图 media_id
          name: thumb_media_id
          required: true
          type: string
        - label: 作者
          name: author
          type: string
        - desc: 最多 120 字；留空则微信截正文前 54 字
          label: 摘要
          name: digest
          type: text
        - desc: 文末「阅读原文」跳转的地址
          label: 原文链接
          name: content_source_url
          type: string
        - default: false
          label: 开启留言
          name: open_comment
          type: boolean
        - default: false
          label: 仅粉丝可留言
          name: only_fans_comment
          type: boolean
      label: 建草稿
      outputs:
        - desc: 拿它去「发布草稿」
          label: 草稿 media_id
          name: media_id
          required: true
          type: string
    - desc: 换一次 access_token 并查草稿数——顺带验出「IP 不在白名单」与「账号没有发布权限」两种最常见的坑
      id: health_check
      label: 检查凭证
      outputs:
        - label: 凭证可用
          name: ok
          required: true
          type: boolean
        - label: 说明
          name: message
          required: true
          type: string
        - goType: int
          label: 草稿数
          name: draft_count
          type: number
    - desc: 封面图 → media_id；正文配图 → 微信域名的图片地址（外链图在正文里显示不出来）
      id: mp_image_upload
      inputs:
        - desc: JPG/PNG；封面图 ≤10MB，正文配图 ≤1MB（微信的限制）
          label: 图片
          name: file
          required: true
          type: file
        - default: inline
          desc: 两条路的产出不一样：封面要 media_id，正文要地址
          label: 用途
          name: purpose
          options:
            - label: 封面（永久素材，回 media_id）
              value: cover
            - label: 正文配图（回图片地址）
              value: inline
          type: enum
      label: 上传图片
      outputs:
        - desc: 用途选「封面」时有值，绑到「建草稿」的封面图上
          label: 素材 media_id
          name: media_id
          required: true
          type: string
        - desc: 微信域名的地址，拼进正文 HTML 的 <img src>
          label: 图片地址
          name: url
          required: true
          type: string
    - desc: 把草稿发出去并等到发布完成，产出文章链接。**发出的文章不进历史消息**，是永久链接
      id: mp_publish
      inputs:
        - desc: 来自「建草稿」
          label: 草稿 media_id
          name: media_id
          required: true
          type: string
        - default: true
          desc: 关掉则只提交任务、立刻返回 publish_id（拿不到文章链接）。微信的发布是异步的，提交成功不代表发布成功——还可能卡在原创声明或平台审核上
          label: 等到发布完成
          name: wait
          type: boolean
      label: 发布草稿
      outputs:
        - label: 发布任务 id
          name: publish_id
          required: true
          type: string
        - desc: 等到完成才有；可直接点开或发进通知
          label: 文章链接
          name: article_url
          required: true
          type: string
        - desc: success 成功 / publishing 发布中 / original_failed 原创失败 / audit_failed 审核不通过 / …
          label: 发布状态
          name: status
          required: true
          type: string
        - desc: 查阅读量等数据接口要用它
          label: 消息数据 id
          name: msg_data_id
          type: string
plugin:
    desc: 把文章写进草稿箱、发布、拿到永久链接。国内唯一一条「API 正经、金融内容可做、覆盖面够」的主渠道。
    doc: README.md
    label: 微信公众号
    name: wechat-mp
    org: sokel
    version: v1.0.0
deployment:
  targets:
  - kind: container
    ref: registry.cn-hangzhou.aliyuncs.com/wisburg/sokel-plugin-wechat-mp:latest
