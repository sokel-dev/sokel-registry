plugin:
  desc: Browse teams and chats and read or send delegated messages
  doc: README.md
  label: Microsoft Teams
  name: microsoft-teams
  org: sokel
  version: v0.1.1
  icon: icon.svg
credential:
  fields:
  - desc: Global Microsoft Graph delegated token; refresh externally and replace before expiration
    label: Delegated Microsoft Graph access token
    name: access_token
    required: true
    type: secret
operations:
- id: health_check
  label: Check delegated credential
  outputs:
  - label: Available
    name: ok
    required: true
    type: boolean
  - label: Message
    name: message
    required: true
    type: string
  timeoutSec: 60
- id: list_teams
  inputs:
  - desc: Use the exact next_link returned by the previous call; keep resource inputs unchanged
    label: Next-page URL
    name: next_link
    type: string
  label: List joined teams
  outputs:
  - fields:
    - label: Team ID
      name: id
      required: true
      type: string
    - label: Name
      name: name
      required: true
      type: string
    - label: Description
      name: description
      required: true
      type: string
    goType: Team
    label: Teams
    name: teams
    required: true
    type: array
  - label: Next-page URL
    name: next_link
    required: true
    type: string
  timeoutSec: 60
