credential:
    fields:
        - label: API Key
          name: api_key
          placeholder: MiMo API Key
          required: true
          type: secret
        - default: https://api.xiaomimimo.com/v1
          help: 小米 MiMo 开放平台的 OpenAI 兼容地址
          label: Base URL
          name: base_url
          type: url
deployment:
    env:
        - default: xiaomi
          desc: 只启用本插件这一个成员（基础容器是全量基础插件合一镜像；token 是单插件身份凭据）
          name: SOKEL_BASE_PLUGINS
          required: true
    note: 平台部署套件已内置同款容器承接本插件，通常无需部署；此命令用于在别的机器上再起一个出站副本（横向扩容/就近出网）。
    targets:
        - kind: container
          ref: ghcr.io/sokel-dev/sokel/sokel-base-plugins:latest
implements:
    - capability: llm/chat
      operations:
        - desc: 按 canonical 请求调用上游模型，返回完整回答
          id: chat
          inputs:
            - desc: 平台的 canonical 请求（模型名已解析为上游真名）
              fields:
                - label: 上游模型名
                  name: Model
                  required: true
                  type: string
                - label: 系统提示
                  name: System
                  type: string
                - fields:
                    - desc: user / assistant / tool
                      label: 角色
                      name: Role
                      required: true
                      type: string
                    - label: 内容
                      name: Content
                      type: string
                    - fields:
                        - desc: image / audio / video / document
                          label: 模态
                          name: Modality
                          required: true
                          type: string
                        - label: MIME
                          name: MIME
                          type: string
                        - desc: inline=平台传字节（data URL）；uri=只给地址，模型自己去取
                          label: 形态
                          name: Form
                          required: true
                          type: string
                        - desc: Form=inline 时是 data URL；Form=uri 时是地址
                          label: 取值
                          name: Value
                          required: true
                          type: string
                      label: 媒体输入
                      name: Media
                      type: array
                    - fields:
                        - label: 调用 id
                          name: ID
                          required: true
                          type: string
                        - label: 函数名
                          name: Name
                          required: true
                          type: string
                        - desc: 形状由该函数的 JSON Schema 决定，运行期才知道
                          label: 参数
                          name: Args
                          opaque: true
                          type: json
                        - fields:
                            - label: 厂商
                              name: vendor
                              required: true
                              type: string
                            - desc: 厂商私有,平台与别家都不解释
                              label: 数据
                              name: data
                              opaque: true
                              type: json
                          label: 厂商回传状态
                          name: Meta
                          type: json
                      label: 工具调用
                      name: ToolCalls
                      type: array
                    - label: 对应的调用 id
                      name: ToolCallID
                      type: string
                    - fields:
                        - label: 厂商
                          name: vendor
                          required: true
                          type: string
                        - desc: 厂商私有,平台与别家都不解释
                          label: 数据
                          name: data
                          opaque: true
                          type: json
                      label: 厂商回传状态
                      name: Meta
                      type: json
                  label: 对话消息
                  name: Messages
                  required: true
                  type: array
                - label: 随机性
                  name: Temperature
                  type: number
                - goType: int
                  label: 最大输出 token
                  name: MaxTokens
                  type: number
                - label: top_p
                  name: TopP
                  type: number
                - itemType: string
                  label: 停止序列
                  name: Stop
                  type: array
                - fields:
                    - desc: text / json_object / json_schema
                      label: 档位
                      name: Type
                      required: true
                      type: string
                    - desc: 由调用方给出，形状随其业务而定
                      label: JSON Schema
                      name: Schema
                      opaque: true
                      type: json
                    - label: schema 名
                      name: Name
                      type: string
                  label: 结构化输出
                  name: ResponseFormat
                  type: json
                - fields:
                    - desc: off / low / medium / high
                      label: 力度
                      name: Effort
                      type: string
                    - desc: vendor default when empty | reasoning_effort | enable_thinking | thinking | deepseek | thinking_type
                      label: 入参方言
                      name: Style
                      type: string
                  label: 推理
                  name: Reasoning
                  type: json
                - fields:
                    - label: 函数名
                      name: Name
                      required: true
                      type: string
                    - label: 说明
                      name: Description
                      type: string
                    - desc: 函数参数的形状由调用方定义，是任意 JSON Schema
                      label: 参数 JSON Schema
                      name: Parameters
                      opaque: true
                      type: json
                  label: 函数工具
                  name: Tools
                  type: array
                - itemType: string
                  label: 输出模态
                  name: OutputModalities
                  type: array
              goType: ChatReq
              label: 对话请求
              name: chat
              required: true
              type: json
            - desc: 部署级透传给上游的额外 body 字段，形状由上游 API 决定
              label: 额外 body
              name: extra_body
              opaque: true
              type: json
          label: 对话
          outputs:
            - desc: 平台据此判断能力降级与 failover
              goType: int
              label: 上游状态码
              name: status
              required: true
              type: number
            - label: 回答正文
              name: content
              required: true
              type: text
            - label: 结束原因
              name: finish_reason
              type: string
            - label: 思考过程
              name: reasoning
              type: text
            - fields:
                - goType: int
                  label: 输入 token
                  name: prompt_tokens
                  required: true
                  type: number
                - goType: int
                  label: 输出 token
                  name: completion_tokens
                  required: true
                  type: number
                - goType: int
                  label: 合计
                  name: total_tokens
                  required: true
                  type: number
                - goType: int
                  label: 缓存命中
                  name: cached_prompt_tokens
                  type: number
                - goType: int
                  label: 字符数
                  name: characters
                  type: number
                - label: 音频秒数
                  name: audio_seconds
                  type: number
                - label: 视频秒数
                  name: video_seconds
                  type: number
                - goType: int
                  label: 图片张数
                  name: images
                  type: number
              goType: Usage
              label: token 计量
              name: usage
              type: json
            - fields:
                - label: 调用 id
                  name: id
                  required: true
                  type: string
                - label: 函数名
                  name: name
                  required: true
                  type: string
                - desc: 参数形状由该函数的 JSON Schema 决定，运行期才知道
                  label: 参数
                  name: args
                  opaque: true
                  required: true
                  type: json
                - fields:
                    - label: 厂商
                      name: vendor
                      required: true
                      type: string
                    - desc: 厂商私有
                      label: 数据
                      name: data
                      opaque: true
                      type: json
                  label: 厂商回传状态
                  name: meta
                  type: json
              goType: ToolCall
              label: 工具调用
              name: tool_calls
              type: array
            - desc: 结构化输出的结果，形状由调用方给的 JSON Schema 决定
              label: 结构化结果
              name: json
              opaque: true
              type: json
            - desc: 请求的推理语义被就近执行时的一句提示（如 GLM-5.3 家族关不掉思考）；空 = 忠实执行
              label: 推理注记
              name: reasoning_notice
              type: string
            - fields:
                - label: 厂商
                  name: vendor
                  required: true
                  type: string
                - desc: 厂商私有
                  label: 数据
                  name: data
                  opaque: true
                  type: json
              goType: OutMeta
              label: 厂商回传状态
              name: meta
              type: json
            - desc: 模型产出的图 / 音频等（inline=data URL，uri=地址）；只在请求了对应输出模态时出现
              fields:
                - desc: image / audio / video / document
                  label: 模态
                  name: modality
                  required: true
                  type: string
                - label: MIME
                  name: mime
                  type: string
                - desc: inline=data URL；uri=上游给的地址
                  label: 形态
                  name: form
                  required: true
                  type: string
                - label: 取值
                  name: value
                  required: true
                  type: string
              goType: MediaOut
              label: 生成的媒体
              name: media
              type: array
        - desc: 同 chat，但边生成边产出增量
