    - capability: speech
      operations:
        - desc: 文本 → 语音（inline 音频，mp3 / wav）
          id: speech
          inputs:
            - desc: 由平台路由填入
              label: 上游模型名
              name: model
              type: string
            - desc: 要念的文本；风格标签（如 (开心) / [笑]）算文本的一部分，原样透传
              label: 文本
              name: text
              required: true
              type: text
            - desc: 各家自己的音色 id；留空 = 这家的默认音色
              label: 音色
              name: voice
              type: string
            - desc: mp3 / wav / pcm16；留空 = mp3。pcm16 由实现裹成 WAV 交出
              label: 格式
              name: format
              type: string
            - desc: 0 / 留空 = 默认；不支持的家忽略
              label: 语速倍率
              name: speed
              type: number
            - desc: 自然语言的语气 / 情绪 / 角色描述，不会被念出来；不支持的家忽略
              label: 风格指令
              name: instructions
              type: text
            - desc: 0 / 留空 = 默认；不支持的家忽略，实际采样率看出参
              goType: int
              label: 采样率
              name: sample_rate
              type: number
            - desc: 音色复刻的样本音频（inline data URL）；只有支持复刻的模型认它
              fields:
                - desc: image / audio / video / document
                  label: 模态
                  name: Modality
                  required: true
                  type: string
                - label: MIME
                  name: MIME
                  type: string
                - desc: inline=平台传字节（data URL）；uri=只给地址，模型自己去取
                  label: 形态
                  name: Form
                  required: true
                  type: string
                - desc: Form=inline 时是 data URL；Form=uri 时是地址
                  label: 取值
                  name: Value
                  required: true
                  type: string
              goType: MediaPart
              label: 音色样本
              name: voice_sample
              type: json
            - desc: 厂商专属参数，形状由上游 API 决定；已有键不覆盖，对象键下钻一层合并
              label: 额外 body
              name: extra_body
              opaque: true
              type: json
          label: 语音合成
          outputs:
            - goType: int
              label: 上游状态码
              name: status
              required: true
              type: number
            - desc: inline data URL；MIME 与容器一致（audio/mpeg / audio/wav）
              fields:
                - desc: image / audio / video / document
                  label: 模态
                  name: modality
                  required: true
                  type: string
                - label: MIME
                  name: mime
                  type: string
                - desc: inline=data URL；uri=上游给的地址
                  label: 形态
                  name: form
                  required: true
                  type: string
                - label: 取值
                  name: value
                  required: true
                  type: string
              goType: MediaOut
              label: 音频
              name: audio
              required: true
              type: json
            - desc: 0 = 上游没说
              goType: int
              label: 采样率
              name: sample_rate
              type: number
            - desc: 0 = 未知
              goType: int
              label: 时长（毫秒）
              name: duration_ms
              type: number
            - desc: 上游改写过请求文本时（润色 / 自动生成播报稿）给出；空 = 念的就是请求文本
              label: 实际念的文本
              name: spoken_text
              type: text
            - desc: characters（字符）/ token 各家能给几项给几项，平台按部署的计价单位取
              fields:
                - goType: int
                  label: 输入 token
                  name: prompt_tokens
                  required: true
                  type: number
                - goType: int
                  label: 输出 token
                  name: completion_tokens
                  required: true
                  type: number
                - goType: int
                  label: 合计
                  name: total_tokens
                  required: true
                  type: number
                - goType: int
                  label: 缓存命中
                  name: cached_prompt_tokens
                  type: number
                - goType: int
                  label: 字符数
                  name: characters
                  type: number
                - label: 音频秒数
                  name: audio_seconds
                  type: number
                - label: 视频秒数
                  name: video_seconds
                  type: number
                - goType: int
                  label: 图片张数
                  name: images
                  type: number
              goType: Usage
              label: 计量
              name: usage
              type: json
    - capability: transcription
      operations:
        - desc: 音频 → 文本
          id: transcribe
          inputs:
            - desc: 由平台路由填入
              label: 上游模型名
              name: model
              type: string
            - desc: inline data URL（平台把字节交给实现）
              fields:
                - desc: image / audio / video / document
                  label: 模态
                  name: Modality
                  required: true
                  type: string
                - label: MIME
                  name: MIME
                  type: string
                - desc: inline=平台传字节（data URL）；uri=只给地址，模型自己去取
                  label: 形态
                  name: Form
                  required: true
                  type: string
                - desc: Form=inline 时是 data URL；Form=uri 时是地址
                  label: 取值
                  name: Value
                  required: true
                  type: string
              goType: MediaPart
              label: 音频
              name: audio
              required: true
              type: json
            - desc: zh / en…；留空 = 自动检测
              label: 语种
              name: language
              type: string
            - desc: 给识别器的上下文 / 专有名词；不支持的家忽略
              label: 提示
              name: prompt
              type: text
            - desc: 厂商专属参数，形状由上游 API 决定
              label: 额外 body
              name: extra_body
              opaque: true
              type: json
          label: 语音识别
          outputs:
            - goType: int
              label: 上游状态码
              name: status
              required: true
              type: number
            - label: 识别文本
              name: text
              required: true
              type: text
            - desc: 识别出的语种；空 = 上游没说
              label: 语种
              name: language
              type: string
            - desc: 0 = 未知
              goType: int
              label: 时长（毫秒）
              name: duration_ms
              type: number
            - desc: audio_seconds（音频秒数）/ token 各家能给几项给几项
              fields:
                - goType: int
                  label: 输入 token
                  name: prompt_tokens
                  required: true
                  type: number
                - goType: int
                  label: 输出 token
                  name: completion_tokens
                  required: true
                  type: number
                - goType: int
                  label: 合计
                  name: total_tokens
                  required: true
                  type: number
                - goType: int
                  label: 缓存命中
                  name: cached_prompt_tokens
                  type: number
                - goType: int
                  label: 字符数
                  name: characters
                  type: number
                - label: 音频秒数
                  name: audio_seconds
                  type: number
                - label: 视频秒数
                  name: video_seconds
                  type: number
                - goType: int
                  label: 图片张数
                  name: images
                  type: number
              goType: Usage
              label: 计量
              name: usage
              type: json
operations:
    - desc: 拿这条凭证问一次上游「有哪些模型」，给部署编辑的模型名下拉用
      id: list_models
      label: 上游模型列表
      outputs:
        - desc: 与上游返回同集；顺序按 id 稳定排序
          fields:
            - label: 模型 id
              name: id
              required: true
              type: string
            - label: 展示名
              name: label
              type: string
          goType: UpstreamModelRow
          label: 模型列表
          name: models
          required: true
          type: array
    - desc: 拿这条凭证问一次上游的模型列表，验证 key 与 base_url 都对
      id: health_check
      label: 健康检查
      outputs:
        - label: 是否可用
          name: ok
          required: true
          type: boolean
        - desc: 不可用时是原因与下一步；**base_url 填错通常表现为 404 而不是 401**，文案里分开说了
          label: 说明
          name: message
          required: true
          type: string
        - desc: 0 = 没走到 HTTP（网络不通 / 地址解析失败）
          goType: int
          label: 上游状态码
          name: status
          type: number
    - desc: 某语音合成模型可选的预置音色；custom=true 表示可 / 需自由填写（音色复刻、音色设计、兼容网关）
      id: list_voices
      inputs:
        - label: 上游模型名
          name: model
          type: string
      label: 音色列表
      outputs:
        - fields:
            - label: 音色 id
              name: id
              required: true
              type: string
            - label: 展示名
              name: label
              type: string
            - label: 语言
              name: language
              type: string
            - label: 性别
              name: gender
              type: string
            - label: 说明
              name: note
              type: string
          goType: VoiceRow
          label: 音色
          name: voices
          required: true
          type: array
        - label: 可自由填写
          name: custom
          required: true
          type: boolean
        - label: 说明
          name: note
          type: string
plugin:
    desc: 小米 MiMo 系列模型接入（OpenAI 兼容协议）：MiMo-V2.6 对话（thinking 开关）、MiMo-V2.5-TTS 语音合成（预置音色 / 音色设计 / 音色复刻）、MiMo-V2.5-ASR 语音识别。
    label: 小米 MiMo
    name: xiaomi
    org: sokel
    version: v1.0.0
