credential:
  fields:
  - desc: '@BotFather 创建 bot 后给的 token（123456:ABC…）'
    label: Bot Token
    name: bot_token
    required: true
    type: secret
deployment:
  targets:
  - kind: container
    ref: ghcr.io/sokel-dev/sokel-plugins/sokel-plugin-telegram-bot:latest
events:
- fields:
  - goType: int
    label: 对话 ID
    name: chat_id
    required: true
    type: number
  - goType: int
    label: 点击者 ID
    name: user_id
    required: true
    type: number
  - desc: 用于 answer_callback_query
    label: 回调 ID
    name: callback_id
    required: true
    type: string
  - label: 按钮数据
    name: callback_data
    type: string
  - goType: int
    label: 消息 ID
    name: message_id
    required: true
    type: number
  - desc: Telegram 的原始 update，形状由 Bot API 定义且随版本增补
    label: 原始 update
    name: raw
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
  id: callback_query
  label: 按钮点击
- fields:
  - goType: int
    label: 对话 ID
    name: chat_id
    required: true
    type: number
  - goType: int
    label: 发送者 ID
    name: user_id
    required: true
    type: number
  - label: 发送者用户名
    name: username
    type: string
  - label: 文本
    name: text
    type: text
  - goType: int
    label: 消息 ID
    name: message_id
    required: true
    type: number
  - desc: Telegram 的原始 update，形状由 Bot API 定义且随版本增补
    label: 原始 update
    name: raw
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
  id: edited_message
  label: 消息被编辑
- fields:
  - goType: int
    label: 对话 ID
    name: chat_id
    required: true
    type: number
  - goType: int
    label: 发送者 ID
    name: user_id
    required: true
    type: number
  - label: 发送者用户名
    name: username
    type: string
  - label: 文本
    name: text
    type: text
  - goType: int
    label: 消息 ID
    name: message_id
    required: true
    type: number
  - desc: Telegram 的原始 update，形状由 Bot API 定义且随版本增补
    label: 原始 update
    name: raw
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
  id: message
  label: 收到消息
- fields:
  - goType: int
    label: 对话 ID
    name: chat_id
    required: true
    type: number
  - goType: int
    label: 用户 ID
    name: user_id
    required: true
    type: number
  - desc: Telegram 的原始 update，形状由 Bot API 定义且随版本增补
    label: 原始 update
    name: raw
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
  id: my_chat_member
  label: bot 成员状态变化
events_common:
- chat_id
operations:
- id: answer_callback_query
  inputs:
  - desc: 来自 callback_query.id
    label: 回调 ID
    name: callback_query_id
    required: true
    type: string
  - desc: 弹窗/toast 文本
    label: 提示文字
    name: text
    type: string
  - desc: true=模态弹窗，false=顶部 toast
    label: 弹窗显示
    name: show_alert
    type: boolean
  label: 回应按钮点击
  outputs:
  - label: 成功
    name: ok
    required: true
    type: boolean
  - desc: Bot API 的 result 随方法而变：可能是对象也可能是数组，形状由 Telegram 定义
    label: 结果
    name: result
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
- id: call
  inputs:
  - desc: Bot API 方法，如 sendMessage / getChat / answerCallbackQuery
    label: 方法名
    name: method
    required: true
    type: string
  - desc: 该方法的参数对象（键名照 Bot API 文档）
    label: 参数
    name: params
    opaque: true
    type: json
  label: 调用任意 Bot API
  outputs:
  - label: 成功
    name: ok
    required: true
    type: boolean
  - desc: Bot API result 字段（对象/数组，按方法而定）
    label: 结果
    name: result
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
- id: delete_message
  inputs:
  - label: 对话 ID
    name: chat_id
    required: true
    type: string
  - goType: int
    label: 消息 ID
    name: message_id
    required: true
    type: number
  label: 删除消息
  outputs:
  - label: 成功
    name: ok
    required: true
    type: boolean
  - desc: Bot API 的 result 随方法而变：可能是对象也可能是数组，形状由 Telegram 定义
    label: 结果
    name: result
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
- id: delete_webhook
  inputs:
  - label: 丢弃积压 update
    name: drop_pending_updates
    type: boolean
  label: 删除 Webhook
  outputs:
  - label: 成功
    name: ok
    required: true
    type: boolean
  - desc: Bot API 的 result 随方法而变：可能是对象也可能是数组，形状由 Telegram 定义
    label: 结果
    name: result
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
- id: download_file
  inputs:
  - desc: 来自 message.photo/document 等的 file_id
    label: 文件 ID
    name: file_id
    required: true
    type: string
  label: 下载文件
  outputs:
  - label: 文件路径
    name: file_path
    required: true
    type: string
  - goType: int
    label: 字节数
    name: size
    required: true
    type: number
  - desc: 原始字节，≤20MB（Bot API 下载上限）
    label: 文件内容(base64)
    name: base64
    required: true
    type: string
- id: edit_message_text
  inputs:
  - label: 对话 ID
    name: chat_id
    required: true
    type: string
  - goType: int
    label: 消息 ID
    name: message_id
    required: true
    type: number
  - label: 新文本
    name: text
    required: true
    type: string
  - label: 解析模式
    name: parse_mode
    options:
    - value: MarkdownV2
    - value: HTML
    - value: Markdown
    type: enum
  - desc: Telegram 的键盘/按钮对象（inline_keyboard 等），形状由 Bot API 定义
    label: 键盘/按钮
    name: reply_markup
    opaque: true
    type: json
  label: 编辑消息文本
  outputs:
  - label: 成功
    name: ok
    required: true
    type: boolean
  - desc: 新消息 id，供后续 edit/delete/reply 引用
    goType: int
    label: 消息 ID
    name: message_id
    required: true
    type: number
  - desc: Bot API 的 result 随方法而变：可能是对象也可能是数组，形状由 Telegram 定义
    label: 完整 Message 对象
    name: result
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
- id: forward_message
  inputs:
  - label: 目标对话 ID
    name: chat_id
    required: true
    type: string
  - label: 来源对话 ID
    name: from_chat_id
    required: true
    type: string
  - goType: int
    label: 消息 ID
    name: message_id
    required: true
    type: number
  label: 转发消息
  outputs:
  - label: 成功
    name: ok
    required: true
    type: boolean
  - desc: 新消息 id，供后续 edit/delete/reply 引用
    goType: int
    label: 消息 ID
    name: message_id
    required: true
    type: number
  - desc: Bot API 的 result 随方法而变：可能是对象也可能是数组，形状由 Telegram 定义
    label: 完整 Message 对象
    name: result
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
- id: get_chat
  inputs:
  - label: 对话 ID
    name: chat_id
    required: true
    type: string
  label: 获取对话信息
  outputs:
  - label: 成功
    name: ok
    required: true
    type: boolean
  - desc: Bot API result 字段（对象/数组，按方法而定）
    label: 结果
    name: result
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
- id: get_me
  label: 获取 bot 信息
  outputs:
  - label: 成功
    name: ok
    required: true
    type: boolean
  - desc: Bot API result 字段（对象/数组，按方法而定）
    label: 结果
    name: result
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
- id: get_webhook_info
  label: 查看 Webhook 状态
  outputs:
  - label: 成功
    name: ok
    required: true
    type: boolean
  - desc: Bot API result 字段（对象/数组，按方法而定）
    label: 结果
    name: result
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
- id: send_chat_action
  inputs:
  - label: 对话 ID
    name: chat_id
    required: true
    type: string
  - default: typing
    desc: 对方看到「正在输入…」等
    label: 动作
    name: action
    options:
    - value: typing
    - value: upload_photo
    - value: record_video
    - value: upload_document
    - value: choose_sticker
    type: enum
  label: 发送输入状态
  outputs:
  - label: 成功
    name: ok
    required: true
    type: boolean
  - desc: Bot API 的 result 随方法而变：可能是对象也可能是数组，形状由 Telegram 定义
    label: 结果
    name: result
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
- id: send_document
  inputs:
  - label: 对话 ID
    name: chat_id
    required: true
    type: string
  - desc: HTTP URL 或 file_id
    label: 文件
    name: document
    required: true
    type: string
  - label: 说明文字
    name: caption
    type: string
  label: 发送文件
  outputs:
  - label: 成功
    name: ok
    required: true
    type: boolean
  - desc: 新消息 id，供后续 edit/delete/reply 引用
    goType: int
    label: 消息 ID
    name: message_id
    required: true
    type: number
  - desc: Bot API 的 result 随方法而变：可能是对象也可能是数组，形状由 Telegram 定义
    label: 完整 Message 对象
    name: result
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
- id: send_message
  inputs:
  - desc: 数字 id 或 @channelusername
    label: 对话 ID
    name: chat_id
    required: true
    type: string
  - desc: 支持 Markdown/HTML（见 parse_mode）
    label: 文本
    name: text
    required: true
    type: string
  - label: 解析模式
    name: parse_mode
    options:
    - value: MarkdownV2
    - value: HTML
    - value: Markdown
    type: enum
  - goType: int
    label: 回复的消息 ID
    name: reply_to_message_id
    type: number
  - desc: inline_keyboard 等 reply_markup 对象
    label: 键盘/按钮
    name: reply_markup
    opaque: true
    type: json
  - label: 禁用链接预览
    name: disable_web_page_preview
    type: boolean
  label: 发送消息
  outputs:
  - label: 成功
    name: ok
    required: true
    type: boolean
  - desc: 新消息 id，供后续 edit/delete/reply 引用
    goType: int
    label: 消息 ID
    name: message_id
    required: true
    type: number
  - desc: Bot API 的 result 随方法而变：可能是对象也可能是数组，形状由 Telegram 定义
    label: 完整 Message 对象
    name: result
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
- id: send_photo
  inputs:
  - label: 对话 ID
    name: chat_id
    required: true
    type: string
  - desc: HTTP URL 或 file_id
    label: 图片
    name: photo
    required: true
    type: string
  - label: 说明文字
    name: caption
    type: string
  - label: 解析模式
    name: parse_mode
    options:
    - value: MarkdownV2
    - value: HTML
    - value: Markdown
    type: enum
  label: 发送图片
  outputs:
  - label: 成功
    name: ok
    required: true
    type: boolean
  - desc: 新消息 id，供后续 edit/delete/reply 引用
    goType: int
    label: 消息 ID
    name: message_id
    required: true
    type: number
  - desc: Bot API 的 result 随方法而变：可能是对象也可能是数组，形状由 Telegram 定义
    label: 完整 Message 对象
    name: result
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
- id: set_my_commands
  inputs:
  - fields:
    - desc: 不带斜杠，如 start
      label: 命令
      name: command
      required: true
      type: string
    - label: 说明
      name: description
      required: true
      type: string
    goType: BotCommand
    label: 命令列表
    name: commands
    required: true
    type: array
  label: 设置命令菜单
  outputs:
  - label: 成功
    name: ok
    required: true
    type: boolean
  - desc: Bot API 的 result 随方法而变：可能是对象也可能是数组，形状由 Telegram 定义
    label: 结果
    name: result
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
- id: set_webhook
  inputs:
  - desc: HTTPS 地址，Telegram 将 update POST 到此
    label: Webhook URL
    name: url
    required: true
    type: string
  - desc: 1-256 字符；Telegram 每次投递带 X-Telegram-Bot-Api-Secret-Token 头供校验
    label: secret_token
    name: secret_token
    type: string
  - desc: 如 message,callback_query；空=默认集
    itemType: string
    label: 订阅事件类型
    name: allowed_updates
    type: array
  - desc: 1-100，默认 40
    goType: int
    label: 最大并发投递
    name: max_connections
    type: number
  label: 设置 Webhook
  outputs:
  - label: 成功
    name: ok
    required: true
    type: boolean
  - desc: Bot API 的 result 随方法而变：可能是对象也可能是数组，形状由 Telegram 定义
    label: 结果
    name: result
    opaque: true
    required: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
- desc: 打一次 getMe，报 bot token 是否有效以及它是哪个 bot（不发消息、不碰任何对话）
  id: health_check
  label: 检查凭证
  outputs:
  - label: 可用
    name: ok
    required: true
    type: boolean
  - label: bot 用户名
    name: username
    type: string
  - label: 说明
    name: message
    required: true
    type: string
plugin:
  desc: 把 Telegram 机器人接进工作流：收消息触发、发消息/图片/文件、下载用户发来的附件，也可以直调任意 Bot API 方法。
  doc: README.md
  label: Telegram Bot
  name: telegram-bot
  org: sokel
  version: v1.0.0
