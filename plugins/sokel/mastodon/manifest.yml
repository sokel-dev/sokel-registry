credential:
    fields:
        - desc: 你的账号所在实例，如 https://mastodon.social 或 https://m.cmx.im
          label: 实例地址
          name: instance_url
          required: true
          type: text
        - desc: 实例里「偏好设置 → 开发 → 新建应用」，作用域勾 write:statuses、write:media、read:accounts，建完在应用详情页复制「你的访问令牌」
          label: 访问令牌
          name: access_token
          required: true
          type: secret
        - desc: 如 http://127.0.0.1:7897；部署环境直连不了该实例时必填
          label: 出站代理
          name: proxy
          type: text
operations:
    - desc: 验一次访问令牌。ok=false 表示令牌被撤销或作用域不够
      id: health_check
      label: 检查凭证
      outputs:
        - label: 凭证可用
          name: ok
          required: true
          type: boolean
        - label: 说明
          name: message
          required: true
          type: string
        - label: 账号
          name: account
          type: string
    - desc: 发一条 Mastodon 嘟文，可带图、内容警告、可见性与投票
      id: masto_status_create
      inputs:
        - desc: 上限由实例决定（多数 500，不少中文实例 5000+）。链接、#话题、@某人 由实例自动识别，不用插件加工
          label: 正文
          name: text
          required: true
          type: text
        - desc: 填了就是回复
          label: 回复给（嘟文 id）
          name: reply_to_id
          type: string
        - desc: 填了则正文折叠，先显示这行提示。联邦圈的惯例：敏感/长内容都该折起来
          label: 内容警告（CW）
          name: spoiler_text
          type: text
        - default: public
          label: 可见性
          name: visibility
          options:
            - label: 公开（进公共时间线）
              value: public
            - label: 不列出（可见但不进公共时间线）
              value: unlisted
            - label: 仅关注者
              value: private
            - label: 私信（只有被 @ 的人可见）
              value: direct
          type: enum
        - desc: 最多 4 个（投票时不能带）
          itemType: file
          label: 图片/视频
          name: images
          type: array
        - desc: 按顺序对应
          itemType: string
          label: 媒体替代文本
          name: image_alts
          type: array
        - default: false
          desc: 图片会先打码，点了才看
          label: 标记为敏感内容
          name: sensitive
          type: boolean
        - desc: 2-4 项；填了就不能带媒体
          itemType: string
          label: 投票选项
          name: poll_options
          type: array
        - default: 24
          goType: int
          label: 投票时长（小时）
          name: poll_hours
          type: number
        - default: zh
          desc: ISO 639 码，如 zh、en
          label: 语言
          name: language
          type: string
      label: 发嘟文
      outputs:
        - label: 嘟文 id
          name: id
          required: true
          type: string
        - desc: 可直接点开或发进通知
          label: 链接
          name: url
          required: true
          type: string
        - label: 实际可见性
          name: visibility
          required: true
          type: string
    - desc: 只能删授权账号自己发的
      id: masto_status_delete
      inputs:
        - desc: id 或嘟文链接都行
          label: 嘟文 id
          name: status_id
          required: true
          type: string
      label: 删嘟文
      outputs:
        - label: 已删除
          name: deleted
          required: true
          type: boolean
    - desc: 把多段文本发成一串首尾相连的嘟文；后续条目默认继承首条的可见性与 CW
      id: masto_status_thread
      inputs:
        - desc: 按顺序逐条发出，后一条自动回复前一条。本操作不替你断句
          itemType: string
          label: 每条正文
          name: texts
          required: true
          type: array
        - label: 接在谁后面
          name: reply_to_id
          type: string
        - desc: 整串共用
          label: 内容警告（CW）
          name: spoiler_text
          type: text
        - default: public
          label: 可见性
          name: visibility
          options:
            - label: 公开（进公共时间线）
              value: public
            - label: 不列出（可见但不进公共时间线）
              value: unlisted
            - label: 仅关注者
              value: private
            - label: 私信（只有被 @ 的人可见）
              value: direct
          type: enum
        - itemType: file
          label: 首条的媒体
          name: images
          type: array
        - default: 500
          goType: int
          label: 每条之间停顿（毫秒）
          name: interval_ms
          type: number
        - default: zh
          label: 语言
          name: language
          type: string
      label: 发嘟文串
      outputs:
        - desc: 按发出顺序；中途失败时是**已经发出去的那几条**
          itemType: string
          label: 各条 id
          name: ids
          required: true
          type: array
        - label: 首条 id
          name: root_id
          required: true
          type: string
        - label: 首条链接
          name: root_url
          required: true
          type: string
        - goType: int
          label: 发出条数
          name: count
          required: true
          type: number
plugin:
    desc: 发嘟文、发嘟文串、删嘟文。免费、无审批、无按次计费，且因为是联邦网络，
    doc: README.md
    label: Mastodon
    name: mastodon
    org: sokel
    version: v1.0.0
deployment:
  targets:
  - kind: container
    ref: registry.cn-hangzhou.aliyuncs.com/wisburg/sokel-plugin-mastodon:latest
