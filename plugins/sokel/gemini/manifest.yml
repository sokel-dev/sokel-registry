                  label: 厂商回传状态
                  name: meta
                  type: json
              goType: ToolCall
              label: 工具调用
              name: tool_calls
              type: array
            - desc: 结构化输出的结果，形状由调用方给的 JSON Schema 决定
              label: 结构化结果
              name: json
              opaque: true
              type: json
            - desc: 请求的推理语义被就近执行时的一句提示（如 GLM-5.3 家族关不掉思考）；空 = 忠实执行
              label: 推理注记
              name: reasoning_notice
              type: string
            - fields:
