                  required: true
                  type: number
                - goType: int
                  label: 输出 token
                  name: completion_tokens
                  required: true
                  type: number
                - goType: int
                  label: 合计
                  name: total_tokens
                  required: true
                  type: number
                - goType: int
                  label: 缓存命中
                  name: cached_prompt_tokens
                  type: number
                - goType: int
                  label: 字符数
                  name: characters
                  type: number
                - label: 音频秒数
                  name: audio_seconds
                  type: number
                - label: 视频秒数
                  name: video_seconds
                  type: number
                - goType: int
                  label: 图片张数
                  name: images
                  type: number
              goType: Usage
              label: token 计量
              name: usage
              type: json
            - fields:
                - label: 调用 id
                  name: id
                  required: true
                  type: string
                - label: 函数名
                  name: name
                  required: true
                  type: string
                - desc: 参数形状由该函数的 JSON Schema 决定，运行期才知道
                  label: 参数
                  name: args
                  opaque: true
                  required: true
                  type: json
                - fields:
                    - label: 厂商
                      name: vendor
                      required: true
                      type: string
                    - desc: 厂商私有
                      label: 数据
                      name: data
                      opaque: true
