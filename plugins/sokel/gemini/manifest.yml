    - capability: embedding
      operations:
        - desc: 一批文本 → 一批向量（与输入等长同序）
          id: embeddings
          inputs:
            - desc: 由平台路由填入；TEI 那类一进程一模型的实现会忽略它
              label: 上游模型名
              name: model
              type: string
            - itemType: string
              label: 待向量化文本
              name: texts
              required: true
              type: array
            - desc: Matryoshka 截断：想要几维（0/留空=模型默认）。1024 维的存储只要 3072 维的三分之一，质量损失很小。不支持的家忽略它——实际维度看出参 dims
              goType: int
              label: 目标维度
              name: target_dims
              type: number
            - desc: 这批文本要拿来干什么：retrieval_document（被检索的一方）/ retrieval_query（发起检索的一方）/ similarity / classification；留空=不声明。检索型模型对查询与文档处理不同，用错不报错但召回会变差
              label: 口径
              name: purpose
              type: string
          label: 向量化
          outputs:
            - goType: int
              label: 上游状态码
              name: status
              required: true
              type: number
            - goType: int
              label: 向量维度
              name: dims
              required: true
              type: number
            - desc: len == len(texts) * dims；第 i 条 = flat[i*dims:(i+1)*dims]，与 texts 同序
              itemType: number
              label: 向量（扁平）
              name: flat
              required: true
              type: array
            - desc: 实现**真正**施加了哪个口径；空 = 没施加（这家没这个概念，或这个模型不支持）
              label: 实际施加的口径
              name: purpose_applied
              required: true
              type: string
    - capability: speech
      operations:
        - desc: 文本 → 语音（inline 音频，mp3 / wav）
          id: speech
          inputs:
            - desc: 由平台路由填入
              label: 上游模型名
              name: model
              type: string
            - desc: 要念的文本；风格标签（如 (开心) / [笑]）算文本的一部分，原样透传
              label: 文本
              name: text
              required: true
              type: text
            - desc: 各家自己的音色 id；留空 = 这家的默认音色
              label: 音色
              name: voice
              type: string
            - desc: mp3 / wav / pcm16；留空 = mp3。pcm16 由实现裹成 WAV 交出
              label: 格式
              name: format
              type: string
            - desc: 0 / 留空 = 默认；不支持的家忽略
              label: 语速倍率
              name: speed
              type: number
            - desc: 自然语言的语气 / 情绪 / 角色描述，不会被念出来；不支持的家忽略
              label: 风格指令
              name: instructions
              type: text
            - desc: 0 / 留空 = 默认；不支持的家忽略，实际采样率看出参
              goType: int
              label: 采样率
              name: sample_rate
              type: number
            - desc: 音色复刻的样本音频（inline data URL）；只有支持复刻的模型认它
              fields:
                - desc: image / audio / video / document
                  label: 模态
                  name: Modality
                  required: true
                  type: string
                - label: MIME
                  name: MIME
                  type: string
                - desc: inline=平台传字节（data URL）；uri=只给地址，模型自己去取
                  label: 形态
                  name: Form
                  required: true
                  type: string
                - desc: Form=inline 时是 data URL；Form=uri 时是地址
                  label: 取值
                  name: Value
                  required: true
                  type: string
              goType: MediaPart
              label: 音色样本
              name: voice_sample
              type: json
            - desc: 厂商专属参数，形状由上游 API 决定；已有键不覆盖，对象键下钻一层合并
              label: 额外 body
              name: extra_body
              opaque: true
              type: json
          label: 语音合成
          outputs:
            - goType: int
              label: 上游状态码
              name: status
              required: true
              type: number
            - desc: inline data URL；MIME 与容器一致（audio/mpeg / audio/wav）
              fields:
                - desc: image / audio / video / document
                  label: 模态
                  name: modality
                  required: true
                  type: string
                - label: MIME
                  name: mime
                  type: string
                - desc: inline=data URL；uri=上游给的地址
                  label: 形态
                  name: form
                  required: true
                  type: string
                - label: 取值
                  name: value
                  required: true
                  type: string
              goType: MediaOut
              label: 音频
              name: audio
              required: true
              type: json
            - desc: 0 = 上游没说
              goType: int
              label: 采样率
              name: sample_rate
              type: number
            - desc: 0 = 未知
              goType: int
              label: 时长（毫秒）
              name: duration_ms
              type: number
            - desc: 上游改写过请求文本时（润色 / 自动生成播报稿）给出；空 = 念的就是请求文本
              label: 实际念的文本
              name: spoken_text
              type: text
            - desc: characters（字符）/ token 各家能给几项给几项，平台按部署的计价单位取
              fields:
                - goType: int
                  label: 输入 token
                  name: prompt_tokens
                  required: true
                  type: number
                - goType: int
                  label: 输出 token
                  name: completion_tokens
                  required: true
                  type: number
                - goType: int
                  label: 合计
                  name: total_tokens
                  required: true
                  type: number
                - goType: int
                  label: 缓存命中
                  name: cached_prompt_tokens
                  type: number
                - goType: int
                  label: 字符数
                  name: characters
                  type: number
                - label: 音频秒数
                  name: audio_seconds
                  type: number
                - label: 视频秒数
                  name: video_seconds
                  type: number
                - goType: int
                  label: 图片张数
                  name: images
                  type: number
              goType: Usage
              label: 计量
              name: usage
              type: json
    - capability: transcription
      operations:
        - desc: 音频 → 文本
          id: transcribe
          inputs:
            - desc: 由平台路由填入
              label: 上游模型名
              name: model
              type: string
            - desc: inline data URL（平台把字节交给实现）
              fields:
                - desc: image / audio / video / document
                  label: 模态
                  name: Modality
                  required: true
                  type: string
                - label: MIME
                  name: MIME
                  type: string
                - desc: inline=平台传字节（data URL）；uri=只给地址，模型自己去取
                  label: 形态
                  name: Form
                  required: true
                  type: string
                - desc: Form=inline 时是 data URL；Form=uri 时是地址
                  label: 取值
                  name: Value
                  required: true
                  type: string
              goType: MediaPart
              label: 音频
              name: audio
              required: true
              type: json
            - desc: zh / en…；留空 = 自动检测
              label: 语种
              name: language
              type: string
            - desc: 给识别器的上下文 / 专有名词；不支持的家忽略
              label: 提示
              name: prompt
              type: text
            - desc: 厂商专属参数，形状由上游 API 决定
              label: 额外 body
              name: extra_body
              opaque: true
              type: json
          label: 语音识别
          outputs:
            - goType: int
              label: 上游状态码
              name: status
              required: true
              type: number
            - label: 识别文本
              name: text
              required: true
              type: text
            - desc: 识别出的语种；空 = 上游没说
              label: 语种
              name: language
              type: string
            - desc: 0 = 未知
              goType: int
              label: 时长（毫秒）
              name: duration_ms
              type: number
            - desc: audio_seconds（音频秒数）/ token 各家能给几项给几项
              fields:
                - goType: int
                  label: 输入 token
                  name: prompt_tokens
                  required: true
                  type: number
                - goType: int
                  label: 输出 token
                  name: completion_tokens
                  required: true
                  type: number
                - goType: int
                  label: 合计
                  name: total_tokens
                  required: true
                  type: number
                - goType: int
                  label: 缓存命中
                  name: cached_prompt_tokens
                  type: number
                - goType: int
                  label: 字符数
                  name: characters
                  type: number
                - label: 音频秒数
                  name: audio_seconds
                  type: number
                - label: 视频秒数
                  name: video_seconds
                  type: number
                - goType: int
                  label: 图片张数
                  name: images
                  type: number
              goType: Usage
              label: 计量
              name: usage
              type: json
    - capability: video_generation
      operations:
        - desc: 文本 / 参考图 → 视频文件（已落平台文件层）
          id: video_generate
          inputs:
            - desc: 由平台路由填入
              label: 上游模型名
              name: model
              type: string
            - desc: 要生成什么；图生视频时可留空
              label: 提示词
              name: prompt
              type: text
            - desc: 不希望出现的内容；不支持的家忽略
              label: 反向提示词
              name: negative_prompt
              type: text
            - desc: 图生视频的参考图（inline data URL）；留空 = 文生视频
              fields:
                - desc: image / audio / video / document
                  label: 模态
                  name: Modality
                  required: true
                  type: string
                - label: MIME
                  name: MIME
                  type: string
                - desc: inline=平台传字节（data URL）；uri=只给地址，模型自己去取
                  label: 形态
                  name: Form
                  required: true
                  type: string
                - desc: Form=inline 时是 data URL；Form=uri 时是地址
                  label: 取值
                  name: Value
                  required: true
                  type: string
              goType: MediaPart
              label: 参考图 / 首帧
              name: image
              type: json
            - desc: 0 / 留空 = 默认；各家只认几档（5 / 8 / 10），不认的由上游报错
              goType: int
              label: 时长（秒）
              name: duration
              type: number
            - desc: 480p / 720p / 1080p；留空 = 默认
              label: 分辨率
              name: resolution
              type: string
            - desc: 16:9 / 9:16 / 1:1；留空 = 默认（图生视频时跟参考图）
              label: 画幅
              name: aspect_ratio
              type: string
            - desc: 能出声的模型才认；总是出声的家（Veo 3）忽略
              label: 生成配音
              name: audio
              type: boolean
            - desc: 0 / 留空 = 随机
              goType: int
              label: 随机种子
              name: seed
              type: number
            - desc: 厂商专属参数，形状由上游 API 决定；已有键不覆盖，对象键下钻一层合并
              label: 额外 body
              name: extra_body
              opaque: true
              type: json
          label: 视频生成
          outputs:
            - goType: int
              label: 上游状态码
              name: status
              required: true
              type: number
            - desc: 已落平台文件层（video/mp4），可直接传给下游节点或内联播放
              label: 视频文件
              name: video
              required: true
              type: file
            - desc: 0 = 未知
              goType: int
              label: 时长（毫秒）
              name: duration_ms
              type: number
            - desc: 0 = 未知
              goType: int
              label: 宽
              name: width
              type: number
            - desc: 0 = 未知
              goType: int
              label: 高
              name: height
              type: number
            - desc: 上游改写 / 扩写过提示词时给出；空 = 按请求
              label: 实际使用的提示词
              name: revised_prompt
              type: text
            - desc: video_seconds（生成的视频秒数），平台按部署的计价单位取
              fields:
                - goType: int
                  label: 输入 token
                  name: prompt_tokens
                  required: true
                  type: number
                - goType: int
                  label: 输出 token
                  name: completion_tokens
                  required: true
                  type: number
                - goType: int
                  label: 合计
                  name: total_tokens
                  required: true
                  type: number
                - goType: int
                  label: 缓存命中
                  name: cached_prompt_tokens
                  type: number
                - goType: int
                  label: 字符数
                  name: characters
                  type: number
                - label: 音频秒数
                  name: audio_seconds
                  type: number
                - label: 视频秒数
                  name: video_seconds
                  type: number
                - goType: int
                  label: 图片张数
                  name: images
                  type: number
              goType: Usage
              label: 计量
              name: usage
              type: json
    - capability: image_generation
      operations:
        - desc: 文本 / 参考图 → 图片文件（已落平台文件层）
          id: image_generate
          inputs:
            - desc: 由平台路由填入
              label: 上游模型名
              name: model
              type: string
            - desc: 要生成的画面；带参考图时是编辑指令
              label: 提示词
              name: prompt
              required: true
              type: text
            - desc: 不希望出现的内容；不支持的家忽略
              label: 反向提示词
              name: negative_prompt
              type: text
            - desc: 图生图 / 编辑的参考图（inline data URL，1-3 张）；留空 = 文生图
              fields:
                - desc: image / audio / video / document
                  label: 模态
                  name: Modality
                  required: true
                  type: string
                - label: MIME
                  name: MIME
                  type: string
                - desc: inline=平台传字节（data URL）；uri=只给地址，模型自己去取
                  label: 形态
                  name: Form
                  required: true
                  type: string
                - desc: Form=inline 时是 data URL；Form=uri 时是地址
                  label: 取值
                  name: Value
                  required: true
                  type: string
              goType: MediaPart
              label: 参考图
              name: images
              type: array
            - desc: 0 / 留空 = 1；各家上限不同（1-4 / 1-6），超了由上游报错
              goType: int
              label: 张数
              name: "n"
              type: number
            - desc: WxH 像素，如 1024x1024；留空 = 默认。各家只认固定几档
              label: 尺寸
              name: size
              type: string
            - desc: 1:1 / 16:9 / 9:16 / 4:3 / 3:4；留空 = 默认；给了尺寸时忽略
              label: 画幅
              name: aspect_ratio
              type: string
            - desc: 0 / 留空 = 随机
              goType: int
              label: 随机种子
              name: seed
              type: number
            - desc: 厂商专属参数，形状由上游 API 决定；已有键不覆盖，对象键下钻一层合并
              label: 额外 body
              name: extra_body
              opaque: true
              type: json
          label: 图像生成
          outputs:
            - goType: int
              label: 上游状态码
              name: status
              required: true
              type: number
            - desc: 已落平台文件层（png / jpeg / webp），可直接传给下游节点或内联显示
              itemType: file
              label: 图片文件
              name: images
              required: true
              type: array
            - desc: 0 = 未知
              goType: int
              label: 宽
              name: width
              type: number
            - desc: 0 = 未知
              goType: int
              label: 高
              name: height
              type: number
            - desc: 上游改写 / 扩写过提示词时给出；空 = 按请求
              label: 实际使用的提示词
              name: revised_prompt
              type: text
            - desc: images（生成的图片张数），平台按部署的计价单位取
              fields:
                - goType: int
                  label: 输入 token
                  name: prompt_tokens
                  required: true
                  type: number
                - goType: int
                  label: 输出 token
                  name: completion_tokens
                  required: true
                  type: number
                - goType: int
                  label: 合计
                  name: total_tokens
                  required: true
                  type: number
                - goType: int
                  label: 缓存命中
                  name: cached_prompt_tokens
                  type: number
                - goType: int
                  label: 字符数
                  name: characters
                  type: number
                - label: 音频秒数
                  name: audio_seconds
                  type: number
                - label: 视频秒数
                  name: video_seconds
                  type: number
                - goType: int
                  label: 图片张数
                  name: images
                  type: number
              goType: Usage
              label: 计量
              name: usage
              type: json
operations:
    - desc: 拿这条凭证问一次上游「有哪些模型」，给部署编辑的模型名下拉用
      id: list_models
      label: 上游模型列表
      outputs:
        - desc: 与上游返回同集；顺序按 id 稳定排序
          fields:
            - label: 模型 id
              name: id
              required: true
              type: string
            - label: 展示名
              name: label
              type: string
          goType: UpstreamModelRow
          label: 模型列表
          name: models
          required: true
          type: array
    - desc: 拿这条凭证问一次上游的模型列表，验证 key 与 base_url 都对
      id: health_check
      label: 健康检查
      outputs:
        - label: 是否可用
          name: ok
          required: true
          type: boolean
        - desc: 不可用时是原因与下一步；**base_url 填错通常表现为 404 而不是 401**，文案里分开说了
          label: 说明
          name: message
          required: true
          type: string
        - desc: 0 = 没走到 HTTP（网络不通 / 地址解析失败）
          goType: int
          label: 上游状态码
          name: status
          type: number
    - desc: 某语音合成模型可选的预置音色；custom=true 表示可 / 需自由填写（音色复刻、音色设计、兼容网关）
      id: list_voices
      inputs:
        - label: 上游模型名
          name: model
          type: string
      label: 音色列表
      outputs:
        - fields:
            - label: 音色 id
              name: id
              required: true
              type: string
            - label: 展示名
              name: label
              type: string
            - label: 语言
              name: language
              type: string
            - label: 性别
              name: gender
              type: string
            - label: 说明
              name: note
              type: string
          goType: VoiceRow
          label: 音色
          name: voices
          required: true
          type: array
        - label: 可自由填写
          name: custom
          required: true
          type: boolean
        - label: 说明
          name: note
          type: string
plugin:
    desc: Google Gemini 系列大模型接入（官方 SDK）。多模态四模态全开，长上下文。
    label: Gemini
    name: gemini
    org: sokel
    version: v1.0.0
