# Added retroactively (2026-09-05): a base-batch member that was missing from the registry (enroll claims by this entry).
# The implements/operations contract section is re-embedded by registry/cmd/reembed-llm, replaced by op id
# (source of truth: the schema in plugin-core/llmcore/plugin, as exported by sokel-gen export yaml; since 2026-09-06).
# After changing the shell schema, rerun it plus build-index so the registry prefill matches the replica's
# self-reported contract byte for byte. Hand-editing the contract section will drift.
credential:
    fields:
        - label: API Key
          name: api_key
          required: true
          type: secret
        - label: Base URL
          name: base_url
          placeholder: https://generativelanguage.googleapis.com
          type: url
deployment:
    env:
        - default: gemini
          desc: 只启用本插件这一个成员（基础容器是全量基础插件合一镜像；token 是单插件身份凭据）
          name: SOKEL_BASE_PLUGINS
          required: true
    note: 平台部署套件已内置同款容器承接本插件，通常无需部署；此命令用于在别的机器上再起一个出站副本（横向扩容/就近出网）。
    targets:
        - kind: container
          ref: ghcr.io/sokel-dev/sokel/sokel-base-plugins:latest
implements:
    - capability: llm/chat
      operations:
        - desc: 按 canonical 请求调用上游模型，返回完整回答
          id: chat
          inputs:
            - desc: 平台的 canonical 请求（模型名已解析为上游真名）
              fields:
                - label: 上游模型名
                  name: Model
                  required: true
                  type: string
                - label: 系统提示
                  name: System
                  type: string
                - fields:
                    - desc: user / assistant / tool
                      label: 角色
                      name: Role
                      required: true
                      type: string
                    - label: 内容
                      name: Content
                      type: string
                    - fields:
                        - desc: image / audio / video / document
                          label: 模态
                          name: Modality
                          required: true
                          type: string
                        - label: MIME
                          name: MIME
                          type: string
                        - desc: inline=平台传字节（data URL）；uri=只给地址，模型自己去取
                          label: 形态
                          name: Form
                          required: true
                          type: string
                        - desc: Form=inline 时是 data URL；Form=uri 时是地址
                          label: 取值
                          name: Value
                          required: true
                          type: string
                      label: 媒体输入
                      name: Media
                      type: array
                    - fields:
                        - label: 调用 id
                          name: ID
                          required: true
                          type: string
                        - label: 函数名
                          name: Name
                          required: true
                          type: string
                        - desc: 形状由该函数的 JSON Schema 决定，运行期才知道
                          label: 参数
                          name: Args
                          opaque: true
                          type: json
                        - fields:
                            - label: 厂商
                              name: vendor
                              required: true
                              type: string
                            - desc: 厂商私有,平台与别家都不解释
                              label: 数据
                              name: data
                              opaque: true
                              type: json
                          label: 厂商回传状态
                          name: Meta
                          type: json
                      label: 工具调用
                      name: ToolCalls
                      type: array
                    - label: 对应的调用 id
                      name: ToolCallID
                      type: string
                    - fields:
                        - label: 厂商
                          name: vendor
                          required: true
                          type: string
                        - desc: 厂商私有,平台与别家都不解释
                          label: 数据
                          name: data
                          opaque: true
                          type: json
                      label: 厂商回传状态
                      name: Meta
                      type: json
                  label: 对话消息
                  name: Messages
                  required: true
                  type: array
                - label: 随机性
                  name: Temperature
                  type: number
                - goType: int
                  label: 最大输出 token
                  name: MaxTokens
                  type: number
                - label: top_p
                  name: TopP
                  type: number
                - itemType: string
                  label: 停止序列
                  name: Stop
                  type: array
                - fields:
                    - desc: text / json_object / json_schema
                      label: 档位
                      name: Type
                      required: true
                      type: string
                    - desc: 由调用方给出，形状随其业务而定
                      label: JSON Schema
                      name: Schema
                      opaque: true
                      type: json
                    - label: schema 名
                      name: Name
                      type: string
                  label: 结构化输出
                  name: ResponseFormat
                  type: json
                - fields:
                    - desc: off / low / medium / high
                      label: 力度
                      name: Effort
                      type: string
                    - desc: vendor default when empty | reasoning_effort | enable_thinking | thinking | deepseek | thinking_type
                      label: 入参方言
                      name: Style
                      type: string
                  label: 推理
                  name: Reasoning
                  type: json
                - fields:
                    - label: 函数名
                      name: Name
                      required: true
                      type: string
                    - label: 说明
                      name: Description
                      type: string
                    - desc: 函数参数的形状由调用方定义，是任意 JSON Schema
                      label: 参数 JSON Schema
                      name: Parameters
                      opaque: true
                      type: json
                  label: 函数工具
                  name: Tools
                  type: array
                - itemType: string
                  label: 输出模态
                  name: OutputModalities
                  type: array
              goType: ChatReq
              label: 对话请求
              name: chat
              required: true
              type: json
            - desc: 部署级透传给上游的额外 body 字段，形状由上游 API 决定
              label: 额外 body
              name: extra_body
              opaque: true
              type: json
