              label: 上游状态码
              name: status
              required: true
              type: number
            - label: 回答正文
              name: content
              required: true
              type: text
            - label: 结束原因
              name: finish_reason
              type: string
            - label: 思考过程
              name: reasoning
              type: text
            - fields:
