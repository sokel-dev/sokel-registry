                  required: true
                  type: string
                - desc: 厂商私有
                  label: 数据
                  name: data
                  opaque: true
                  type: json
              goType: OutMeta
              label: 厂商回传状态
              name: meta
              type: json
            - desc: 模型产出的图 / 音频等（inline=data URL，uri=地址）；只在请求了对应输出模态时出现
              fields:
                - desc: image / audio / video / document
                  label: 模态
                  name: modality
                  required: true
                  type: string
                - label: MIME
                  name: mime
                  type: string
                - desc: inline=data URL；uri=上游给的地址
                  label: 形态
                  name: form
                  required: true
                  type: string
                - label: 取值
                  name: value
                  required: true
                  type: string
              goType: MediaOut
              label: 生成的媒体
              name: media
              type: array
        - desc: 同 chat，但边生成边产出增量
