credential:
    fields:
        - desc: 群设置 → 群机器人 → 添加「自定义机器人」后复制（open.feishu.cn/open-apis/bot/v2/hook/…）。它本身就是钥匙，按密钥保管
          label: Webhook 地址
          name: webhook_url
          required: true
          type: secret
        - desc: 机器人安全设置若开了「签名校验」，把密钥粘这里；没开留空
          label: 签名密钥
          name: secret
          type: secret
operations:
    - desc: 向 webhook 发一次空校验请求判断 URL 是否有效（不会在群里发出消息）
      id: health_check
      label: 检查凭证
      outputs:
        - label: 可用
          name: ok
          required: true
          type: boolean
        - label: 说明
          name: message
          required: true
          type: string
    - desc: 通过群自定义机器人发消息（文本 / Markdown / 卡片三选一，按填了哪个决定）
      id: webhook_send
      inputs:
        - desc: 纯文本；填了它就按文本发
          label: 文本
          name: text
          type: text
        - desc: Markdown 卡片的头；只对 markdown 生效
          label: 标题
          name: title
          type: string
        - desc: 以卡片渲染：**加粗**、[链接](url)、列表、代码块。告警/报告用它
          label: Markdown
          name: markdown
          type: text
        - desc: 飞书交互卡片 JSON，形状由飞书卡片文档定义；填了它优先于 text/markdown
          label: 卡片 JSON
          name: card
          opaque: true
          type: json
        - default: false
          desc: 只对文本生效
          label: '@所有人'
          name: at_all
          type: boolean
      label: 发到群
      outputs:
        - label: 成功
          name: ok
          required: true
          type: boolean
plugin:
    desc: 往一个飞书群里发消息的最短路径：不用建应用、不用找管理员，30 秒配好。
    doc: README.md
    label: 飞书群机器人
    name: feishu-webhook
    org: sokel
    version: v1.0.0
deployment:
  targets:
  - kind: container
    ref: ghcr.io/sokel-dev/sokel-plugins/sokel-plugin-feishu-webhook:latest
