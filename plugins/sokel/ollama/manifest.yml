                      name: Type
                      required: true
                      type: string
                    - desc: 由调用方给出，形状随其业务而定
                      label: JSON Schema
                      name: Schema
                      opaque: true
                      type: json
                    - label: schema 名
                      name: Name
                      type: string
                  label: 结构化输出
                  name: ResponseFormat
                  type: json
                - fields:
                    - desc: off / low / medium / high
                      label: 力度
                      name: Effort
                      type: string
                    - desc: vendor default when empty | reasoning_effort | enable_thinking | thinking | deepseek | thinking_type
                      label: 入参方言
                      name: Style
                      type: string
                  label: 推理
                  name: Reasoning
                  type: json
                - fields:
                    - label: 函数名
