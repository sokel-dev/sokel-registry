# Generated by cmd/gen-from-db from the platform DB (one-off migration; see that program's header comment).
# Original platform id: p_ollama. Migration MUST claim it under the same id: credentials, channels,
# access groups and model deployments all hold foreign keys to it, so changing the id would silently
# orphan everything users have configured.
# The implements/operations contract section is re-embedded by registry/cmd/reembed-llm, replaced by op id
# (source of truth: the schema in plugin-core/llmcore/plugin, as exported by sokel-gen export yaml; since 2026-09-06).
# After changing the shell schema, rerun it plus build-index so the registry prefill matches the replica's
# self-reported contract byte for byte. Hand-editing the contract section will drift.
credential:
    fields:
        - label: API Key
          name: api_key
          placeholder: sk-...
          required: true
          type: secret
        - default: http://127.0.0.1:11434/v1
          help: 该厂商的 OpenAI 兼容地址
          label: Base URL
          name: base_url
          type: url
deployment:
    env:
        - default: ollama
          desc: 只启用本插件这一个成员（基础容器是全量基础插件合一镜像；token 是单插件身份凭据）
          name: SOKEL_BASE_PLUGINS
          required: true
    note: 平台部署套件已内置同款容器承接本插件，通常无需部署；此命令用于在别的机器上再起一个出站副本（横向扩容/就近出网）。
    targets:
        - kind: container
          ref: ghcr.io/sokel-dev/sokel/sokel-base-plugins:latest
implements:
    - capability: llm/chat
      operations:
        - desc: 按 canonical 请求调用上游模型，返回完整回答
          id: chat
          inputs:
            - desc: 平台的 canonical 请求（模型名已解析为上游真名）
              fields:
                - label: 上游模型名
                  name: Model
                  required: true
                  type: string
                - label: 系统提示
                  name: System
                  type: string
                - fields:
                    - desc: user / assistant / tool
                      label: 角色
                      name: Role
                      required: true
                      type: string
                    - label: 内容
                      name: Content
                      type: string
                    - fields:
                        - desc: image / audio / video / document
                          label: 模态
                          name: Modality
                          required: true
                          type: string
                        - label: MIME
                          name: MIME
                          type: string
                        - desc: inline=平台传字节（data URL）；uri=只给地址，模型自己去取
                          label: 形态
                          name: Form
                          required: true
                          type: string
                        - desc: Form=inline 时是 data URL；Form=uri 时是地址
                          label: 取值
                          name: Value
                          required: true
                          type: string
                      label: 媒体输入
                      name: Media
                      type: array
                    - fields:
                        - label: 调用 id
                          name: ID
                          required: true
                          type: string
                        - label: 函数名
                          name: Name
                          required: true
                          type: string
                        - desc: 形状由该函数的 JSON Schema 决定，运行期才知道
                          label: 参数
                          name: Args
                          opaque: true
                          type: json
                        - fields:
                            - label: 厂商
                              name: vendor
                              required: true
                              type: string
                            - desc: 厂商私有,平台与别家都不解释
                              label: 数据
                              name: data
                              opaque: true
                              type: json
                          label: 厂商回传状态
                          name: Meta
                          type: json
                      label: 工具调用
                      name: ToolCalls
                      type: array
                    - label: 对应的调用 id
                      name: ToolCallID
                      type: string
                    - fields:
                        - label: 厂商
                          name: vendor
                          required: true
                          type: string
                        - desc: 厂商私有,平台与别家都不解释
                          label: 数据
                          name: data
                          opaque: true
                          type: json
                      label: 厂商回传状态
                      name: Meta
                      type: json
                  label: 对话消息
                  name: Messages
                  required: true
                  type: array
                - label: 随机性
                  name: Temperature
                  type: number
                - goType: int
                  label: 最大输出 token
                  name: MaxTokens
                  type: number
                - label: top_p
                  name: TopP
                  type: number
                - itemType: string
                  label: 停止序列
                  name: Stop
                  type: array
                - fields:
                    - desc: text / json_object / json_schema
