              goType: int
              label: 上游状态码
              name: status
              required: true
              type: number
            - label: 回答正文
              name: content
              required: true
              type: text
            - label: 结束原因
              name: finish_reason
              type: string
            - label: 思考过程
              name: reasoning
              type: text
            - fields:
                - goType: int
                  label: 输入 token
                  name: prompt_tokens
                  required: true
                  type: number
                - goType: int
                  label: 输出 token
                  name: completion_tokens
                  required: true
                  type: number
                - goType: int
                  label: 合计
                  name: total_tokens
                  required: true
                  type: number
                - goType: int
                  label: 缓存命中
                  name: cached_prompt_tokens
                  type: number
                - goType: int
                  label: 字符数
                  name: characters
                  type: number
                - label: 音频秒数
                  name: audio_seconds
