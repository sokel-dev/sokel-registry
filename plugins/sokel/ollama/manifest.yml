                        - desc: 厂商私有,平台与别家都不解释
                          label: 数据
                          name: data
                          opaque: true
                          type: json
                      label: 厂商回传状态
                      name: Meta
                      type: json
                  label: 对话消息
                  name: Messages
                  required: true
