                      name: Parameters
                      opaque: true
                      type: json
                  label: 函数工具
                  name: Tools
                  type: array
                - itemType: string
                  label: 输出模态
                  name: OutputModalities
                  type: array
              goType: ChatReq
              label: 对话请求
              name: chat
              required: true
              type: json
            - desc: 部署级透传给上游的额外 body 字段，形状由上游 API 决定
