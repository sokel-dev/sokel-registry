credential:
    fields:
        - desc: RAM 控制台创建的 AccessKey（建议专建一个最小权限的 RAM 用户，策略样例见使用说明）
          label: AccessKey ID
          name: access_key_id
          required: true
          type: text
        - desc: 只在插件内部签名，不进节点与日志
          label: AccessKey Secret
          name: access_key_secret
          required: true
          type: secret
        - desc: 如 cn-hangzhou；SLS/云监控/RDS 列表默认查这个 region
          label: 默认 Region
          name: region
          type: text
operations:
    - desc: 列出容器服务集群（状态/版本/规模）
      id: ack_clusters
      label: ACK·集群列表
      outputs:
        - fields:
            - label: 集群 ID
              name: cluster_id
              required: true
              type: string
            - label: 名称
              name: name
              required: true
              type: string
            - label: 状态
              name: state
              required: true
              type: string
            - label: K8s 版本
              name: version
              type: string
            - label: Region
              name: region
              type: string
            - goType: int
              label: 节点数
              name: size
              type: number
            - desc: ManagedKubernetes 等
              label: 类型
              name: type
              type: string
          goType: AckCluster
          label: 集群列表
          name: clusters
          required: true
          type: array
        - goType: int
          label: 个数
          name: count
          required: true
          type: number
    - desc: 取集群的 kubeconfig（私网或公网端点），粘进 kubernetes 插件的凭证即可在画布上操作集群内工作负载。**产出是能进集群的钥匙**，别把它接到会外发/落库的节点上
      id: ack_kubeconfig
      inputs:
        - label: 集群 ID
          name: cluster_id
          required: true
          type: string
        - default: false
          desc: 插件与集群同 VPC 时开；默认公网端点
          label: 私网端点
          name: private
          type: boolean
      label: ACK·导出 kubeconfig
      outputs:
        - desc: YAML 全文；有效期由集群配置决定
          label: kubeconfig
          name: kubeconfig
          required: true
          type: string
    - desc: 直调任意阿里云 RPC 风格 OpenAPI（统一签名网关）：给 endpoint + action + version + 参数。typed 操作没覆盖的产品与高危操作（重启实例等）走这里——参数照各产品的 API 文档
      id: call
      inputs:
        - desc: 如 rds.aliyuncs.com、ecs.cn-hangzhou.aliyuncs.com（照产品 API 文档的服务接入点）
          label: Endpoint
          name: endpoint
          required: true
          type: string
        - desc: 如 DescribeDBInstances
          label: Action
          name: action
          required: true
          type: string
        - desc: 该产品的 API 版本日期，如 2014-08-15
          label: Version
          name: version
          required: true
          type: string
        - desc: 该 Action 的参数对象，键名照阿里云 API 文档；本插件不介入
          label: 参数
          name: params
          opaque: true
          type: json
      label: 通用调用
      outputs:
        - desc: 阿里云应答 body，形状随 Action 而变，由各产品 API 文档定义
          label: 应答
          name: data
          opaque: true
          required: true
          type: json
          types:
            - json
            - array
            - string
            - number
            - boolean
    - desc: 查一段时间的监控指标（RDS 磁盘水位/CPU、ECS、SLB…）。命名空间与指标名照云监控文档，如 acs_rds_dashboard 的 DiskUsage、ConnectionUsage
      id: cms_metric
      inputs:
        - desc: acs_rds_dashboard / acs_ecs_dashboard / acs_kubernetes…
          label: 命名空间
          name: namespace
          required: true
          type: string
        - desc: DiskUsage / CpuUsage / ConnectionUsage…
          label: 指标名
          name: metric
          required: true
          type: string
        - desc: 按实例过滤；留空查全部
          label: 实例 ID
          name: instance_id
          type: string
        - desc: 默认 60
          goType: int
          label: 查最近几分钟
          name: minutes
          type: number
        - desc: 默认该指标的最小周期（通常 60）
          label: 聚合周期(秒)
          name: period
          type: string
      label: 云监控·查指标
      outputs:
        - desc: 每点含 timestamp 与 Average/Maximum/Minimum 等，具体键由指标定义——各指标不同，无法预声明
          label: 数据点
          name: points
          opaque: true
          required: true
          type: array
        - desc: 最后一个点的 Average（无点时为 0）
          label: 最新值
          name: latest
          required: true
          type: number
        - goType: int
          label: 点数
          name: count
          required: true
          type: number
    - desc: 添加一条解析记录（证书 DNS-01 验证、上新服务）。同名同类型已存在时阿里云会照加不去重——先查再加
      id: dns_add_record
      inputs:
        - label: 域名
          name: domain
          required: true
          type: string
        - desc: www / @ / _acme-challenge 等
          label: 主机记录
          name: rr
          required: true
          type: string
        - default: A
          label: 类型
          name: type
          options:
            - label: A
              value: A
            - label: AAAA
              value: AAAA
            - label: CNAME
              value: CNAME
            - label: TXT
              value: TXT
            - label: MX
              value: MX
            - label: SRV
              value: SRV
          type: enum
        - label: 记录值
          name: value
          required: true
          type: string
        - desc: 默认 600；免费版最低 600
          goType: int
          label: TTL
          name: ttl
          type: number
      label: DNS·加记录
      outputs:
        - label: 记录 ID
          name: record_id
          required: true
          type: string
    - desc: 按 record_id 删一条记录（清理 DNS-01 验证记录）
      id: dns_delete_record
      inputs:
        - label: 记录 ID
          name: record_id
          required: true
          type: string
      label: DNS·删记录
      outputs:
        - label: 成功
          name: ok
          required: true
          type: boolean
    - desc: 列出域名的解析记录（可按主机记录/类型过滤）
      id: dns_records
      inputs:
        - desc: 如 example.com（不带主机记录）
          label: 域名
          name: domain
          required: true
          type: string
        - desc: 如 www、@；留空取全部
          label: 主机记录过滤
          name: rr
          type: string
        - desc: A/CNAME/TXT/MX…；留空取全部
          label: 类型过滤
          name: type
          type: string
      label: DNS·解析记录
      outputs:
        - fields:
            - label: 记录 ID
              name: record_id
              required: true
              type: string
            - label: 主机记录
              name: rr
              required: true
              type: string
            - label: 类型
              name: type
              required: true
              type: string
            - label: 记录值
              name: value
              required: true
              type: string
            - goType: int
              label: TTL
              name: ttl
              required: true
              type: number
            - desc: ENABLE/DISABLE
              label: 状态
              name: status
              required: true
              type: string
          goType: DnsRecord
          label: 记录列表
          name: records
          required: true
          type: array
        - goType: int
          label: 条数
          name: count
          required: true
          type: number
    - desc: 按 record_id 改一条记录（切流量就是改 A/CNAME 的值）
      id: dns_update_record
      inputs:
        - desc: 来自「解析记录」的产出
          label: 记录 ID
          name: record_id
          required: true
          type: string
        - label: 主机记录
          name: rr
          required: true
          type: string
        - desc: A/CNAME/TXT…
          label: 类型
          name: type
          required: true
          type: string
        - label: 记录值
          name: value
          required: true
          type: string
        - goType: int
          label: TTL
          name: ttl
          type: number
      label: DNS·改记录
      outputs:
        - label: 成功
          name: ok
          required: true
          type: boolean
    - desc: 调 STS GetCallerIdentity 验证 AccessKey 有效，并显示这把钥匙是谁（RAM 用户/主账号）
      id: health_check
      label: 检查凭证
      outputs:
        - label: 可用
          name: ok
          required: true
          type: boolean
        - desc: ARN，例如 acs:ram::123:user/ops-readonly
          label: 身份
          name: identity
          required: true
          type: string
        - label: 说明
          name: message
          required: true
          type: string
    - desc: EMAS 移动推送：给 App 推通知（弹在通知栏）或消息（透传给应用代码）。按设备/账号/别名/标签圈人，或全量广播。需要 push 系列 RAM 权限
      id: push
      inputs:
        - desc: EMAS 控制台该 App 的数字 AppKey（不是凭证——它定位推给哪个 App）
          label: AppKey
          name: app_key
          required: true
          type: string
        - default: ALL
          label: 目标类型
          name: target
          options:
            - label: 全量广播
              value: ALL
            - label: 按设备 ID
              value: DEVICE
            - label: 按账号
              value: ACCOUNT
            - label: 按别名
              value: ALIAS
            - label: 按标签
              value: TAG
          type: enum
        - desc: 设备/账号/别名/标签，多个逗号分隔（上限 1000）；全量广播填 ALL 或留空
          label: 目标值
          name: target_value
          type: string
        - default: ALL
          label: 设备类型
          name: device_type
          options:
            - label: Android + iOS
              value: ALL
            - label: 仅 Android
              value: ANDROID
            - label: 仅 iOS
              value: iOS
          type: enum
        - default: NOTICE
          label: 推送类型
          name: push_type
          options:
            - label: 通知（弹通知栏）
              value: NOTICE
            - label: 消息（透传给应用代码，不弹）
              value: MESSAGE
          type: enum
        - label: 标题
          name: title
          required: true
          type: string
        - label: 内容
          name: body
          required: true
          type: text
        - default: PRODUCT
          desc: 走 APNs 时区分证书环境；只推 Android 可忽略
          label: iOS 推送环境
          name: ios_env
          options:
            - label: 生产环境
              value: PRODUCT
            - label: 开发环境
              value: DEV
          type: enum
        - desc: 自定义键值对，透传给客户端（Android/iOS 各自的扩展参数一起下发），形状由你的 App 约定
          label: 附加参数
          name: extras
          opaque: true
          type: json
      label: 移动推送·推送
      outputs:
        - desc: 查送达统计（call 调 QueryPushStatByMsg）认它
          label: 消息 ID
          name: message_id
          required: true
          type: string
    - desc: 单个实例的详情：磁盘容量与已用、最大连接数、内存、维护窗口
      id: rds_instance_detail
      inputs:
        - desc: rm- 开头
          label: 实例 ID
          name: instance_id
          required: true
          type: string
      label: RDS·实例详情
      outputs:
        - label: 状态
          name: status
          required: true
          type: string
        - goType: int
          label: 磁盘容量(GB)
          name: disk_gb
          required: true
          type: number
        - desc: 来自实例资源用量接口；≈0 时以云监控指标为准
          label: 磁盘已用(GB)
          name: disk_used_gb
          required: true
          type: number
        - goType: int
          label: 最大连接数
          name: max_connections
          required: true
          type: number
        - goType: int
          label: 内存(MB)
          name: memory_mb
          required: true
          type: number
        - label: 维护窗口
          name: maintain_time
          required: true
          type: string
        - desc: DescribeDBInstanceAttribute 的原始应答项，形状由阿里云定义
          label: 原始详情
          name: raw
          opaque: true
          required: true
          type: json
          types:
            - json
            - array
            - string
            - number
            - boolean
    - desc: 列出 region 内的 RDS 实例（状态/引擎/规格）
      id: rds_instances
      inputs:
        - desc: 留空用凭证里的默认 region
          label: Region
          name: region
          type: string
      label: RDS·实例列表
      outputs:
        - fields:
            - label: 实例 ID
              name: id
              required: true
              type: string
            - label: 备注名
              name: description
              type: string
            - label: 引擎
              name: engine
              required: true
              type: string
            - label: 引擎版本
              name: version
              type: string
            - label: 状态
              name: status
              required: true
              type: string
            - label: 规格
              name: class
              type: string
            - label: 到期时间
              name: expire_time
              type: string
          goType: RdsInstance
          label: 实例列表
          name: instances
          required: true
          type: array
        - goType: int
          label: 个数
          name: count
          required: true
          type: number
    - desc: 一段时间内的慢 SQL 汇总（按模板聚合：执行次数/平均耗时/扫描行数）
      id: rds_slow_logs
      inputs:
        - label: 实例 ID
          name: instance_id
          required: true
          type: string
        - desc: 默认 1；阿里云按天聚合，时间只能到天粒度
          goType: int
          label: 查最近几天
          name: days
          type: number
      label: RDS·慢SQL
      outputs:
        - fields:
            - label: SQL 模板
              name: sql_text
              required: true
              type: string
            - label: 库
              name: database
              type: string
            - goType: int
              label: 执行次数
              name: execute_times
              required: true
              type: number
            - label: 平均耗时(秒)
              name: avg_seconds
              required: true
              type: number
            - goType: int64
              label: 平均扫描行数
              name: parse_rows
              type: number
            - goType: int64
              label: 平均返回行数
              name: return_rows
              type: number
            - label: 统计日期
              name: report_date
              type: string
          goType: RdsSlowSQL
          label: 慢SQL列表
          name: slow_sqls
          required: true
          type: array
        - goType: int
          label: 条数
          name: count
          required: true
          type: number
    - desc: 阿里云邮件推送（DirectMail）单发：HTML 或纯文本。发信地址要先在控制台配好域名并验证。需要 dm 系列 RAM 权限
      id: send_mail
      inputs:
        - desc: DirectMail 控制台配好的发信地址（如 notice@mail.yourdomain.com）
          label: 发信地址
          name: account_name
          required: true
          type: string
        - desc: 收件箱里显示的名字
          label: 发信人昵称
          name: from_alias
          type: string
        - desc: 多个逗号分隔（单次上限 100）
          label: 收件人
          name: to
          required: true
          type: string
        - label: 主题
          name: subject
          required: true
          type: string
        - desc: 与纯文本二选一；都填时用 HTML
          label: HTML 正文
          name: html
          type: text
        - label: 纯文本正文
          name: text
          type: text
        - desc: 收件人点「回复」时回到这里
          label: 回信地址
          name: reply_to
          type: string
      label: 邮件推送·发邮件
      outputs:
        - label: 发送回执 ID
          name: env_id
          required: true
          type: string
    - id: sls_list_logstores
      inputs:
        - label: Project
          name: project
          required: true
          type: string
      label: SLS·列 Logstore
      outputs:
        - itemType: string
          label: Logstore 列表
          name: logstores
          required: true
          type: array
    - desc: 按查询语句查一段时间的日志（支持 SLS 查询语法与 SQL92 分析，如 level:ERROR | select count(*)）
      id: sls_query
      inputs:
        - label: Project
          name: project
          required: true
          type: string
        - label: Logstore
          name: logstore
          required: true
          type: string
        - desc: SLS 查询语法；带 | 进入 SQL 分析（如 level:ERROR | SELECT count(*) AS c）
          label: 查询语句
          name: query
          type: string
        - desc: 默认 15；与 from/to 二选一
          goType: int
          label: 查最近几分钟
          name: minutes
          type: number
        - desc: RFC3339 或秒级时间戳；填了它就不看 minutes
          label: 开始时间
          name: from
          type: string
        - desc: RFC3339 或秒级时间戳；默认现在
          label: 结束时间
          name: to
          type: string
        - desc: 默认 100，上限 1000（分析型查询不受此限）
          goType: int
          label: 最多几条
          name: limit
          type: number
      label: SLS·查日志
      outputs:
        - desc: 每行是键值对象，键由日志字段决定；分析型查询则是聚合结果行，键由 SELECT 决定——形状随查询而变，无法预声明
          label: 日志
          name: logs
          opaque: true
          required: true
          type: array
        - goType: int
          label: 条数
          name: count
          required: true
          type: number
        - desc: false = 结果被截断或查询超时，缩小时间范围重试
          label: 查询完整
          name: complete
          required: true
          type: boolean
plugin:
    desc: 把阿里云管控面接进工作流：查 SLS 日志、看 RDS 状态与慢 SQL、改 DNS 解析、管 ACK 集群、查云监控指标。
    doc: README.md
    label: 阿里云
    name: aliyun
    org: sokel
    version: v1.0.0
deployment:
  targets:
  - kind: container
    ref: registry.cn-hangzhou.aliyuncs.com/wisburg/sokel-plugin-aliyun:latest
