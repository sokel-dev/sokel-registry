      outputs:
        - desc: '**PR 作者不能是自己的评审人**——传了会被 GitHub 静默丢掉，拿这个核对'
          itemType: string
          label: 现在的评审人
          name: reviewers
          required: true
          type: array
    - desc: 以 approve / 请求修改 / 纯评论的身份提交一次评审，可带 diff 行内评论
      id: pr_review
      inputs:
        - desc: owner/repo 形态（如 sokel-dev/sokel-plugin-sdk，即仓库地址里域名后那段）
          label: 仓库
          name: repo
          required: true
          type: string
        - goType: int
          label: PR 编号
          name: number
          required: true
          type: number
        - default: COMMENT
          label: 结论
          name: event
          options:
            - label: 只评论
              value: COMMENT
            - label: 通过
              value: APPROVE
            - label: 请求修改
              value: REQUEST_CHANGES
          type: enum
        - desc: REQUEST_CHANGES 与 COMMENT **必须有总评**，空的会 422
          label: 总评
          name: body
          type: text
        - desc: 针对 diff 某一行的评论。**行号是新版文件的行号**，且必须落在本次 diff 涉及的行上，否则整个评审 422（不是那一条被忽略）
          fields:
            - label: 文件路径
              name: path
              required: true
              type: string
            - desc: 新版文件的行号；必须是本次 diff 动过的行
              goType: int
              label: 行号
              name: line
              required: true
              type: number
            - desc: RIGHT（新版，默认）或 LEFT（旧版，评论被删掉的行时用）
              label: 哪一侧
              name: side
              required: true
              type: string
            - label: 内容
              name: body
              required: true
              type: string
          goType: ReviewComment
          label: 行内评论
          name: comments
          type: array
      label: 提交评审
      outputs:
        - goType: int
          label: 评审 ID
          name: review_id
          required: true
          type: number
        - label: 状态
          name: state
          required: true
          type: string
        - label: 页面地址
          name: url
          required: true
          type: string
    - desc: 改标题/正文/目标分支/状态；草稿转正式也在这
