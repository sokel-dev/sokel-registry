      label: 看板列表
      outputs:
        - fields:
            - desc: 看板地址末尾那个数字，其他看板操作用它
              goType: int
              label: 编号
              name: number
              required: true
              type: number
            - desc: GraphQL 的全局 ID（PVT_ 开头）；加卡片要它
              label: 节点 ID
              name: id
              required: true
              type: string
            - label: 标题
              name: title
              required: true
              type: string
            - label: 已关闭
              name: closed
              required: true
              type: boolean
            - label: 页面地址
              name: url
              required: true
              type: string
            - goType: int
              label: 卡片数
              name: items
              required: true
              type: number
          goType: Project
          label: 看板列表
          name: projects
          required: true
          type: array
        - goType: int
          label: 本页条数
          name: count
          required: true
          type: number
    - desc: 给 Issue/PR 或某条评论加一个表情——ChatOps 机器人回执「收到」的标准做法
      id: reaction_add
      inputs:
        - desc: owner/repo 形态（如 sokel-dev/sokel-plugin-sdk，即仓库地址里域名后那段）
          label: 仓库
          name: repo
          required: true
          type: string
        - default: comment
          label: 加在哪
          name: target
          options:
            - label: Issue 或 PR 本身
              value: issue
            - label: 某条评论
              value: comment
          type: enum
        - desc: target=issue 时填 Issue/PR 编号；target=comment 时填评论 ID（发评论的出参里有）
          goType: int
          label: 编号或评论 ID
          name: id
          required: true
          type: number
        - default: eyes
          desc: "\U0001F440 = 已看到在处理，\U0001F680 = 已执行，是 ChatOps 的通行约定"
          label: 表情
          name: content
          options:
            - label: "\U0001F44D"
              value: "+1"
            - label: "\U0001F44E"
              value: "-1"
            - label: "\U0001F604"
              value: laugh
            - label: "\U0001F615"
              value: confused
            - label: ❤️
              value: heart
            - label: "\U0001F389"
              value: hooray
            - label: "\U0001F680"
              value: rocket
            - label: "\U0001F440"
              value: eyes
          type: enum
      label: 加表情
      outputs:
        - goType: int
          label: 表情 ID
          name: reaction_id
          required: true
          type: number
        - desc: GitHub 对重复加表情回 200，不是错
          label: 之前就加过
          name: already
          required: true
          type: boolean
    - desc: 创建一个 Release（可让 GitHub 自动生成发布说明）
      id: release_create
      inputs:
        - desc: owner/repo 形态（如 sokel-dev/sokel-plugin-sdk，即仓库地址里域名后那段）
          label: 仓库
          name: repo
          required: true
          type: string
        - desc: 如 v1.2.0。标签不存在会**按 target 自动创建**
          label: 标签名
          name: tag
          required: true
          type: string
        - desc: 分支名或提交 sha；标签已存在时忽略；留空 = 默认分支
          label: 基于
          name: target
          type: string
        - desc: 留空 = 用标签名
          label: 标题
          name: name
          type: string
        - desc: 留空且打开了自动生成，就用 GitHub 生成的
          label: 发布说明
          name: body
          type: text
        - desc: GitHub 按上个标签以来的 PR 生成。**与手写正文可以并存**：生成的会接在正文后面
          label: 自动生成发布说明
          name: generate_notes
          type: boolean
        - label: 存为草稿
          name: draft
          type: boolean
        - label: 标为预发布
          name: prerelease
          type: boolean
      label: 发版
      outputs:
        - goType: int
          label: 发布 ID
          name: release_id
          required: true
          type: number
        - label: 标签
          name: tag
          required: true
          type: string
        - label: 页面地址
          name: url
          required: true
          type: string
        - desc: 自动生成时这里是 GitHub 生成的全文
          label: 最终的发布说明
          name: body
          required: true
          type: text
    - desc: 列出仓库的 Release
      id: releases_list
      inputs:
        - desc: owner/repo 形态（如 sokel-dev/sokel-plugin-sdk，即仓库地址里域名后那段）
          label: 仓库
          name: repo
          required: true
          type: string
        - desc: 默认 1；每页 50 条
          goType: int
          label: 页码
          name: page
          type: number
      label: 发布列表
      outputs:
        - fields:
            - goType: int
              label: 发布 ID
              name: id
              required: true
              type: number
            - label: 标签
              name: tag_name
              required: true
              type: string
            - label: 标题
              name: name
              required: true
              type: string
            - label: 发布说明
              name: body
              required: true
              type: string
            - label: 草稿
              name: draft
              required: true
              type: boolean
            - label: 预发布
              name: prerelease
              required: true
              type: boolean
            - label: 发布者
              name: author
              required: true
              type: string
            - label: 页面地址
              name: url
              required: true
              type: string
            - label: 创建时间
              name: created_at
              required: true
              type: string
            - desc: 草稿为空
              label: 发布时间
              name: published_at
              required: true
              type: string
          goType: Release
          label: 发布列表
          name: releases
          required: true
          type: array
        - goType: int
          label: 本页条数
          name: count
          required: true
          type: number
        - desc: '**翻页看它**——GitHub 不回总数，正好 50 条并不代表翻完了'
          label: 还有下一页
          name: has_more
          type: boolean
    - desc: 取单个仓库的元信息
      id: repo_get
      inputs:
        - desc: owner/repo 形态（如 sokel-dev/sokel-plugin-sdk，即仓库地址里域名后那段）
          label: 仓库
          name: repo
          required: true
          type: string
      label: 仓库详情
      outputs:
        - fields:
            - desc: owner/repo 形态，其他操作的 repo 字段用它
              label: 全名
              name: full_name
              required: true
              type: string
            - label: 名字
              name: name
              required: true
              type: string
            - label: 归属
              name: owner
              required: true
              type: string
            - label: 简介
              name: description
              required: true
              type: string
            - label: 私有
              name: private
              required: true
              type: boolean
            - label: 是 fork
              name: fork
              required: true
              type: boolean
            - desc: 归档仓库只读，写操作会 403
              label: 已归档
              name: archived
              required: true
              type: boolean
            - label: 默认分支
              name: default_branch
              required: true
              type: string
            - goType: int
              label: 星标数
              name: stars
              required: true
              type: number
            - desc: '**含 PR**——GitHub 这个计数把 PR 也算进去'
              goType: int
              label: 未关闭 Issue 数
              name: open_issues
              required: true
              type: number
            - label: 页面地址
              name: url
              required: true
              type: string
            - label: 更新时间
              name: updated_at
              required: true
              type: string
          goType: Repo
          label: 仓库
          name: repo
          required: true
          type: json
        - itemType: string
          label: 主题标签
          name: topics
          type: array
    - desc: 列出某个用户或组织的仓库；留空则列当前令牌账号有权限的仓库
      id: repos_list
      inputs:
        - desc: 留空 = 当前令牌自己的仓库（含私有）
          label: 用户或组织
          name: owner
          type: string
        - default: all
          label: 范围
          name: type
          options:
            - label: 全部
              value: all
            - label: 自己拥有的
              value: owner
            - label: 作为成员参与的
              value: member
            - label: 公开的
              value: public
            - label: 私有的
              value: private
          type: enum
        - default: updated
          label: 排序
          name: sort
          options:
            - label: 最近更新
              value: updated
            - label: 创建时间
              value: created
            - label: 最近推送
              value: pushed
            - label: 名字
              value: full_name
          type: enum
        - desc: 默认 1；每页 50 条
          goType: int
          label: 页码
          name: page
          type: number
      label: 仓库列表
      outputs:
        - fields:
            - desc: owner/repo 形态，其他操作的 repo 字段用它
              label: 全名
              name: full_name
              required: true
              type: string
            - label: 名字
              name: name
              required: true
              type: string
            - label: 归属
              name: owner
              required: true
              type: string
            - label: 简介
              name: description
              required: true
              type: string
            - label: 私有
              name: private
              required: true
              type: boolean
            - label: 是 fork
              name: fork
              required: true
              type: boolean
            - desc: 归档仓库只读，写操作会 403
              label: 已归档
              name: archived
              required: true
              type: boolean
            - label: 默认分支
              name: default_branch
              required: true
              type: string
            - goType: int
              label: 星标数
              name: stars
              required: true
              type: number
            - desc: '**含 PR**——GitHub 这个计数把 PR 也算进去'
              goType: int
              label: 未关闭 Issue 数
              name: open_issues
              required: true
              type: number
            - label: 页面地址
              name: url
              required: true
              type: string
            - label: 更新时间
              name: updated_at
              required: true
              type: string
          goType: Repo
          label: 仓库列表
          name: repos
          required: true
          type: array
        - goType: int
          label: 本页条数
          name: count
          required: true
          type: number
        - desc: '**翻页看它**——GitHub 不回总数，正好 50 条并不代表翻完了'
          label: 还有下一页
          name: has_more
          type: boolean
    - desc: 列出某次工作流运行里的作业与每一步的结果（定位是哪一步挂的）
      id: run_jobs
      inputs:
        - desc: owner/repo 形态（如 sokel-dev/sokel-plugin-sdk，即仓库地址里域名后那段）
          label: 仓库
          name: repo
          required: true
          type: string
        - desc: 从「工作流运行记录」拿
          goType: int
          label: 运行 ID
          name: run_id
          required: true
          type: number
      label: 运行的作业
      outputs:
        - fields:
            - desc: 取日志要它
              goType: int
              label: 作业 ID
              name: id
              required: true
              type: number
            - label: 作业名
              name: name
              required: true
              type: string
            - label: 状态
              name: status
              required: true
              type: string
            - label: 结论
              name: conclusion
              required: true
              type: string
            - desc: 步骤名 → 结论，形如 build=success
              itemType: string
              label: 步骤
              name: steps
              required: true
              type: array
            - label: 开始时间
              name: started_at
              required: true
              type: string
            - label: 页面地址
              name: url
              required: true
              type: string
          goType: Job
          label: 作业列表
          name: jobs
          required: true
          type: array
        - goType: int
          label: 本页条数
          name: count
          required: true
          type: number
        - desc: 跨所有作业汇总成 作业名/步骤名，直接可以发进通知——不用调用方自己再遍历一遍
          itemType: string
          label: 失败的步骤
          name: failed_steps
          required: true
          type: array
    - desc: 搜 Issue/PR、代码或仓库（GitHub 搜索语法原样传）
      id: search
      inputs:
        - default: issues
          label: 搜什么
          name: type
          options:
            - label: Issue 与 PR
              value: issues
            - label: 代码
              value: code
            - label: 仓库
              value: repositories
            - label: 提交
              value: commits
          type: enum
        - desc: 'GitHub 搜索语法，如 `repo:owner/name is:open label:bug`、`org:foo is:pr review:required`。**限定符必须写在这里**——没有 repo: 的话是全站搜'
          label: 搜索式
          name: query
          required: true
          type: string
        - desc: 默认 30，上限 100
          goType: int
          label: 最多返回
          name: limit
          type: number
      label: 搜索
      outputs:
        - fields:
            - label: 标题
              name: title
              required: true
              type: string
            - label: 仓库
              name: repo
              required: true
              type: string
            - desc: 仓库/代码搜索时为 0
              goType: int
              label: 编号
              name: number
              required: true
              type: number
            - label: 状态
              name: state
              required: true
              type: string
            - label: 作者
              name: author
              required: true
              type: string
            - desc: 只有代码搜索有
              label: 文件路径
              name: path
              required: true
              type: string
            - desc: 截断过
              label: 片段
              name: snippet
              required: true
              type: string
            - label: 页面地址
              name: url
              required: true
              type: string
          goType: SearchHit
          label: 命中
          name: results
          required: true
          type: array
        - goType: int
          label: 本页条数
          name: count
          required: true
          type: number
        - desc: '**搜索接口是少数会给总数的**（上限 1000，超过按 1000 算）'
          goType: int
          label: 总命中数
          name: total
          required: true
          type: number
        - desc: true = GitHub 搜索超时了只返回了部分——**别把它当成「就这么多」**
          label: 结果不完整
          name: incomplete
          required: true
          type: boolean
    - desc: 手动跑一个 Actions 工作流（工作流得声明了 workflow_dispatch 才行）
      id: workflow_dispatch
      inputs:
        - desc: owner/repo 形态（如 sokel-dev/sokel-plugin-sdk，即仓库地址里域名后那段）
          label: 仓库
          name: repo
          required: true
          type: string
        - desc: 文件名（如 deploy.yml）或数字 ID
          label: 工作流
          name: workflow
          required: true
          type: string
        - desc: 留空 = 默认分支
          label: 分支或标签
          name: ref
          required: true
          type: string
        - desc: 对应工作流里的 inputs。**值必须是字符串**——GitHub 只收字符串，传数字会 422
          label: 输入参数
          name: inputs
          type: json
          valueType:
            goType: string
            name: ""
            type: string
      label: 触发工作流
      outputs:
        - label: 已发出
          name: dispatched
          required: true
          type: boolean
        - desc: '**GitHub 这个接口不返回运行 ID**（204 空响应）——要拿到 run_id 得隔几秒去查运行记录'
          label: 说明
          name: note
          required: true
          type: string
    - desc: 列出 Actions 的运行记录（按工作流/分支/状态筛）
      id: workflow_runs_list
      inputs:
        - desc: owner/repo 形态（如 sokel-dev/sokel-plugin-sdk，即仓库地址里域名后那段）
          label: 仓库
          name: repo
          required: true
          type: string
        - desc: 文件名（如 ci.yml）或数字 ID；留空 = 全部工作流
          label: 工作流
          name: workflow
          type: string
        - label: 分支
          name: branch
          type: string
        - label: 状态
          name: status
          options:
            - label: 已完成
              value: completed
            - label: 进行中
              value: in_progress
            - label: 排队中
              value: queued
            - label: 失败
              value: failure
            - label: 成功
              value: success
          type: enum
        - desc: 用户名
          label: 触发者
          name: actor
          type: string
        - desc: 默认 1；每页 50 条
          goType: int
          label: 页码
          name: page
          type: number
      label: 工作流运行记录
      outputs:
        - fields:
            - desc: 查作业与日志要它
              goType: int
              label: 运行 ID
              name: id
              required: true
              type: number
            - label: 工作流名
              name: name
              required: true
              type: string
            - desc: queued / in_progress / completed
              label: 状态
              name: status
              required: true
              type: string
            - desc: success / failure / cancelled…；**未完成时为空**，别拿空当成功
              label: 结论
              name: conclusion
              required: true
              type: string
            - label: 分支
              name: branch
              required: true
              type: string
            - label: 提交
              name: sha
              required: true
              type: string
            - desc: push / pull_request / workflow_dispatch…
              label: 触发事件
              name: event
              required: true
              type: string
            - label: 触发者
              name: actor
              required: true
              type: string
            - goType: int
              label: 第几次运行
              name: run_number
              required: true
              type: number
            - goType: int
              label: 第几次重试
              name: attempt
              required: true
              type: number
            - label: 页面地址
              name: url
              required: true
              type: string
            - label: 开始时间
              name: created_at
              required: true
              type: string
            - label: 更新时间
              name: updated_at
              required: true
              type: string
          goType: WorkflowRun
          label: 运行记录
          name: runs
          required: true
          type: array
        - goType: int
          label: 本页条数
          name: count
          required: true
          type: number
        - desc: '**翻页看它**——GitHub 不回总数，正好 50 条并不代表翻完了'
          label: 还有下一页
          name: has_more
          type: boolean
plugin:
    desc: GitHub 项目维护自动化（github.com / GitHub Enterprise Server）：Issue 与 PR 全流程、仓库读写与建分支、Actions 触发与失败日志、发版、Projects V2 看板流转，外加机器人回执面（回写提交状态/检查运行/表情）——自动分类、stale 清理、PR 评审、ChatOps 都能拼出来。事件支持 Webhook（零延迟）与轮询两条路。**需自行部署插件进程**：安装后在本页接入组里复制接入命令。
    doc: README.md
    label: GitHub
    name: github
    org: sokel
    version: v1.0.0
deployment:
  targets:
  - kind: container
    ref: registry.cn-hangzhou.aliyuncs.com/wisburg/sokel-plugin-github:latest
