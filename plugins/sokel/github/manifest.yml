          name: merged
          required: true
          type: boolean
        - label: 合并后的提交
          name: sha
          required: true
          type: string
        - desc: 没合成时这里是原因（如「Base branch was modified」= expect_sha 对不上）
          label: GitHub 的说明
          name: message
          required: true
          type: string
