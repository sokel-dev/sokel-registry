          label: 仓库
          name: repo
          required: true
          type: string
        - goType: int
          label: PR 编号
          name: number
          required: true
          type: number
        - desc: 留空 = 不改
          label: 标题
          name: title
          type: string
        - desc: 留空 = 不改
          label: 正文
          name: body
          type: text
        - desc: 换目标分支；留空 = 不改
          label: 目标分支
          name: base
          type: string
        - desc: 留空 = 不改
          label: 状态
          name: state
          options:
            - label: 重开
              value: open
            - label: 关闭
              value: closed
          type: enum
        - desc: '**这一项走 GraphQL**：REST 没有把草稿转正式的接口'
          label: 草稿转正式
          name: ready_for_review
          type: boolean
      label: 改 PR
      outputs:
        - goType: int
          label: 编号
          name: number
          required: true
          type: number
        - label: 当前状态
          name: state
          required: true
          type: string
        - label: 是否草稿
          name: draft
          required: true
          type: boolean
        - label: 页面地址
          name: url
          required: true
          type: string
