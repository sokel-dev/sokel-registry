    - desc: 合并 Pull Request（三种合法都支持）
      id: pr_merge
      inputs:
        - desc: owner/repo 形态（如 sokel-dev/sokel-plugin-sdk，即仓库地址里域名后那段）
          label: 仓库
          name: repo
          required: true
          type: string
        - goType: int
          label: PR 编号
          name: number
          required: true
          type: number
        - default: merge
          label: 合并方式
          name: method
          options:
            - label: 合并提交
              value: merge
            - label: 压成一个提交
              value: squash
            - label: 变基
              value: rebase
          type: enum
        - desc: 留空 = GitHub 默认
          label: 合并提交标题
          name: title
          type: string
        - label: 合并提交正文
          name: message
          type: text
        - desc: '**并发保护**：填了就只在来源分支仍是这个 sha 时才合。机器人「检查通过就合」的场景必须填——从检查通过到发起合并之间对方可能又推了一版'
          label: 期望的最新提交
          name: expect_sha
          type: string
