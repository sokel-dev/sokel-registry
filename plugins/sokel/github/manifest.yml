credential:
    fields:
        - desc: GitHub Enterprise Server 填根地址（如 https://github.example.com，**不用带 /api/v3**，插件会补）；留空 = github.com
          label: GitHub 地址
          name: base_url
          type: text
        - desc: 个人访问令牌。经典令牌勾 repo（私有仓库）与 workflow（触发 Actions）；细粒度令牌按仓库授权，至少给 Contents/Issues/Pull requests 读写，要回写检查结果再加 Commit statuses 与 Checks。建议专建一个机器人账号
          label: 访问令牌
          name: token
          required: true
          type: secret
        - desc: 平台代收 webhook 用：GitHub 仓库 Settings→Webhooks 里填的 Secret，两边一致才收（**HMAC-SHA256 验签**）。不用 webhook 可留空
          label: Webhook Secret
          name: webhook_secret
          type: secret
        - desc: owner/repo 逗号分隔（如 sokel-dev/sokel,acme/infra）。**填了才启动轮询事件源**：新提交/新 PR/合并/新 Issue/评论/工作流失败 会触发工作流（约 1 分钟延迟）。配了 Webhook 就**不要**再填这个——两条路会各触发一次
          label: 事件盯哪些仓库
          name: watch_repos
          type: text
events:
    - desc: 有人往被监听的仓库推了提交
      fields:
        - desc: owner/repo
          label: 仓库
          name: repo
          required: true
          type: string
        - desc: 已去掉 refs/heads/ 前缀
          label: 分支
          name: ref
          required: true
          type: string
        - label: 最新提交
          name: commit_sha
          required: true
          type: string
        - label: 最新提交信息
          name: commit_message
          required: true
          type: string
        - goType: int
          label: 本次推了几个提交
          name: commit_count
          required: true
          type: number
        - label: 推送者
          name: author
          required: true
          type: string
        - desc: 强推会改写历史——审计场景要看它
          label: 是强推
          name: forced
          type: boolean
        - label: 是新建分支
          name: created
          type: boolean
        - desc: '**删分支也是 push 事件**，且 commit_sha 全是 0——不判这个会去处理一个不存在的提交'
          label: 是删除分支
          name: deleted
          type: boolean
        - desc: webhook 或 poll——两条路都开时用它区分
          label: 来路
          name: source
          type: string
      id: commit_pushed
      label: 有新提交
    - desc: Issue 下有人发言（ChatOps 斜杠命令从这里进）
      fields:
        - desc: owner/repo
          label: 仓库
          name: repo
          required: true
          type: string
        - goType: int
          label: 编号
          name: number
          required: true
          type: number
        - label: 标题
          name: title
          required: true
          type: string
        - label: 评论内容
          name: comment
          required: true
          type: text
        - desc: '**加表情回执用它**'
          goType: int
          label: 评论 ID
          name: comment_id
          required: true
          type: number
        - label: 发言人
          name: author
          required: true
          type: string
        - desc: OWNER / MEMBER / COLLABORATOR / CONTRIBUTOR / NONE。**ChatOps 必须查它**——否则任何路人都能用斜杠命令指挥你的机器人
          label: 发言人身份
          name: author_association
          type: string
        - desc: '**必须挡掉**：机器人回复自己的评论会无限循环，这是 ChatOps 第一个踩的坑'
          label: 是机器人发的
          name: is_bot
          type: boolean
        - label: 页面地址
          name: url
          required: true
          type: string
        - desc: webhook 或 poll——两条路都开时用它区分
          label: 来路
          name: source
          type: string
      id: issue_commented
      label: Issue 有新评论
    - desc: Issue 或 PR 被加上了标签（摘标签不触发）
      fields:
        - desc: owner/repo
          label: 仓库
          name: repo
          required: true
          type: string
        - goType: int
          label: 编号
          name: number
          required: true
          type: number
        - label: 标题
          name: title
          required: true
          type: string
        - label: 正文
          name: body
          type: text
        - desc: '**一次事件只对应一个标签**——GitHub 每加一个标签发一次，比 GitLab 的批量 diff 干净'
          label: 这次加的标签
          name: added_label
          required: true
          type: string
        - itemType: string
          label: 现在的全部标签
          name: labels
          required: true
          type: array
        - desc: GitHub 给 PR 打标签走的也是 issues 事件
          label: 其实是 PR
          name: is_pr
          type: boolean
        - label: 操作者
          name: actor
          required: true
          type: string
        - label: 页面地址
          name: url
          required: true
          type: string
        - desc: webhook 或 poll——两条路都开时用它区分
          label: 来路
          name: source
          type: string
      id: issue_labeled
      label: Issue 被打标签
    - desc: 有人开了 Issue
      fields:
        - desc: owner/repo
          label: 仓库
          name: repo
          required: true
          type: string
        - goType: int
          label: 编号
          name: number
          required: true
          type: number
        - label: 标题
          name: title
          required: true
          type: string
        - label: 正文
          name: body
          type: text
        - label: 创建者
          name: author
          required: true
          type: string
        - itemType: string
          label: 标签
          name: labels
          type: array
        - label: 页面地址
          name: url
          required: true
          type: string
        - desc: webhook 或 poll——两条路都开时用它区分
          label: 来路
          name: source
          type: string
      id: issue_opened
      label: 新 Issue
    - desc: PR 下有人发言（GitHub 与 Issue 评论同一个事件，这里按是不是 PR 拆开）
      fields:
        - desc: owner/repo
          label: 仓库
          name: repo
          required: true
          type: string
        - goType: int
          label: PR 编号
          name: number
          required: true
          type: number
        - label: PR 标题
          name: title
          required: true
          type: string
        - label: 评论内容
          name: comment
          required: true
          type: text
        - goType: int
          label: 评论 ID
          name: comment_id
          required: true
          type: number
        - label: 发言人
          name: author
          required: true
          type: string
        - label: 发言人身份
          name: author_association
          type: string
        - label: 是机器人发的
          name: is_bot
          type: boolean
        - label: 页面地址
          name: url
          required: true
          type: string
        - desc: webhook 或 poll——两条路都开时用它区分
          label: 来路
          name: source
          type: string
      id: pr_commented
      label: PR 有新评论
    - desc: PR 合并进目标分支（**关掉不合不算**）
      fields:
        - desc: owner/repo
          label: 仓库
          name: repo
          required: true
          type: string
        - goType: int
          label: 编号
          name: number
          required: true
          type: number
        - label: 标题
          name: title
          required: true
          type: string
        - label: 作者
          name: author
          required: true
          type: string
        - label: 合并者
          name: merged_by
          required: true
          type: string
        - label: 目标分支
          name: base
          required: true
          type: string
        - label: 合并后的提交
          name: merge_sha
          required: true
          type: string
        - itemType: string
          label: 标签
          name: labels
          type: array
        - label: 页面地址
          name: url
          required: true
          type: string
        - desc: webhook 或 poll——两条路都开时用它区分
          label: 来路
          name: source
          type: string
      id: pr_merged
      label: PR 被合并
    - desc: 有人开了 Pull Request
      fields:
        - desc: owner/repo
          label: 仓库
          name: repo
          required: true
          type: string
        - goType: int
          label: 编号
          name: number
          required: true
          type: number
        - label: 标题
          name: title
          required: true
          type: string
        - label: 正文
          name: body
          type: text
        - label: 作者
          name: author
          required: true
          type: string
        - label: 目标分支
          name: base
          required: true
          type: string
        - label: 来源分支
          name: head
          required: true
          type: string
        - desc: '**回写提交状态用它**'
          label: 来源分支最新提交
          name: head_sha
          required: true
          type: string
        - desc: 草稿 PR 一般不该触发评审机器人
          label: 是草稿
          name: draft
          type: boolean
        - itemType: string
          label: 标签
          name: labels
          type: array
        - label: 页面地址
          name: url
          required: true
          type: string
        - desc: webhook 或 poll——两条路都开时用它区分
          label: 来路
          name: source
          type: string
      id: pr_opened
      label: 新 PR
    - desc: 有人提交了评审结论（通过/请求修改/评论）
      fields:
        - desc: owner/repo
          label: 仓库
          name: repo
          required: true
          type: string
        - goType: int
          label: PR 编号
          name: number
          required: true
          type: number
        - label: PR 标题
          name: title
          required: true
          type: string
        - label: 评审人
          name: reviewer
          required: true
          type: string
        - desc: approved / changes_requested / commented
          label: 结论
          name: state
          required: true
          type: string
        - label: 总评
          name: body
          type: text
        - label: 被评审的提交
          name: head_sha
          type: string
        - label: 页面地址
          name: url
          required: true
          type: string
        - desc: webhook 或 poll——两条路都开时用它区分
          label: 来路
          name: source
          type: string
      id: pr_review_submitted
      label: PR 有评审
    - desc: 发布了一个 Release（草稿转正式也算）
      fields:
        - desc: owner/repo
          label: 仓库
          name: repo
          required: true
          type: string
        - label: 标签
          name: tag
          required: true
          type: string
        - label: 标题
          name: name
          required: true
          type: string
        - label: 发布说明
          name: body
          type: text
        - label: 是预发布
          name: prerelease
          type: boolean
        - label: 发布者
          name: author
          required: true
          type: string
        - label: 页面地址
          name: url
          required: true
          type: string
        - desc: webhook 或 poll——两条路都开时用它区分
          label: 来路
          name: source
          type: string
      id: release_published
      label: 有新发布
    - desc: Actions 跑挂了（只在结论是 failure 时触发，取消与跳过不算）
      fields:
        - desc: owner/repo
          label: 仓库
          name: repo
          required: true
          type: string
        - label: 工作流名
          name: workflow
          required: true
          type: string
        - desc: 拿它去查作业与日志
          goType: int
          label: 运行 ID
          name: run_id
          required: true
          type: number
        - label: 分支
          name: branch
          required: true
          type: string
        - label: 提交
          name: commit_sha
          required: true
          type: string
        - desc: push / pull_request / schedule…
          label: 原始触发事件
          name: event
          required: true
          type: string
        - label: 触发者
          name: actor
          required: true
          type: string
        - desc: '**重试失败会再发一次事件**——只想报一次的话判 attempt==1'
          goType: int
          label: 第几次重试
          name: attempt
          type: number
        - label: 页面地址
          name: url
          required: true
          type: string
        - desc: webhook 或 poll——两条路都开时用它区分
          label: 来路
          name: source
          type: string
      id: workflow_failed
      label: 工作流失败
events_common:
    - repo
operations:
    - desc: 从某个分支或提交拉一个新分支（机器人开 PR 前的第一步）
      id: branch_create
      inputs:
        - desc: owner/repo 形态（如 sokel-dev/sokel-plugin-sdk，即仓库地址里域名后那段）
          label: 仓库
          name: repo
          required: true
          type: string
        - desc: 不带 refs/heads/ 前缀
          label: 新分支名
          name: branch
          required: true
          type: string
        - desc: 分支名或提交 sha；留空 = 默认分支的最新提交
          label: 基于
          name: from
          type: string
      label: 建分支
      outputs:
        - label: 分支名
          name: branch
          required: true
          type: string
        - label: 指向的提交
          name: sha
          required: true
          type: string
        - desc: true = 分支本来就有，没有新建（**不报错**：机器人重跑一次不该炸）
          label: 已存在
          name: existed
          required: true
          type: boolean
    - desc: 读取某个分支的保护规则（合规巡检：主分支的保护有没有被人关掉）
      id: branch_protection_get
      inputs:
        - desc: owner/repo 形态（如 sokel-dev/sokel-plugin-sdk，即仓库地址里域名后那段）
          label: 仓库
          name: repo
          required: true
          type: string
        - desc: 留空 = 默认分支
          label: 分支
          name: branch
          type: string
      label: 查分支保护
      outputs:
        - desc: '**false 时下面各项都是零值**——没有保护规则时 GitHub 回 404，这里翻译成 protected=false 而不是报错'
          label: 受保护
          name: protected
          required: true
          type: boolean
        - goType: int
          label: 需要几个人批准
          name: required_approvals
          required: true
          type: number
        - label: 新提交作废旧批准
          name: dismiss_stale_reviews
          required: true
          type: boolean
        - label: 需要 code owner 批准
          name: require_code_owner_review
          required: true
          type: boolean
        - desc: 检查名，与「回写提交状态」的 context 是同一个命名空间
          itemType: string
          label: 必须通过的检查
          name: required_checks
          required: true
          type: array
        - label: 管理员也受约束
          name: enforce_admins
          required: true
          type: boolean
        - label: 允许强推
          name: allow_force_push
          required: true
          type: boolean
        - label: 要求线性历史
          name: required_linear_history
          required: true
          type: boolean
    - desc: 列出仓库的分支
      id: branches_list
      inputs:
        - desc: owner/repo 形态（如 sokel-dev/sokel-plugin-sdk，即仓库地址里域名后那段）
          label: 仓库
          name: repo
          required: true
          type: string
        - desc: 默认 1；每页 50 条
          goType: int
          label: 页码
          name: page
          type: number
      label: 分支列表
      outputs:
        - fields:
            - label: 名字
              name: name
              required: true
              type: string
            - label: 最新提交
              name: sha
              required: true
              type: string
            - desc: 受保护分支上直接 push 会被拒，要走 PR
              label: 受保护
              name: protected
              required: true
              type: boolean
          goType: Branch
          label: 分支列表
          name: branches
          required: true
          type: array
        - goType: int
          label: 本页条数
          name: count
          required: true
          type: number
        - desc: '**翻页看它**——GitHub 不回总数，正好 50 条并不代表翻完了'
          label: 还有下一页
          name: has_more
          type: boolean
    - desc: 直调任意 GitHub REST 接口——上面没覆盖到的都走这里
      id: call
      inputs:
        - default: GET
          label: 方法
          name: method
          options:
            - value: GET
            - value: POST
            - value: PATCH
            - value: PUT
            - value: DELETE
          type: enum
        - desc: 以 / 开头、**不带** https://api.github.com 前缀，如 /repos/owner/name/topics
          label: 接口路径
          name: path
          required: true
          type: string
        - desc: 任意 GitHub 接口的请求体，形状由目标接口决定
          label: 请求体
          name: body
          opaque: true
          type: json
          types:
            - json
            - array
            - string
            - number
            - boolean
        - label: 查询参数
          name: query
          type: json
          valueType:
            goType: string
            name: ""
            type: string
      label: 通用调用
      outputs:
        - goType: int
          label: HTTP 状态码
          name: status
          required: true
          type: number
        - desc: 上游原样返回，形状由目标接口决定
          label: 响应体
          name: data
          opaque: true
          required: true
          type: json
          types:
            - json
            - array
            - string
            - number
            - boolean
        - desc: 从 Link 头判断
          label: 还有下一页
          name: has_more
          type: boolean
    - desc: Checks API：带标题/markdown 摘要/行内注解的检查结果（比「提交状态」富，但要 App 或细粒度令牌）
      id: check_run_create
      inputs:
        - desc: owner/repo 形态（如 sokel-dev/sokel-plugin-sdk，即仓库地址里域名后那段）
          label: 仓库
          name: repo
          required: true
          type: string
        - desc: 同「回写提交状态」：用 PR 的 head_sha
          label: 提交 sha
          name: sha
          required: true
          type: string
        - label: 检查名
          name: name
          required: true
          type: string
        - desc: 留空 = 标成「进行中」
          label: 结论
          name: conclusion
          options:
            - label: 通过
              value: success
            - label: 失败
              value: failure
            - label: 中性
              value: neutral
            - label: 已取消
              value: cancelled
            - label: 超时
              value: timed_out
            - label: 需人工处理
              value: action_required
          type: enum
        - label: 标题
          name: title
          type: string
        - desc: markdown
          label: 摘要
          name: summary
          type: text
        - desc: markdown，显示在摘要下方
          label: 详情
          name: details
          type: text
        - desc: '**一次最多 50 条**，超出的部分 GitHub 直接丢掉不报错'
          fields:
            - label: 文件路径
              name: path
              required: true
              type: string
            - goType: int
              label: 起始行
              name: start_line
              required: true
              type: number
            - desc: 单行就与起始行相同
              goType: int
              label: 结束行
              name: end_line
              required: true
              type: number
            - desc: notice / warning / failure
              label: 级别
              name: level
              required: true
              type: string
            - label: 内容
              name: message
              required: true
              type: string
            - desc: 可留空
              label: 标题
              name: title
              required: true
              type: string
          goType: Annotation
          label: 行内注解
          name: annotations
          type: array
        - label: 详情链接
          name: details_url
          type: string
      label: 建检查运行
      outputs:
        - goType: int
          label: 检查运行 ID
          name: check_run_id
          required: true
          type: number
        - label: 页面地址
          name: url
          required: true
          type: string
        - desc: 超过 50 条时这里是 50——差额就是被丢掉的
          goType: int
          label: 实际提交的注解数
          name: annotations_sent
          required: true
          type: number
    - desc: 列出对仓库有权限的人及其权限级别（准入审计；也用来判断某人能不能被指派）
      id: collaborators_list
      inputs:
        - desc: owner/repo 形态（如 sokel-dev/sokel-plugin-sdk，即仓库地址里域名后那段）
          label: 仓库
          name: repo
          required: true
          type: string
        - desc: 留空 = 全部
          label: 只看某个权限
          name: permission
          options:
            - label: 有写权限的
              value: push
            - label: 管理员
              value: admin
            - label: 只读
              value: pull
            - label: 可分类
              value: triage
            - label: 可维护
              value: maintain
          type: enum
        - desc: 默认 1；每页 50 条
          goType: int
          label: 页码
          name: page
          type: number
      label: 协作者列表
      outputs:
        - fields:
            - label: 用户名
              name: login
              required: true
              type: string
            - desc: admin / maintain / push / triage / pull
              label: 权限
              name: permission
              required: true
              type: string
            - desc: User 或 Bot
              label: 类型
              name: type
              required: true
              type: string
            - label: 主页
              name: url
              required: true
              type: string
          goType: Collaborator
          label: 协作者
          name: collaborators
          required: true
          type: array
        - goType: int
          label: 本页条数
          name: count
          required: true
          type: number
        - desc: '**翻页看它**——GitHub 不回总数，正好 50 条并不代表翻完了'
          label: 还有下一页
          name: has_more
          type: boolean
    - desc: 在某个提交上挂一条状态（PR 页面下方那排 ✓/✗），机器人把结论写回 GitHub 的最简方式
      id: commit_status_create
      inputs:
