operations:
- desc: 本接口由Tushare自行生产，获取股票复权因子，可提取单只股票全部历史复权因子，也可以提取单日全部股票的复权因子。 积分要求：2000积分起，5000以上可高频调取 输入参数 名称 类型 必选 描述 ts_code str N 股票代码 trade_date str N 交易日期(YYYYMMDD，下同) start_date str N 开始日期 end_date str N 结束日期 注：日期都填YYYYMMDD格式，比如20181010 输出参数 名称 类型 必选 描述 ts_code str Y 股票代码 trade_date str Y 交易日期 adj_factor float
  id: adj_factor
  inputs:
  - desc: 股票代码
    label: 股票代码
    name: ts_code
    type: string
  - desc: 交易日期(YYYYMMDD，下同)
    label: 交易日期(YYYYMMDD，下同)
    name: trade_date
    type: string
  - desc: 开始日期
    label: 开始日期
    name: start_date
    type: string
  - desc: 结束日期
    label: 结束日期
    name: end_date
    type: string
  label: 复权因子
  outputs:
  - fields:
    - label: 股票代码
      name: ts_code
      required: true
      type: string
    - label: 交易日期
      name: trade_date
      required: true
      type: string
    - label: 复权因子
      name: adj_factor
      required: true
      type: number
    goType: AdjFactorRecord
    label: 复权因子
    name: items
    required: true
    type: array
  - goType: int
    label: 本批条数
    name: count
    required: true
    type: number
- desc: 获取全量公告数据，提供pdf下载URL 限量：单次最大2000条数，可以跟进日期循环获取全量 权限：本接口为单独权限，请参考 权限说明 输入参数 名称 类型 必选 描述 ts_code str N 股票代码 ann_date str N 公告日期（yyyymmdd格式，下同） start_date str N 公告开始日期 end_date str N 公告结束日期 输出参数 名称 类型 默认显示 描述 ann_date str Y 公告日期 ts_code str Y 股票代码 name str Y 股票名称 title str Y 标题 url str Y URL，原文下载链接 rec_t
