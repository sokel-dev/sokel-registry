    type: string
  - desc: 公告开始日期
    label: 公告开始日期
    name: start_date
    type: string
  - desc: 公告结束日期
    label: 公告结束日期
    name: end_date
    type: string
  label: 上市公司全量公告
  outputs:
  - fields:
    - label: 公告日期
      name: ann_date
      required: true
      type: string
    - label: 股票代码
      name: ts_code
      required: true
      type: string
    - label: 股票名称
      name: name
      required: true
      type: string
    - label: 标题
