  - label: Event type
    name: event_type
    required: true
    type: string
  - goType: int64
    label: Event timestamp
    name: created
    required: true
    type: number
  - label: Live mode
    name: livemode
    required: true
    type: boolean
  - label: Connected account ID
    name: account_id
    required: true
    type: string
  - fields:
    - label: Customer ID
