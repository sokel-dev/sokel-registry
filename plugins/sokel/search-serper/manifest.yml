credential:
    fields:
        - label: API Key
          name: api_key
          placeholder: 在 serper.dev 注册即得
          required: true
          type: secret
        - label: 出站代理
          name: proxy
          placeholder: http://127.0.0.1:7890（平台与该上游不通时填）
          type: text
deployment:
    env:
        - default: search-serper
          desc: 只启用本插件这一个成员（基础容器是全量基础插件合一镜像；token 是单插件身份凭据）
          name: SOKEL_BASE_PLUGINS
          required: true
    note: 平台部署套件已内置同款容器承接本插件，通常无需部署；此命令用于在别的机器上再起一个出站副本（横向扩容/就近出网）。
    targets:
        - kind: container
          ref: ghcr.io/sokel-dev/sokel/sokel-base-plugins:latest
implements:
    - capability: websearch
      operations:
        - desc: 按关键词搜索网页，返回标题/链接/摘要的列表
          id: web_search
          inputs:
            - desc: 要搜索的关键词或问题
              label: 搜索词
              name: query
              required: true
              type: string
            - default: 8
              desc: 默认 8，上限 20（Google 单次最多 10 条）
              goType: int
              label: 结果条数
              name: count
              type: number
            - desc: 如 zh-CN / en；留空用上游默认
              label: 语言
              name: lang
              type: string
            - desc: 如 cn / us；留空用上游默认
              label: 地区
              name: region
              type: string
            - default: moderate
              label: 安全搜索
              name: safe
              options:
                - value: "off"
                - value: moderate
                - value: strict
              type: enum
          label: 搜索网页
          outputs:
            - fields:
                - name: title
                  required: true
                  type: string
                - name: url
                  required: true
                  type: string
                - name: snippet
                  required: true
                  type: string
                - name: source
                  required: true
                  type: string
                - name: published
                  required: true
                  type: string
              goType: SearchResult
              label: 搜索结果
              name: results
              required: true
              type: array
            - goType: int
              label: 结果条数
              name: count
              required: true
              type: number
            - desc: 部分上游会给一段现成答案（Tavily / DuckDuckGo 摘要）；没有则为空——不拿第一条结果冒充
              label: 直接答案
              name: answer
              required: true
              type: string
operations:
    - desc: 发一次最小搜索验证凭证是否可用（会消耗 1 次搜索配额）
      id: health_check
      label: 检查凭证
      outputs:
        - label: 可用
          name: ok
          required: true
          type: boolean
        - label: 说明
          name: message
          required: true
          type: string
plugin:
    desc: 它不是自建索引，而是替你去抓 Google 的搜索结果页，再解析成 JSON 返回。
    label: Serper（Google 结果）
    name: search-serper
    org: sokel
    version: v1.0.0
