credential:
    fields:
        - label: 服务地址
          name: base_url
          placeholder: http://127.0.0.1:8080
          required: true
          type: url
        - label: API Key
          name: api_key
          type: secret
deployment:
    env:
        - default: tei
          desc: 只启用本插件这一个成员（基础容器是全量基础插件合一镜像；token 是单插件身份凭据）
          name: SOKEL_BASE_PLUGINS
          required: true
    note: 平台部署套件已内置同款容器承接本插件，通常无需部署；此命令用于在别的机器上再起一个出站副本（横向扩容/就近出网）。
    targets:
        - kind: container
          ref: registry.cn-hangzhou.aliyuncs.com/wisburg/sokel-base-plugins:latest
implements:
    - capability: embedding
      operations:
        - desc: 一批文本 → 一批向量（与输入等长同序）
          id: embeddings
          inputs:
            - desc: 由平台路由填入；TEI 那类一进程一模型的实现会忽略它
              label: 上游模型名
              name: model
              type: string
            - itemType: string
              label: 待向量化文本
              name: texts
              required: true
              type: array
            - desc: Matryoshka 截断：想要几维（0/留空=模型默认）。1024 维的存储只要 3072 维的三分之一，质量损失很小。不支持的家忽略它——实际维度看出参 dims
              goType: int
              label: 目标维度
              name: target_dims
              type: number
            - desc: 这批文本要拿来干什么：retrieval_document（被检索的一方）/ retrieval_query（发起检索的一方）/ similarity / classification；留空=不声明。检索型模型对查询与文档处理不同，用错不报错但召回会变差
              label: 口径
              name: purpose
              type: string
          label: 向量化
          outputs:
            - goType: int
              label: 上游状态码
              name: status
              required: true
              type: number
            - goType: int
              label: 向量维度
              name: dims
              required: true
              type: number
            - desc: len == len(texts) * dims；第 i 条 = flat[i*dims:(i+1)*dims]，与 texts 同序
              itemType: number
              label: 向量（扁平）
              name: flat
              required: true
              type: array
            - desc: 实现**真正**施加了哪个口径；空 = 没施加（这家没这个概念，或这个模型不支持）
              label: 实际施加的口径
              name: purpose_applied
              required: true
              type: string
    - capability: rerank
      operations:
        - desc: query + 候选文本 → 相关度分数（与输入等长同序）
          id: rerank
          inputs:
            - label: 上游模型名
              name: model
              type: string
            - label: 查询
              name: query
              required: true
              type: string
            - itemType: string
              label: 候选文本
              name: texts
              required: true
              type: array
          label: 重排序
          outputs:
            - goType: int
              label: 上游状态码
              name: status
              required: true
              type: number
            - desc: 与 texts 等长同序
              itemType: number
              label: 相关度
              name: scores
              required: true
              type: array
            - desc: normalized_01 = 分数在 [0,1]，可直接与阈值比；unbounded = 原始 logit，可正可负，只能用于排序；留空 = 端点没说，未知
              label: 分数量纲
              name: score_scale
              required: true
              type: string
operations:
    - desc: 拿这条凭证问一次上游「有哪些模型」，给部署编辑的模型名下拉用
      id: list_models
      label: 上游模型列表
      outputs:
        - desc: 与上游返回同集；顺序按 id 稳定排序
          fields:
            - label: 模型 id
              name: id
              required: true
              type: string
            - label: 展示名
              name: label
              type: string
          goType: UpstreamModelRow
          label: 模型列表
          name: models
          required: true
          type: array
    - desc: 拿这条凭证问一次上游的模型列表，验证 key 与 base_url 都对
      id: health_check
      label: 健康检查
      outputs:
        - label: 是否可用
          name: ok
          required: true
          type: boolean
        - desc: 不可用时是原因与下一步；**base_url 填错通常表现为 404 而不是 401**，文案里分开说了
          label: 说明
          name: message
          required: true
          type: string
        - desc: 0 = 没走到 HTTP（网络不通 / 地址解析失败）
          goType: int
          label: 上游状态码
          name: status
          type: number
plugin:
    desc: text-embeddings-inference：自己部署的嵌入 / 重排服务，一个进程服务一个模型
    label: TEI 嵌入/重排
    name: tei
    org: sokel
    version: v1.0.0
