operations:
    - desc: 拿这条凭证问一次上游「有哪些模型」，给部署编辑的模型名下拉用
      id: list_models
      label: 上游模型列表
      outputs:
        - desc: 与上游返回同集；顺序按 id 稳定排序
          fields:
            - label: 模型 id
              name: id
              required: true
              type: string
            - label: 展示名
              name: label
              type: string
          goType: UpstreamModelRow
          label: 模型列表
          name: models
          required: true
          type: array
    - desc: 拿这条凭证问一次上游的模型列表，验证 key 与 base_url 都对
      id: health_check
      label: 健康检查
      outputs:
        - label: 是否可用
          name: ok
          required: true
          type: boolean
        - desc: 不可用时是原因与下一步；**base_url 填错通常表现为 404 而不是 401**，文案里分开说了
          label: 说明
          name: message
          required: true
          type: string
        - desc: 0 = 没走到 HTTP（网络不通 / 地址解析失败）
          goType: int
          label: 上游状态码
          name: status
          type: number
plugin:
    desc: Claude 系列大模型接入。为工作流的 LLM 节点、对话测试台与网关提供推理能力。
    label: Anthropic
    name: anthropic
    org: sokel
    version: v1.0.0
