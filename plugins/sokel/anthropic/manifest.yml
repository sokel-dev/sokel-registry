              label: 额外 body
              name: extra_body
              opaque: true
              type: json
          label: 对话（流式）
          outputs:
            - desc: 仅增量帧
              label: 正文增量
              name: delta
              type: text
            - desc: 仅增量帧
              label: 思考增量
              name: reasoning_delta
