                      label: 力度
                      name: Effort
                      type: string
                    - desc: vendor default when empty | reasoning_effort | enable_thinking | thinking | deepseek | thinking_type
                      label: 入参方言
                      name: Style
                      type: string
                  label: 推理
                  name: Reasoning
                  type: json
                - fields:
                    - label: 函数名
                      name: Name
