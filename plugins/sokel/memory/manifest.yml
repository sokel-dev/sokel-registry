# Generated by cmd/gen-from-db from the platform DB (one-off migration; see that program's header comment).
# Original platform id: p_mem. Migration MUST claim it under the same id: credentials, channels,
# access groups and model deployments all hold foreign keys to it, so changing the id would silently
# orphan everything users have configured.
implements:
    - capability: memory
      operations:
        - desc: 按会话键读出最近若干条对话
          id: memory_load
          inputs:
            - desc: 同一个记忆里的哪一段对话，通常绑上游变量（如聊天 id）
              label: 会话键
              name: session_key
              required: true
              type: string
            - desc: 这次要读多少条；留空用记忆资源上配的窗口
              goType: int
              label: 条数上限
              name: limit
              type: number
            - desc: 只要这个时间之后的（RFC3339）
              label: 起始时间
              name: since
              type: string
            - desc: 只要带其中任一标签的消息；留空=不过滤
              itemType: string
              label: 标签过滤
              name: tags
              type: array
          label: 读取记忆
          outputs:
            - desc: 时间正序（最早在前）
              fields:
                - name: role
                  required: true
                  type: string
                - name: content
                  required: true
                  type: string
                - itemType: string
                  name: tags
                  type: array
                - name: group_id
                  type: string
                - fields:
                    - desc: 调用 id，工具返回靠它对上
                      name: id
                      required: true
                      type: string
                    - desc: 工具名
                      name: name
                      required: true
                      type: string
                    - desc: 调用参数的 JSON 原文（不解析再序列化：模型偶尔吐坏 JSON，那正是排查时要看的）
                      name: args
                      required: true
                      type: string
                  name: tool_calls
                  type: array
                - name: reasoning
                  type: string
                - name: tool_call_id
                  type: string
                - fields:
                    - desc: 平台文件 id（受文件回收保护）
                      name: file_id
                      type: string
                    - desc: 外部链接；与 file_id 二选一
                      name: url
                      type: string
                    - desc: image / document
                      name: kind
                      required: true
                      type: string
                    - name: name
                      type: string
                    - name: mime
                      type: string
                  name: attachments
                  type: array
                - name: ts
                  type: string
              goType: Message
              label: 消息列表
              name: messages
              required: true
              type: array
            - desc: 多轮对话拼成的纯文本，可直接内联进提示词
              label: 拼好的文本
              name: text
              required: true
              type: string
            - goType: int
              label: 条数
              name: count
              required: true
              type: number
        - desc: 往某个会话追加若干条消息
          id: memory_append
          inputs:
            - label: 会话键
              name: session_key
              required: true
              type: string
            - desc: role 限 user / assistant / system / tool；tags 可选，用于标记「这条是注入的事实」这类来源。带工具调用时要**一次写完整的一轮**（发起调用的 assistant + 各 tool 返回），只写一半的话下次读出来是残缺序列，回填给模型直接报错
              fields:
                - name: role
                  required: true
                  type: string
                - name: content
                  required: true
                  type: string
                - itemType: string
                  name: tags
                  type: array
                - name: group_id
                  type: string
                - fields:
                    - desc: 调用 id，工具返回靠它对上
                      name: id
                      required: true
                      type: string
                    - desc: 工具名
                      name: name
                      required: true
                      type: string
                    - desc: 调用参数的 JSON 原文（不解析再序列化：模型偶尔吐坏 JSON，那正是排查时要看的）
                      name: args
                      required: true
                      type: string
                  name: tool_calls
                  type: array
                - name: reasoning
                  type: string
                - name: tool_call_id
                  type: string
                - fields:
                    - desc: 平台文件 id（受文件回收保护）
                      name: file_id
                      type: string
                    - desc: 外部链接；与 file_id 二选一
                      name: url
                      type: string
                    - desc: image / document
                      name: kind
                      required: true
                      type: string
                    - name: name
                      type: string
                    - name: mime
                      type: string
                  name: attachments
                  type: array
                - name: ts
                  type: string
              goType: Message
              label: 消息
              name: messages
              required: true
              type: array
          label: 追加记忆
          outputs:
            - goType: int
              label: 写入条数
              name: count
              required: true
              type: number
        - desc: 删掉某个会话的全部消息
          id: memory_clear
          inputs:
            - label: 会话键
              name: session_key
              required: true
              type: string
          label: 清空记忆
          outputs:
            - goType: int
              label: 删除条数
              name: count
              required: true
              type: number
        - desc: 删掉带某标签的消息（如 run:<运行id>——作废一轮运行写入的记忆）
          id: memory_forget
          inputs:
            - desc: 带此标签的消息全部删除
              label: 标签
              name: tag
              required: true
              type: string
            - desc: 可选：只删该会话内的
              label: 会话键
              name: session_key
              type: string
          label: 按标签删除
          outputs:
            - goType: int
              label: 删除条数
              name: count
              required: true
              type: number
        - desc: 这个记忆里有哪些会话、各自多少条、最近何时活动
          id: memory_sessions
          inputs:
            - desc: 只列这个时间之后有活动的（RFC3339）
              label: 活跃起点
              name: active_since
              type: string
            - default: 100
              goType: int
              label: 条数上限
              name: limit
              type: number
          label: 列出会话
          outputs:
            - desc: 按最近活动倒序
              fields:
                - name: session_key
                  required: true
                  type: string
                - goType: int
                  name: count
                  required: true
                  type: number
                - name: updated_at
                  required: true
                  type: string
              goType: Session
              label: 会话列表
              name: sessions
              required: true
              type: array
            - goType: int
              label: 会话数
              name: count
              required: true
              type: number
plugin:
    label: 记忆存储（平台内置）
    name: memory
    org: sokel
    version: v1.0.0
