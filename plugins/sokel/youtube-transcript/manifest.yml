# Generated by cmd/gen-from-db. The contract comes from ../plugin-builtin/youtube-transcript/schema (the plugin's own declaration);
# display name and description come from the platform DB. Original platform id: youtube-transcript;
# migration claims it under the same id.
credential:
    fields:
        - desc: 形如 `http://user:pass@host:port` 或 `socks5://host:1080`。**部署在机房/云主机上时基本是必需的**：YouTube 会用 429 或「确认你不是机器人」挡掉数据中心 IP，住宅代理是目前唯一稳定的解法
          label: 出站代理
          name: proxy
          type: text
        - desc: 留空用一个常见的桌面 Chrome UA
          label: User-Agent
          name: user_agent
          type: text
operations:
    - desc: 按语言优先级取一条字幕，产出带时间轴的分句 + 拼好的全文
      id: transcript_fetch
      inputs:
        - desc: 视频 id 或任意 YouTube 链接：watch?v=… / youtu.be/… / shorts/… / embed/… / live/… 都认；直接填 11 位 id 也行
          label: 视频
          name: video
          required: true
          type: string
        - default: en
          desc: 逗号分隔，**按优先级从高到低**，如 `zh-Hans,zh,en`。取第一个命中的；留空 = en。**认地区变体**：填 en 也能命中 en-US / en-GB；同族之内人工字幕优先，其次才看代码是否完全一致
          label: 语言优先级
          name: languages
          type: string
        - default: any
          desc: 人工字幕质量明显更好但常常没有。「都行」= 同语言下人工优先，没有才用自动生成的
          label: 字幕类型
          name: prefer
          options:
            - label: 都行（人工优先）
              value: any
            - label: 只要人工字幕
              value: manual
            - label: 只要自动生成的
              value: generated
          type: enum
        - desc: 填语言代码（如 zh-Hans）则用 YouTube 自带的机器翻译转一遍。**先按上面的优先级选轨，再翻译**；所选轨不支持翻译会报错
          label: 翻译成
          name: translate_to
          type: string
        - default: false
          desc: 保留 <b> <i> 之类的内联标签。默认去掉——多数下游要的是纯文本
          label: 保留格式标记
          name: preserve_formatting
          type: boolean
      label: 取字幕
      outputs:
        - label: 视频 id
          name: video_id
          required: true
          type: string
        - desc: 各分句以空格拼接，已解转义、已去标签
          label: 全文
          name: text
          required: true
          type: string
        - desc: 带时间轴，按时间正序
          fields:
            - label: 文本
              name: text
              required: true
              type: string
            - label: 开始（秒）
              name: start
              required: true
              type: number
            - label: 时长（秒）
              name: duration
              required: true
              type: number
          goType: Snippet
          label: 分句
          name: snippets
          required: true
          type: array
        - goType: int
          label: 分句数
          name: count
          required: true
          type: number
        - label: 语言名
          name: language
          required: true
          type: string
        - label: 语言代码
          name: language_code
          required: true
          type: string
        - label: 是机器生成的
          name: is_generated
          required: true
          type: boolean
        - desc: 为真表示这份文本是 YouTube 机翻的结果
          label: 经过翻译
          name: translated
          required: true
          type: boolean
        - desc: 最后一句的结束时刻；不等于视频总长
          label: 覆盖时长（秒）
          name: duration_sec
          required: true
          type: number
    - desc: 拿一个公开视频试取一次字幕。本插件不需要账号，这里验的是**出站网络通不通、有没有被 YouTube 风控**
      id: health_check
      label: 检查凭证
      outputs:
        - label: 可用
          name: ok
          required: true
          type: boolean
        - label: 说明
          name: message
          required: true
          type: string
    - desc: 看这个视频有哪些语言的字幕、哪些是人工的、能翻译成什么
      id: transcript_list
      inputs:
        - desc: 视频 id 或任意 YouTube 链接：watch?v=… / youtu.be/… / shorts/… / embed/… / live/… 都认；直接填 11 位 id 也行
          label: 视频
          name: video
          required: true
          type: string
      label: 列可用字幕
      outputs:
        - label: 视频 id
          name: video_id
          required: true
          type: string
        - desc: 人工字幕排在自动生成的前面
          fields:
            - desc: YouTube 给的显示名，如「English (auto-generated)」
              label: 语言名
              name: language
              required: true
              type: string
            - desc: 如 en / zh-Hans / ja
              label: 语言代码
              name: language_code
              required: true
              type: string
            - desc: true = ASR 自动识别；false = 人工上传/校对过
              label: 是机器生成的
              name: is_generated
              required: true
              type: boolean
            - desc: 为真时可用「翻译成」把它转成下面任一语言
              label: 可被翻译
              name: is_translatable
              required: true
              type: boolean
            - desc: 语言代码列表
              itemType: string
              label: 可翻译成
              name: translation_languages
              type: array
          goType: TrackInfo
          label: 字幕轨
          name: transcripts
          required: true
          type: array
        - goType: int
          label: 条数
          name: count
          required: true
          type: number
        - desc: 方便直接接条件分支，不用在下游数数组
          label: 有人工字幕
          name: has_manual
          required: true
          type: boolean
plugin:
    desc: 取任意公开 YouTube 视频的字幕，产出带时间轴的分句和拼好的全文。不需要 YouTube 账号，也不需要 API …
    doc: README.md
    label: YouTube 字幕
    name: youtube-transcript
    org: sokel
    version: v1.0.0
deployment:
  targets:
  - kind: container
    ref: ghcr.io/sokel-dev/sokel-plugins/sokel-plugin-youtube-transcript:latest
  note: 部署在机房/云主机上时基本必须在凭证里配住宅代理，否则会被 YouTube 当机器人挡下。
