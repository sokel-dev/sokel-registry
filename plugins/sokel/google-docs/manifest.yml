plugin:
  desc: Read document tabs and automate text edits
  doc: README.md
  label: Google Docs
  name: google-docs
  org: sokel
  version: v0.1.1
  icon: icon.svg
credential:
  auth:
    kind: oauth
    provider: google
    scopes:
    - https://www.googleapis.com/auth/documents
    - https://www.googleapis.com/auth/userinfo.email
  fields:
  - label: Access token (injected by platform)
    name: access_token
    type: secret
  - label: Refresh token (managed by platform)
    name: refresh_token
    type: secret
operations:
- id: get_document
  inputs:
  - label: Document ID
    name: document_id
    required: true
    type: string
  label: Get document and tab text
  outputs:
  - label: Document ID
    name: document_id
    required: true
    type: string
  - label: Title
    name: title
    required: true
    type: string
  - label: Revision ID
    name: revision_id
    required: true
    type: string
  - fields:
    - label: Tab ID
      name: id
      required: true
      type: string
    - label: Title
      name: title
      required: true
      type: string
    - label: Parent tab ID
      name: parent_id
      required: true
      type: string
    - label: Body text
      name: text
      required: true
      type: string
    - goType: int
      label: Body end index
      name: end_index
      required: true
      type: number
    goType: DocumentTab
    label: Tabs
    name: tabs
    required: true
    type: array
  timeoutSec: 60
- id: create_document
  inputs:
  - label: Title
    name: title
    required: true
    type: string
  label: Create blank document
  outputs:
  - label: Document ID
    name: document_id
    required: true
    type: string
  - label: Title
    name: title
    required: true
    type: string
  timeoutSec: 60
- id: insert_text
  inputs:
  - label: Document ID
    name: document_id
    required: true
    type: string
  - label: Tab ID
    name: tab_id
    required: true
    type: string
  - label: Text
    name: text
    required: true
    type: string
  - desc: Zero or omitted appends before the final newline; positive indexes insert at that location
    goType: int
    label: UTF-16 insertion index
    name: index
    type: number
  - desc: Reject the write if this revision is no longer current
    label: Required revision ID
    name: required_revision_id
    type: string
  label: Insert or append text
  outputs:
  - label: Document ID
    name: document_id
    required: true
    type: string
  - label: Revision after the write
    name: revision_id
    required: true
    type: string
  timeoutSec: 60
- id: replace_text
  inputs:
  - label: Document ID
    name: document_id
    required: true
    type: string
  - label: Tab ID
    name: tab_id
    required: true
    type: string
  - label: Text to find
    name: find
    required: true
    type: string
  - label: Replacement text
    name: replacement
    type: string
  - label: Match case
    name: match_case
    type: boolean
  - desc: Reject the write if this revision is no longer current
    label: Required revision ID
    name: required_revision_id
    type: string
  label: Replace text in a tab
  outputs:
  - label: Document ID
    name: document_id
    required: true
    type: string
  - label: Revision after the write
    name: revision_id
    required: true
    type: string
  - goType: int
    label: Occurrences changed
    name: occurrences_changed
    required: true
    type: number
  timeoutSec: 60
- id: delete_text
  inputs:
  - label: Document ID
    name: document_id
    required: true
    type: string
  - label: Tab ID
    name: tab_id
    required: true
    type: string
  - goType: int
    label: Inclusive UTF-16 start index
    name: start_index
    required: true
    type: number
  - goType: int
    label: Exclusive UTF-16 end index
    name: end_index
    required: true
    type: number
  - desc: Reject the write if this revision is no longer current
    label: Required revision ID
    name: required_revision_id
    type: string
  label: Delete a text range
  outputs:
  - label: Document ID
    name: document_id
    required: true
    type: string
  - label: Revision after the write
    name: revision_id
    required: true
    type: string
  timeoutSec: 60
- id: health_check
  label: Check credential
  outputs:
  - label: Available
    name: ok
    required: true
    type: boolean
  - label: Message
    name: message
    required: true
    type: string
  timeoutSec: 30
codegen:
- lang: go
deployment:
  targets:
  - kind: container
    ref: ghcr.io/sokel-dev/sokel-plugin-google-docs:0.1.1@sha256:2e50b798c6f052939b7a39de4793b9adb72728a10b37ffd3a413821da566635b
