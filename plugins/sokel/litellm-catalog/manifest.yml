# The contract section is generated by sokel-gen export yaml ../plugin-builtin/litellm-catalog/plugin and embedded here.
# Re-export after changing the schema so the registry prefill matches the replica's self-reported contract byte for byte.
credential:
    fields:
        - desc: 逗号分隔的价目表 JSON 地址；留空用 litellm 官方源 + 两个镜像。自维护价目表填自己的地址即可换源
          label: 数据源地址
          name: urls
          type: text
        - desc: 如 http://host:port；插件所在网络到不了 GitHub 时配（也可以直接把插件部署在能连通的机器上）
          label: 出站代理
          name: proxy
          type: text
deployment:
    env:
        - default: litellm-catalog
          desc: 只启用本插件这一个成员（基础容器是全量基础插件合一镜像；token 是单插件身份凭据）
          name: SOKEL_BASE_PLUGINS
          required: true
    note: 平台部署套件已内置同款容器承接本插件，通常无需部署；此命令用于在别的机器上再起一个出站副本（横向扩容/就近出网）。
    targets:
        - kind: container
          ref: ghcr.io/sokel-dev/sokel/sokel-base-plugins:latest
implements:
    - capability: model_catalog
      operations:
        - desc: 价格三档/上下文与输出上限/能力位/模态的全量表；平台的「匹配单价」与跟随开关吃它
          id: list_catalog
          inputs:
            - default: false
              desc: true = 忽略实现侧缓存，真拉一次上游
              label: 穿透缓存
              name: force
              type: boolean
          internal: true
          label: 模型元数据表
          outputs:
            - desc: 与上游同集；0 条视同失败（消费侧纪律：判据是「解析得出条目」不是调用成功）
              fields:
                - desc: 如 deepseek/deepseek-chat
                  label: 表键
                  name: key
                  required: true
                  type: string
                - label: 输入单价/1M
                  name: in_per_1m
                  required: true
                  type: number
                - label: 输出单价/1M
                  name: out_per_1m
                  required: true
                  type: number
                - label: 缓存输入单价/1M
                  name: cached_in_per_1m
                  type: number
                - label: 来源方
                  name: provider
                  type: string
                - goType: int
                  label: 上下文上限
                  name: max_tokens
                  type: number
                - goType: int
                  label: 输出上限
                  name: max_output
                  type: number
                - label: 函数调用
                  name: tools
                  type: boolean
                - label: 视觉
                  name: vision
                  type: boolean
                - itemType: string
                  label: 输入模态
                  name: input_modalities
                  type: array
                - itemType: string
                  label: 输出模态
                  name: output_modalities
                  type: array
              goType: CatalogEntry
              label: 条目
              name: entries
              required: true
              type: array
            - desc: Unix 秒；来自缓存时是缓存写入时刻
              goType: int
              label: 拉取时刻
              name: fetched_at
              type: number
            - desc: 真拉时是命中的 URL；缓存命中时是 cache
              label: 数据源
              name: source
              type: string
          timeoutSec: 60
operations:
    - desc: 真去取一次价格表（不吃缓存），报条目数与数据来源
      id: health_check
      label: 检查凭证
      outputs:
        - label: 可用
          name: ok
          required: true
          type: boolean
        - label: 说明
          name: message
          required: true
          type: string
plugin:
    desc: 模型元数据表（litellm 社区表）：价格/上限/能力位/模态。平台「模型元数据」插槽的内置默认实现，换绑即可换数据源。
    label: LiteLLM 模型元数据
    name: litellm-catalog
    org: sokel
    version: v1.0.0
