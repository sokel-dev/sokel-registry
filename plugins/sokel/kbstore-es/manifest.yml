- desc: 连一下 Elasticsearch 并报版本、集群名与健康状态
  id: health_check
  label: 检查凭证
  outputs:
  - label: 可用
    name: ok
    required: true
    type: boolean
  - label: 版本
    name: version
    type: string
  - label: 集群名
    name: cluster_name
    type: string
