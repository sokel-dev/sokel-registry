plugin:
  desc: 知识库的存储与检索后端：写入分块、向量检索、BM25、混合检索（RRF 融合）。
  doc: README.md
  label: 知识库存储（Elasticsearch）
  name: kbstore-es
  org: sokel
  version: v1.1.1
