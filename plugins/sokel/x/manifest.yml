          required: true
          type: string
      label: 删推文
      outputs:
        - label: 已删除
          name: deleted
          required: true
          type: boolean
    - desc: 按 id 批量取推文详情，一次最多 100 条
      id: x_post_get
      inputs:
        - desc: 一次最多 100 个
          itemType: string
          label: 推文 id
          name: post_ids
          required: true
          type: array
      label: 取推文
      outputs:
        - desc: 删掉/私密的推文不会出现在结果里，不是错误
          fields:
            - label: 推文 id
              name: id
              required: true
              type: string
            - label: 正文
              name: text
              required: true
              type: string
            - label: 发布时间
              name: created_at
              type: string
            - desc: https://x.com/<作者>/status/<id>，可直接点开
              label: 链接
              name: url
              type: string
            - label: 作者 id
              name: author_id
              type: string
            - desc: 不带 @
              label: 作者用户名
              name: author_username
              type: string
            - label: 作者昵称
              name: author_name
              type: string
            - desc: 整条回复树/推串的根 id，用它把一串回复归堆
              label: 对话 id
              name: conversation_id
              type: string
            - desc: original 原创 / replied_to 回复 / retweeted 转推 / quoted 引用
              label: 类型
              name: kind
              type: string
            - desc: 类型非 original 时有值
              label: 被引用的推文 id
              name: ref_post_id
              type: string
            - label: 语言
              name: lang
              type: string
            - goType: int
              label: 回复数
              name: reply_count
              type: number
            - goType: int
              label: 转推数
              name: repost_count
              type: number
            - goType: int
              label: 点赞数
              name: like_count
              type: number
            - goType: int
              label: 引用数
              name: quote_count
              type: number
            - desc: impression_count；早期推文可能为 0
              goType: int
              label: 阅读数
              name: view_count
              type: number
            - fields:
                - label: 媒体键
                  name: media_key
                  required: true
                  type: string
                - desc: photo / video / animated_gif
                  label: 类型
                  name: type
                  type: string
                - desc: 图是原图；视频给的是预览图——X 在这个接口不给视频源地址
                  label: 地址
                  name: url
                  type: string
                - label: 替代文本
                  name: alt_text
                  type: string
              label: 媒体
              name: media
              type: array
            - desc: 已展开成原地址（正文里是 t.co 短链，下游用不了）
              itemType: string
              label: 外链
              name: links
              type: array
            - desc: '不带 #'
              itemType: string
              label: 话题标签
              name: tags
              type: array
          goType: Post
          label: 推文列表
          name: items
          required: true
          type: array
        - goType: int
          label: 条数
          name: count
          required: true
          type: number
    - desc: 把多段文本发成一串首尾相连的推文；第一段可带媒体
      id: x_post_thread
      inputs:
        - desc: 按顺序逐条发出，后一条自动回复前一条。**一条一段**，别把整篇文章塞进一项——本操作不替你断句
          itemType: string
          label: 每条正文
          name: texts
          required: true
          type: array
        - desc: 填了则整串挂在这条推文下；留空则第一条是原创
          label: 接在谁后面（推文 id）
          name: reply_to_id
          type: string
        - desc: 只挂在第一条上，最多 4 个
          itemType: string
          label: 首条的媒体 id
          name: media_ids
          type: array
        - default: 1000
          desc: 默认 1000。X 对连续发推有速率限制，间隔太短整串会发一半断在中途
          goType: int
          label: 每条之间停顿（毫秒）
          name: interval_ms
          type: number
      label: 发推串
      outputs:
        - desc: 按发出顺序；中途失败时这里是**已经发出去的那几条**
          itemType: string
          label: 各条推文 id
          name: ids
          required: true
          type: array
        - label: 首条 id
          name: root_id
          required: true
          type: string
        - label: 首条链接
          name: root_url
          required: true
          type: string
        - goType: int
          label: 发出条数
          name: count
          required: true
          type: number
