          label: 查询式
          name: query
          required: true
          type: text
        - default: recency
          label: 排序
          name: sort
          options:
            - label: 按时间
              value: recency
            - label: 按相关度
              value: relevancy
          type: enum
        - desc: 上一批返回的 next_cursor。留空则从最近的开始；有游标则只取比它更新的
          label: 游标（推文 id）
          name: cursor
          type: string
        - default: 50
          desc: 默认 50，上限 100；自动翻页。**每条都计费**（读一条约 $0.005），别随手调大
          goType: int
          label: 最多几条
          name: max_items
          type: number
      label: 搜索推文
      outputs:
        - desc: 按时间正序（老的在前），与游标推进方向一致
          fields:
            - label: 推文 id
              name: id
              required: true
              type: string
            - label: 正文
              name: text
              required: true
              type: string
            - label: 发布时间
              name: created_at
              type: string
            - desc: https://x.com/<作者>/status/<id>，可直接点开
              label: 链接
              name: url
              type: string
            - label: 作者 id
              name: author_id
              type: string
            - desc: 不带 @
              label: 作者用户名
              name: author_username
              type: string
            - label: 作者昵称
              name: author_name
              type: string
            - desc: 整条回复树/推串的根 id，用它把一串回复归堆
              label: 对话 id
              name: conversation_id
              type: string
            - desc: original 原创 / replied_to 回复 / retweeted 转推 / quoted 引用
              label: 类型
              name: kind
              type: string
            - desc: 类型非 original 时有值
              label: 被引用的推文 id
