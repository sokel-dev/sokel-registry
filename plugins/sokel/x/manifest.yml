                  type: string
                - desc: photo / video / animated_gif
                  label: 类型
                  name: type
                  type: string
                - desc: 图是原图；视频给的是预览图——X 在这个接口不给视频源地址
                  label: 地址
                  name: url
                  type: string
                - label: 替代文本
                  name: alt_text
                  type: string
              label: 媒体
              name: media
