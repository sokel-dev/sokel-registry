credential:
    auth:
        kind: oauth
        provider: x
        scopes:
            - tweet.read
            - tweet.write
            - users.read
            - like.read
            - like.write
            - bookmark.read
            - bookmark.write
            - follows.read
            - follows.write
            - list.read
            - list.write
            - dm.read
            - dm.write
            - media.write
            - offline.access
    fields:
        - desc: 点「授权」后由平台写入，勿手填
          label: 访问令牌（授权注入）
          name: access_token
          type: secret
        - desc: 勿手填
          label: 刷新令牌（授权注入）
          name: refresh_token
          type: secret
        - desc: 如 http://127.0.0.1:7897；部署环境直连不了 x.com 时必填
          label: 出站代理
          name: proxy
          type: text
        - default: "off"
          desc: 填 on 则有人 @ 授权账号时触发工作流；off = 不监听
          label: 监听提及
          name: watch_mentions
          options:
            - label: "off"
              value: "off"
            - label: "on"
              value: "on"
          type: select
        - desc: X 搜索语法（如 `"我的品牌" -is:retweet lang:zh`）；留空 = 不监听关键词。**每轮都是一次计费的搜索**，间隔别调太短
          label: 监听的查询式
          name: watch_query
          type: text
        - default: "300"
          desc: 默认 300。X 的搜索/提及限流是 15 分钟 300 次，但真正的约束是钱——每轮拉回的每条推文都计费
          label: 轮询间隔（秒）
          name: poll_seconds
          type: text
        - desc: 事件源自动维护，勿手填
          label: 轮询游标
          name: watch_cursor
          type: text
