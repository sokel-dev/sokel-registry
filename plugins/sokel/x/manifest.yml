              name: reply_count
              type: number
            - goType: int
              label: 转推数
              name: repost_count
              type: number
            - goType: int
              label: 点赞数
              name: like_count
              type: number
            - goType: int
              label: 引用数
              name: quote_count
              type: number
            - desc: impression_count；早期推文可能为 0
              goType: int
              label: 阅读数
              name: view_count
              type: number
            - fields:
                - label: 媒体键
                  name: media_key
