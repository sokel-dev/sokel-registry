events_common:
    - post_id
    - text
operations:
    - desc: 书签是私密的，别人看不到
      id: x_bookmark
      inputs:
        - label: 推文 id
          name: post_id
          required: true
          type: string
      label: 加书签
      outputs:
        - label: 已收藏
          name: ok
          required: true
          type: boolean
    - desc: 拉授权账号的私信事件；给了会话 id 则只拉那个会话
      id: x_dm_events
      inputs:
        - desc: 留空 = 拉全部会话
          label: 会话 id
          name: conversation_id
          type: string
        - desc: 上一批返回的 next_cursor
          label: 游标（事件 id）
          name: cursor
          type: string
        - default: 50
          goType: int
          label: 最多几条
          name: max_items
          type: number
      label: 拉私信
      outputs:
        - desc: 按时间正序
          fields:
            - label: 事件 id
              name: id
              required: true
              type: string
            - desc: MessageCreate 消息 / ParticipantsJoin 加入 / ParticipantsLeave 退出
              label: 类型
              name: kind
              type: string
            - desc: 回信要用它
              label: 会话 id
              name: conversation_id
              type: string
            - label: 发送者 id
              name: sender_id
              type: string
            - label: 正文
              name: text
              type: string
            - label: 时间
              name: created_at
              type: string
          goType: DMEvent
          label: 私信事件
          name: items
          required: true
          type: array
        - label: 下一个游标
          name: next_cursor
          required: true
          type: string
        - label: 还有更多
          name: has_more
          required: true
          type: boolean
        - goType: int
          label: 条数
          name: count
          required: true
          type: number
    - desc: 给某个用户或某个会话发私信。对方未关注你且未开放私信时会被拒
      id: x_dm_send
      inputs:
        - desc: 与媒体至少给一个
          label: 正文
          name: text
          required: true
          type: text
        - desc: 发给某个人；与会话 id 二选一
          label: 收信人 id
          name: user_id
          type: string
        - desc: 回复某个已有会话（私信事件里带这个字段）
          label: 会话 id
          name: conversation_id
          type: string
        - desc: 来自「上传媒体」且用途选了「私信用」
          itemType: string
          label: 媒体 id
          name: media_ids
          type: array
      label: 发私信
      outputs:
        - label: 会话 id
          name: conversation_id
          required: true
          type: string
        - label: 事件 id
          name: event_id
          required: true
          type: string
    - id: x_follow
      inputs:
        - desc: 只有用户名的话，先过一次「查用户」
          label: 用户 id
          name: user_id
          type: string
        - desc: 不带 @；填了则插件先查 id（多花一次查询）
          label: 用户名
          name: username
          type: string
      label: 关注
      outputs:
        - label: 已关注
          name: ok
          required: true
          type: boolean
        - desc: 对方是私密账号时为真
          label: 等待对方通过
          name: pending
          required: true
          type: boolean
    - desc: 拿授权账号自己试一次（约 $0.01）。ok=false 表示要重新授权
      id: health_check
      label: 检查凭证
      outputs:
        - label: 凭证可用
          name: ok
          required: true
          type: boolean
        - desc: 不可用时是原因；可用时是当前账号 @用户名
          label: 说明
          name: message
          required: true
          type: string
        - label: 授权账号
          name: username
          type: string
    - id: x_like
      inputs:
        - label: 推文 id
          name: post_id
          required: true
          type: string
      label: 点赞
      outputs:
        - label: 已点赞
          name: ok
          required: true
          type: boolean
    - desc: 把账号加进 X 列表——配合「列表时间线」就是一套低成本的盯人方案
      id: x_list_member_add
      inputs:
        - label: 列表 id
          name: list_id
          required: true
          type: string
        - label: 用户 id
          name: user_id
          type: string
        - desc: 不带 @；与 id 二选一
          label: 用户名
          name: username
          type: string
      label: 列表加成员
      outputs:
        - label: 已加入
          name: ok
          required: true
          type: boolean
    - id: x_list_member_remove
      inputs:
        - label: 列表 id
          name: list_id
          required: true
          type: string
        - label: 用户 id
          name: user_id
          type: string
        - desc: 不带 @；与 id 二选一
          label: 用户名
          name: username
          type: string
      label: 列表移除成员
      outputs:
        - label: 已移出
          name: ok
          required: true
          type: boolean
    - desc: 拉一个 X 列表里所有成员的推文——盯一批账号时，比逐个拉时间线省几十倍请求
      id: x_list_posts
      inputs:
        - desc: 列表页地址 x.com/i/lists/<这一串>
          label: 列表 id
          name: list_id
          required: true
          type: string
        - desc: 上一批返回的 next_cursor。留空则从最近的开始
          label: 游标（推文 id）
          name: cursor
          type: string
        - default: 50
          desc: 默认 50，上限 100；自动翻页。**每条都计费**（读一条约 $0.005），别随手调大
          goType: int
          label: 最多几条
          name: max_items
          type: number
      label: 列表时间线
      outputs:
        - desc: 按时间正序（老的在前），与游标推进方向一致
          fields:
            - label: 推文 id
              name: id
              required: true
              type: string
            - label: 正文
              name: text
              required: true
              type: string
            - label: 发布时间
              name: created_at
              type: string
            - desc: https://x.com/<作者>/status/<id>，可直接点开
              label: 链接
              name: url
              type: string
            - label: 作者 id
              name: author_id
              type: string
            - desc: 不带 @
              label: 作者用户名
              name: author_username
              type: string
            - label: 作者昵称
              name: author_name
              type: string
            - desc: 整条回复树/推串的根 id，用它把一串回复归堆
              label: 对话 id
              name: conversation_id
              type: string
            - desc: original 原创 / replied_to 回复 / retweeted 转推 / quoted 引用
              label: 类型
              name: kind
              type: string
            - desc: 类型非 original 时有值
              label: 被引用的推文 id
              name: ref_post_id
              type: string
            - label: 语言
              name: lang
              type: string
            - goType: int
              label: 回复数
              name: reply_count
              type: number
            - goType: int
              label: 转推数
              name: repost_count
              type: number
            - goType: int
              label: 点赞数
              name: like_count
              type: number
            - goType: int
              label: 引用数
              name: quote_count
              type: number
            - desc: impression_count；早期推文可能为 0
              goType: int
              label: 阅读数
              name: view_count
              type: number
            - fields:
                - label: 媒体键
                  name: media_key
                  required: true
                  type: string
                - desc: photo / video / animated_gif
                  label: 类型
                  name: type
                  type: string
                - desc: 图是原图；视频给的是预览图——X 在这个接口不给视频源地址
                  label: 地址
                  name: url
                  type: string
                - label: 替代文本
                  name: alt_text
                  type: string
              label: 媒体
              name: media
              type: array
            - desc: 已展开成原地址（正文里是 t.co 短链，下游用不了）
              itemType: string
              label: 外链
              name: links
              type: array
            - desc: '不带 #'
              itemType: string
              label: 话题标签
              name: tags
              type: array
          goType: Post
          label: 推文列表
          name: items
          required: true
          type: array
        - desc: 本批最新一条的 id；没有新内容时原样返回传入的游标
          label: 下一个游标
          name: next_cursor
          required: true
          type: string
        - desc: 为真表示这批拉满了，应当立刻再拉一次
          label: 还有更多
          name: has_more
          required: true
          type: boolean
        - goType: int
          label: 本批条数
          name: count
          required: true
          type: number
    - desc: 图片/GIF/视频 → media_id，供发推与私信使用。视频自动分片并等待转码
      id: x_media_upload
      inputs:
        - desc: 图片 ≤5MB、GIF ≤15MB、视频 ≤512MB。视频只收 MP4(H.264/AAC)，其它格式 X 会在转码阶段拒掉
          label: 文件
          name: file
          required: true
          type: file
        - desc: 给读屏用户的图片描述，≤1000 字符。视频不支持
          label: 替代文本
          name: alt_text
          type: string
        - default: post
          desc: 决定 media_category；用途填错 X 会在发布时拒绝这个 media_id
          label: 用途
          name: purpose
          options:
            - label: 发推用
              value: post
            - label: 私信用
              value: dm
          type: enum
      label: 上传媒体
      outputs:
        - desc: 绑到「发推文」的媒体 id 上
          label: 媒体 id
          name: media_id
          required: true
          type: string
        - label: 媒体键
          name: media_key
          required: true
          type: string
        - goType: int
          label: 字节数
          name: size
          required: true
          type: number
        - desc: succeeded 才能用；视频转码由本操作等到结束
          label: 处理状态
          name: state
          required: true
          type: string
    - desc: 拉 @ 了授权账号的推文。要实时的话用本插件的事件源，不必自己定时拉
      id: x_mentions
      inputs:
        - desc: 上一批返回的 next_cursor。留空则从最近的开始；接着上次拉就把它存进数据表
          label: 游标（推文 id）
          name: cursor
          type: string
        - default: 50
          desc: 默认 50，上限 100；自动翻页。**每条都计费**（读一条约 $0.005），别随手调大
          goType: int
          label: 最多几条
          name: max_items
          type: number
      label: 提及我的
      outputs:
        - desc: 按时间正序（老的在前），与游标推进方向一致
          fields:
            - label: 推文 id
              name: id
              required: true
              type: string
            - label: 正文
              name: text
              required: true
              type: string
            - label: 发布时间
              name: created_at
              type: string
            - desc: https://x.com/<作者>/status/<id>，可直接点开
              label: 链接
              name: url
              type: string
            - label: 作者 id
              name: author_id
              type: string
            - desc: 不带 @
              label: 作者用户名
              name: author_username
              type: string
            - label: 作者昵称
              name: author_name
              type: string
            - desc: 整条回复树/推串的根 id，用它把一串回复归堆
              label: 对话 id
              name: conversation_id
              type: string
            - desc: original 原创 / replied_to 回复 / retweeted 转推 / quoted 引用
              label: 类型
              name: kind
              type: string
            - desc: 类型非 original 时有值
              label: 被引用的推文 id
              name: ref_post_id
              type: string
            - label: 语言
              name: lang
              type: string
            - goType: int
              label: 回复数
              name: reply_count
              type: number
            - goType: int
              label: 转推数
              name: repost_count
              type: number
            - goType: int
              label: 点赞数
              name: like_count
              type: number
            - goType: int
              label: 引用数
              name: quote_count
              type: number
            - desc: impression_count；早期推文可能为 0
              goType: int
              label: 阅读数
              name: view_count
              type: number
            - fields:
                - label: 媒体键
                  name: media_key
                  required: true
                  type: string
                - desc: photo / video / animated_gif
                  label: 类型
                  name: type
                  type: string
                - desc: 图是原图；视频给的是预览图——X 在这个接口不给视频源地址
                  label: 地址
                  name: url
                  type: string
                - label: 替代文本
                  name: alt_text
                  type: string
              label: 媒体
              name: media
              type: array
            - desc: 已展开成原地址（正文里是 t.co 短链，下游用不了）
              itemType: string
              label: 外链
              name: links
              type: array
            - desc: '不带 #'
              itemType: string
              label: 话题标签
              name: tags
              type: array
          goType: Post
          label: 推文列表
          name: items
          required: true
          type: array
        - desc: 本批最新一条的 id；没有新内容时原样返回传入的游标
          label: 下一个游标
          name: next_cursor
          required: true
          type: string
        - desc: 为真表示这批拉满了，应当立刻再拉一次
          label: 还有更多
          name: has_more
          required: true
          type: boolean
        - goType: int
          label: 本批条数
          name: count
          required: true
          type: number
    - desc: 发原创/回复/引用推文，可带图片视频与投票
      id: x_post_create
      inputs:
        - desc: 普通账号上限 280 字符（中日韩字算 2 个权重的规则由 X 判定）；带投票或纯媒体时可留空
          label: 正文
          name: text
          required: true
          type: text
        - desc: 填了就是回复。想回复某条推文的话，从「搜索」等操作的 id 字段绑过来
          label: 回复给（推文 id）
          name: reply_to_id
          type: string
        - desc: 引用转推。⚠️ X 把带引用的发推划进了 Enterprise 档，自助档会被拒——先确认你的档位
          label: 引用（推文 id）
          name: quote_id
          type: string
        - desc: 来自「上传媒体」操作，最多 4 个（视频/GIF 只能 1 个）
          itemType: string
          label: 媒体 id
          name: media_ids
          type: array
        - desc: 2-4 项，每项最多 25 字符；填了就是投票推文，不能同时带媒体
          itemType: string
          label: 投票选项
          name: poll_options
          type: array
        - default: 1440
          desc: 5 - 10080（7 天）
          goType: int
          label: 投票时长（分钟）
          name: poll_duration_minutes
          type: number
        - default: everyone
          label: 谁能回复
          name: reply_settings
          options:
            - label: 所有人可回复
              value: everyone
            - label: 仅我关注的人
              value: following
            - label: 仅被提及的人
              value: mentionedUsers
            - label: 仅订阅者
              value: subscribers
            - label: 仅认证账号
              value: verified
          type: enum
      label: 发推文
      outputs:
        - label: 推文 id
          name: id
          required: true
          type: string
        - desc: 可直接点开，也可以直接发进通知里
          label: 链接
          name: url
          required: true
          type: string
        - desc: X 回显的正文（链接会被替换成 t.co 短链）
          label: 最终正文
          name: text
          required: true
          type: string
