            - desc: 已展开成原地址（正文里是 t.co 短链，下游用不了）
              itemType: string
              label: 外链
              name: links
              type: array
            - desc: '不带 #'
              itemType: string
              label: 话题标签
              name: tags
              type: array
          goType: Post
          label: 推文列表
          name: items
          required: true
          type: array
        - desc: 本批最新一条的 id；没有新内容时原样返回传入的游标
          label: 下一个游标
          name: next_cursor
          required: true
          type: string
        - desc: 为真表示这批拉满了，应当立刻再拉一次
          label: 还有更多
          name: has_more
          required: true
          type: boolean
        - goType: int
          label: 本批条数
          name: count
          required: true
          type: number
    - id: x_unbookmark
      inputs:
        - label: 推文 id
          name: post_id
          required: true
          type: string
      label: 取消书签
      outputs:
        - label: 已取消
          name: ok
          required: true
          type: boolean
    - id: x_unfollow
      inputs:
        - desc: 只有用户名的话，先过一次「查用户」
          label: 用户 id
          name: user_id
          type: string
        - desc: 不带 @；填了则插件先查 id（多花一次查询）
          label: 用户名
          name: username
          type: string
      label: 取消关注
      outputs:
        - label: 已取消关注
          name: ok
          required: true
          type: boolean
    - id: x_unlike
      inputs:
        - label: 推文 id
          name: post_id
          required: true
          type: string
      label: 取消点赞
      outputs:
        - label: 已取消
          name: ok
          required: true
