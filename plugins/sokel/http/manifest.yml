operations:
    - desc: 从本机发起出站 HTTP 请求
      id: request
      inputs:
        - default: GET
          label: 方法
          name: method
          type: string
        - desc: 要请求的地址
          label: URL
          name: url
          required: true
          type: string
        - desc: 按声明顺序拼进查询串
          fields:
            - name: key
              required: true
              type: string
            - name: value
              required: true
              type: string
          goType: KV
          label: Query 参数
          name: params
          type: array
        - desc: 按声明顺序设置
          fields:
            - name: key
              required: true
              type: string
            - name: value
              required: true
              type: string
          goType: KV
          label: 请求头
          name: headers
          type: array
        - default: none
          label: Body 类型
          name: bodyType
          options:
            - value: none
            - value: json
            - value: form
            - value: raw
          type: enum
        - desc: 请求体形状由目标接口决定：json 模式给对象，raw 模式给字符串
          label: 请求体
          name: body
          opaque: true
          type: json
          types:
            - json
            - array
            - string
            - number
            - boolean
        - goType: int
          label: 超时(秒)
          name: timeout
          type: number
        - desc: http://host:port；平台与目标不通时填。留空按环境变量
          label: 出站代理
          name: proxy
          type: string
        - default: text
          label: 响应类型
          name: responseType
          options:
            - value: text
            - value: file
          type: enum
        - desc: 仅 responseType=file；留空自动取名并按响应类型补后缀
          label: 文件名
          name: fileName
          type: string
      label: HTTP 请求
      outputs:
        - goType: int
          label: 状态码
          name: status
          required: true
          type: number
        - desc: 响应体形状由目标接口决定：能解析成 JSON 就是结构化值，否则是原文字符串
          label: 响应体
          name: body
          opaque: true
          type: json
          types:
            - json
            - array
            - string
            - number
            - boolean
        - desc: text 模式下恒为字符串
          label: 响应原文
          name: text
          type: text
        - label: 响应头
          name: headers
          required: true
          type: json
          valueType:
            goType: string
            name: ""
            type: string
        - desc: 响应下发的全部 Set-Cookie（含重定向途中下发的）
          fields:
            - name: name
              required: true
              type: string
            - name: value
              required: true
              type: string
            - name: domain
              required: true
              type: string
            - name: path
              required: true
              type: string
            - name: expires
              required: true
              type: string
            - name: secure
              required: true
              type: boolean
            - name: httpOnly
              required: true
              type: boolean
            - name: raw
              required: true
              type: string
          goType: Cookie
          label: Cookies
          name: cookies
          type: array
        - desc: 上面这些 cookie 拼好的 name=value; … ，可直接填进下一次请求的 Cookie 头
          label: Cookie 头
          name: cookieHeader
          type: string
        - desc: 仅 responseType=file
          label: 响应文件
          name: file
          type: file
plugin:
    desc: 把任意 HTTP 接口变成可编排的一步。画布上有专门的「HTTP 请求」节点，
    label: HTTP 请求
    name: http
    org: sokel
    version: v1.0.0
deployment:
  targets:
  - kind: container
    ref: ghcr.io/sokel-dev/sokel/sokel-base-plugins:latest
  env:
  - name: SOKEL_BASE_PLUGINS
    desc: 只启用本插件这一个成员（基础容器是全量基础插件合一镜像；token 是单插件身份凭据）
    required: true
    default: http
  note: 平台部署套件已内置同款容器承接本插件，通常无需部署；此命令用于在别的机器上再起一个出站副本（横向扩容/就近出网）。
