                - desc: 仅 datetime 列有意义
                  label: 插入时取当前时间
                  name: defaultNow
                  type: boolean
              goType: Column
              name: columns
              required: true
              type: array
            - fields:
                - desc: 任一列的值包含它即命中
                  label: 全局搜索
                  name: q
                  type: string
                - fields:
                    - label: 列名
                      name: column
                      required: true
                      type: string
                    - desc: == != > >= < <= in contains like ilike；未知的按 == 处理
                      label: 比较符
                      name: op
                      required: true
                      type: string
                    - desc: 类型随列而变；in 的值是数组
                      label: 比较值
                      name: value
                      opaque: true
                      type: json
                  label: 逐字段条件（AND）
                  name: conds
                  type: array
                - fields:
                    - fields:
                        - label: 列名
                          name: column
                          required: true
                          type: string
                        - desc: == != > >= < <= in contains like ilike；未知的按 == 处理
                          label: 比较符
                          name: op
                          required: true
                          type: string
                        - desc: 类型随列而变；in 的值是数组
                          label: 比较值
                          name: value
                          opaque: true
