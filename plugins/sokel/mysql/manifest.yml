                  type: boolean
                - desc: enum 列的取值范围，实现可落成 CHECK 之类的约束
                  itemType: string
                  label: 候选值
                  name: options
                  type: array
                - desc: 实现可落成列注释
                  label: 列说明
                  name: desc
                  type: string
                - desc: 为真时不建这一列
                  label: 隐藏列
                  name: hidden
                  type: boolean
                - desc: 值的类型随该列的 type 而变，运行期才确定
                  label: 默认值
                  name: default
                  opaque: true
                  type: json
                - desc: 仅 datetime 列有意义
                  label: 插入时取当前时间
                  name: defaultNow
                  type: boolean
              goType: Column
              name: columns
              required: true
              type: array
            - name: rid
              required: true
              type: string
          outputs:
            - name: found
              required: true
              type: boolean
            - desc: 列名 → 值，键与类型由这张表的列声明决定
              name: row
              opaque: true
              type: json
        - id: row_query
          inputs:
            - name: table
              required: true
              type: string
            - fields:
                - label: 列名
                  name: key
                  required: true
                  type: string
                - label: 显示名
                  name: label
