# Generated by cmd/gen-from-db from the platform DB (one-off migration; see that program's header comment).
# Original platform id: p_mysql. Migration MUST claim it under the same id: credentials, channels,
# access groups and model deployments all hold foreign keys to it, so changing the id would silently
# orphan everything users have configured.
credential:
    fields:
        - label: Host
          name: host
          required: true
          type: text
        - default: "3306"
          label: Port
          name: port
          type: text
        - label: Database
          name: database
          required: true
          type: text
        - label: User
          name: user
          required: true
          type: text
        - label: Password
          name: password
          required: true
          type: secret
        - default: PREFERRED
          label: SSL Mode
          name: sslmode
          options:
            - DISABLED
            - PREFERRED
            - REQUIRED
            - VERIFY_CA
            - VERIFY_IDENTITY
          type: select
implements:
    - capability: rowstore
      operations:
        - id: row_delete
          inputs:
            - name: table
              required: true
              type: string
            - fields:
                - label: 列名
                  name: key
                  required: true
                  type: string
                - label: 显示名
                  name: label
                  type: string
                - desc: string/text/url/enum/number/boolean/datetime/json/array/object/file
                  label: 逻辑类型
                  name: type
                  required: true
                  type: string
                - label: 可空
                  name: nullable
                  type: boolean
                - label: 是主键
                  name: isPrimaryKey
                  type: boolean
                - label: 建索引
                  name: indexed
                  type: boolean
                - desc: enum 列的取值范围，实现可落成 CHECK 之类的约束
                  itemType: string
                  label: 候选值
                  name: options
                  type: array
                - desc: 实现可落成列注释
                  label: 列说明
                  name: desc
                  type: string
                - desc: 为真时不建这一列
                  label: 隐藏列
                  name: hidden
                  type: boolean
                - desc: 值的类型随该列的 type 而变，运行期才确定
                  label: 默认值
                  name: default
                  opaque: true
                  type: json
                - desc: 仅 datetime 列有意义
                  label: 插入时取当前时间
                  name: defaultNow
                  type: boolean
              goType: Column
              name: columns
              required: true
              type: array
            - name: rid
              required: true
              type: string
          outputs:
            - name: ok
              required: true
              type: boolean
        - id: row_describe_schema
          inputs:
            - name: table
              required: true
              type: string
          outputs:
            - fields:
                - label: 列名
                  name: name
                  required: true
                  type: string
                - desc: 各家自己的说法，由平台翻成逻辑类型
                  label: 数据库原始类型名
                  name: data_type
                  required: true
                  type: string
                - label: 可空
                  name: nullable
                  type: boolean
                - label: 是主键
                  name: is_pk
                  type: boolean
              goType: ColumnInfo
              name: columns
              required: true
              type: array
            - fields:
                - label: 索引名
                  name: name
                  required: true
                  type: string
                - desc: 多于一列即联合索引，顺序有意义
                  itemType: string
                  label: 列（有序）
                  name: columns
                  required: true
                  type: array
                - label: 唯一
                  name: unique
                  type: boolean
                - label: 外部自建
                  name: external
                  type: boolean
              goType: Index
              name: indexes
              required: true
              type: array
        - id: row_ensure_schema
          inputs:
            - name: table
              required: true
              type: string
            - fields:
                - label: 列名
                  name: key
                  required: true
                  type: string
                - label: 显示名
                  name: label
                  type: string
                - desc: string/text/url/enum/number/boolean/datetime/json/array/object/file
                  label: 逻辑类型
                  name: type
                  required: true
                  type: string
                - label: 可空
                  name: nullable
                  type: boolean
                - label: 是主键
                  name: isPrimaryKey
                  type: boolean
                - label: 建索引
                  name: indexed
                  type: boolean
                - desc: enum 列的取值范围，实现可落成 CHECK 之类的约束
                  itemType: string
                  label: 候选值
                  name: options
                  type: array
                - desc: 实现可落成列注释
                  label: 列说明
                  name: desc
                  type: string
                - desc: 为真时不建这一列
                  label: 隐藏列
                  name: hidden
                  type: boolean
                - desc: 值的类型随该列的 type 而变，运行期才确定
                  label: 默认值
                  name: default
                  opaque: true
                  type: json
                - desc: 仅 datetime 列有意义
                  label: 插入时取当前时间
                  name: defaultNow
                  type: boolean
              goType: Column
              name: columns
              required: true
              type: array
          outputs:
