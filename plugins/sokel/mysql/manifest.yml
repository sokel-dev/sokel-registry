                  name: numeric
                  type: boolean
              goType: Order
              name: orders
              type: array
            - goType: int
              name: offset
              type: number
            - desc: 要几行；<=0 表示一行都不要（配合 with_total 就是只数个数）
              goType: int
              name: limit
              required: true
              type: number
            - desc: 要不要命中总数：它往往比取一页贵得多
              name: with_total
              type: boolean
          outputs:
            - desc: 一行就是「列名 → 值」，键与类型由这张表的列声明决定，没有可声明的统一结构
