operations:
    - desc: 用这条凭证真连一次外接库并执行一次查询，返回上游原话
      id: health_check
      inputs: []
      internal: true
      label: 连接测试
      outputs:
        - label: 是否可用
          name: ok
          type: boolean
        - label: 说明
          name: message
          type: string
plugin:
