credential:
  fields:
  - label: AccessKey
    name: access_key
    required: true
    type: text
  - label: SecretKey
    name: secret_key
    required: true
    type: secret
operations:
- desc: 列出存储空间内文件（可按前缀过滤，marker 翻页）
  id: list
  inputs:
  - label: 空间名
    name: bucket
    required: true
    type: string
  - label: 前缀
    name: prefix
    type: string
  - default: 100
    label: 数量上限
    name: limit
    type: number
  - label: 翻页标记
    name: marker
    type: string
  label: 空间文件列表
  outputs:
  - label: 文件列表
    name: items
    type: array
  - label: 下一页标记
    name: marker
    type: string
- desc: 查询单个文件的元信息（大小/类型/上传时间等）
  id: stat
  inputs:
  - label: 空间名
    name: bucket
    required: true
    type: string
  - label: 文件 Key
    name: key
    required: true
    type: string
  label: 文件信息
  outputs:
  - label: 文件信息
    name: result
    type: json
- desc: 删除空间内的一个文件
  id: delete
  inputs:
  - label: 空间名
    name: bucket
    required: true
    type: string
  - label: 文件 Key
    name: key
    required: true
    type: string
  label: 删除文件
  outputs:
  - label: 是否成功
    name: ok
    type: boolean
- desc: 生成客户端直传用的上传 token（本地签名，不出网）
  id: uptoken
  inputs:
  - label: 空间名
    name: bucket
    required: true
    type: string
  - label: 限定 Key（可选）
    name: key
    type: string
  - default: 3600
    label: 有效期(秒)
    name: expires
    type: number
  label: 生成上传凭证
  outputs:
  - label: 上传凭证
    name: token
    type: string
  - label: 过期时间(unix)
    name: expires_at
    type: number
- desc: 刷新 CDN 缓存（URL 或目录）
  id: cdn_refresh
  inputs:
  - label: URL 列表
    name: urls
    type: array
  - label: 目录列表
    name: dirs
    type: array
  label: CDN 刷新
  outputs:
  - label: 刷新结果
    name: result
    type: json
- desc: 预取资源到 CDN 边缘节点
  id: cdn_prefetch
  inputs:
  - label: URL 列表
    name: urls
    required: true
    type: array
  label: CDN 预取
  outputs:
  - label: 预取结果
    name: result
    type: json
- desc: 列一次空间验证 AK/SK 是否可用（只读，不产生费用）
  id: health_check
  label: 检查凭证
  outputs:
  - label: 可用
    name: ok
    required: true
    type: boolean
  - label: 说明
    name: message
    required: true
    type: string
  timeoutSec: 30
plugin:
  desc: 七牛的原生接口封装：空间存储与 CDN 的基本操作，由平台进程内的签名执行器承接，
  label: 七牛云
  name: qiniu
  org: sokel
  version: v1.0.0
