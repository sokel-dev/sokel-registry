plugin:
  desc: 往频道发消息。免费、无审批，建一个 Webhook 只要频道管理员点几下。
  doc: README.md
  label: Discord
  name: discord
  org: sokel
  version: v1.0.1

credential:
  fields:
    - desc: 频道设置 → 整合 → Webhook → 新建，复制那条 https://discord.com/api/webhooks/... 的地址。**它本身就是凭据**（拿到就能发消息），所以按密钥保管
      label: Webhook 地址
      name: webhook_url
      required: true
      type: secret
    - desc: 如 http://127.0.0.1:7897；部署环境直连不了 discord.com 时必填
      label: 出站代理
      name: proxy
      type: text

operations:
  - desc: 查一次 Webhook 是否还在。ok=false 表示它被删了或地址不对
    id: health_check
    label: 检查凭证
    outputs:
      - label: 凭证可用
        name: ok
        required: true
        type: boolean
      - label: 说明
        name: message
        required: true
        type: string
      - label: 频道 id
        name: channel
        type: string
  - desc: 删掉本 Webhook（或本 Bot）自己发的消息
    id: discord_message_delete
    inputs:
      - label: 消息 id
        name: message_id
        required: true
        type: string
      - desc: 消息发在话题里时要给
        label: 所在话题
        name: thread_id
        type: string
    label: 删消息
    outputs:
      - label: 已删除
        name: deleted
        required: true
        type: boolean
  - desc: 往频道发一条消息，可带嵌入卡片与附件
    id: discord_message_send
    inputs:
      - desc: 上限 2000 字符。支持 Markdown；@everyone 之类要频道允许才生效
        label: 正文
        name: content
        type: text
      - desc: 填了就带一张嵌入卡片
        label: 卡片标题
        name: title
        type: string
      - desc: 上限 4096 字符
        label: 卡片正文
        name: description
        type: text
      - desc: 点标题跳转的地址
        label: 卡片链接
        name: url
        type: string
      - desc: '十六进制，如 #2b6cb0；留空用 Discord 默认'
        label: 卡片色条
        name: color
        type: string
      - label: 卡片大图地址
        name: image_url
        type: string
      - desc: 键值对，如 {"标的":"600519","评级":"买入"}；在卡片里排成两列
        label: 卡片字段
        name: fields
        type: json
        valueType:
          goType: string
          name: ""
          type: string
      - desc: 常放来源与时间
        label: 卡片页脚
        name: footer
        type: string
      - desc: 随消息上传的文件（图片会直接显示）
        itemType: file
        label: 附件
        name: files
        type: array
      - desc: 覆盖 Webhook 自带的名字（仅 Webhook 模式）
        label: 发送者昵称
        name: username
        type: string
      - desc: 论坛频道/话题的 id；留空发到频道本身
        label: 发进某个话题
        name: thread_id
        type: string
    label: 发消息
    outputs:
      - desc: 改/删这条消息要用它
        label: 消息 id
        name: id
        required: true
        type: string
      - label: 频道 id
        name: channel_id
        required: true
        type: string
      - desc: https://discord.com/channels/... 可直接点开
        label: 消息链接
        name: url
        required: true
        type: string
deployment:
  targets:
  - kind: container
    ref: ghcr.io/sokel-dev/sokel-plugin-discord:1.0.1@sha256:bd20c819f07fc7e55ffb6b2b870c5b8eccb8947fb2acbfb6783e6fc120af8329
