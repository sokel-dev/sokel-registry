plugin:
  name: sandbox
  org: sokel
  label: 沙箱运行时
  version: v1.0.0
  desc: 在受限进程里执行 python / node / bash：无网络、内存与 CPU 上限、一次性工作目录、每次执行降权。code 节点的 python / bash 与 skill 的脚本执行都路由到它；本期网络策略只有 none。
deployment:
  targets:
  - kind: container
    ref: registry.cn-hangzhou.aliyuncs.com/wisburg/sokel-plugin-sandbox:latest
  env:
  - name: SOKEL_SANDBOX_CONCURRENCY
    desc: 并发上限（缺省 CPU 数）；超出的排队
    required: false
    default: ''
  - name: SOKEL_SANDBOX_UID_BASE
    desc: 降权起始 uid（缺省 60000，按并发槽位递增）
    required: false
    default: ''
  note: 独立镜像（带 python / node / bash 与预装库），不在基础插件容器里。容器以 root 起，每次执行 fork 的子进程降权并装 seccomp；不要给容器加 --privileged，也不要挂 docker socket。宿主支持 gVisor 时可用 --runtime=runsc 再加一道墙。
operations:
- desc: 在受限进程里执行一段 python / node / bash：无网络、有内存与 CPU 上限、一次性工作目录。python / node 定义 main(args) 并返回结果；输入文件在 $SOKEL_IN，产出文件写到 $SOKEL_OUT/files/。进程跑起来就算调用成功，退出码非零 / 超时看 ok 与 error。
  id: run
  inputs:
  - default: python
    desc: python / node 定义 main(args) 并返回值（可 async）；bash 直接执行，结果 JSON 自己写到 $SOKEL_OUT/result.json
    label: 语言
    name: language
    options:
    - label: Python
      value: python
    - label: Node.js
      value: node
    - label: Bash
      value: bash
    type: enum
  - desc: 要执行的代码原文（entry 给了时忽略）
    label: 代码
    name: code
    type: text
  - desc: 程序模式：直接运行输入文件里的这个脚本（相对 $SOKEL_IN），cwd 是 $SOKEL_IN；不套 main(args) 约定，产出就是 stdout / 退出码 / $SOKEL_OUT 下的文件
    label: 入口文件
    name: entry
    type: string
  - desc: 程序模式下跟在入口文件后面的参数
    itemType: string
    label: 命令行参数
    name: argv
    type: array
  - desc: 传给 main(args) 的 JSON 对象，键由代码自己约定；bash 从 $SOKEL_ARGS 指向的文件读
    label: 入参
    name: args
    opaque: true
    type: json
  - desc: 只读放在 $SOKEL_IN 目录下，按文件名取
    itemType: file
    label: 输入文件
    name: files
    type: array
  - default: 30
    desc: 到点整棵进程树被杀；上限 60
    goType: int
    label: 超时(秒)
    name: timeout
    type: number
  - default: 256
    desc: 上限 1024
    goType: int
    label: 内存(MB)
    name: memory
    type: number
  - default: none
    desc: 本期只有 none：任何 socket 调用都被拒绝
    label: 网络
    name: network
    options:
    - label: 无网络
      value: none
    type: enum
  - desc: 同一个键的调用复用常驻进程（python 每次 fork、node 同进程），省掉解释器启动；平台传「工作空间 + 运行 id」，跨运行、跨空间不共用。只对 python / node 的 main(args) 模式且没有输入文件时生效，其余照常每次新起进程
    label: 复用键
    name: reuse
    type: string
  internal: true
  label: 执行代码
  outputs:
  - desc: 退出码 0、没超时、结果合法
    label: 是否成功
    name: ok
    required: true
    type: boolean
  - desc: main(args) 的返回值 / result.json 的内容，形状由代码决定
    label: 结果
    name: result
    opaque: true
    type: json
    types:
    - json
    - array
    - string
    - number
    - boolean
  - goType: int
    label: 退出码
    name: exit
    required: true
    type: number
  - label: 是否超时
    name: timed_out
    required: true
    type: boolean
  - desc: 退出非零 / 超时 / 结果超限时的人话摘要
    label: 错因
    name: error
    type: string
  - desc: 封顶 1MB，超出截断
    label: 标准输出
    name: stdout
    type: text
  - desc: 封顶 1MB，超出截断
    label: 错误输出
    name: stderr
    type: text
  - desc: 代码写到 $SOKEL_OUT/files/ 下的文件（最多 20 个、单个 20MB）
    itemType: file
    label: 产出文件
    name: files
    type: array
  - goType: int
    label: 耗时(毫秒)
    name: duration_ms
    required: true
    type: number
  - desc: seccomp = 降权 + seccomp + rlimit；rlimit-only = 只有资源上限（非 linux 或显式关闭）
    label: 隔离档
    name: isolation
    required: true
    type: string
