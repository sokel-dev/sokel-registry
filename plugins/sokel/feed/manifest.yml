credential:
    fields:
        - desc: 插件默认自己去首页取匿名令牌；被风控挡住时，把浏览器里的整条 Cookie 粘进来
          label: 雪球 Cookie（可选）
          name: xueqiu_cookie
          type: secret
        - desc: 留空用常见的桌面 Chrome UA
          label: User-Agent
          name: user_agent
          type: text
        - desc: 取境外源时可能需要
          label: 出站代理
          name: proxy
          type: text
operations:
    - desc: 从一个来源拉新条目（RSS/Atom 或站点接口），产出统一的 JSON 条目 + 增量游标
      id: feed_fetch
      inputs:
        - default: rss
          label: 来源
          name: source
          options:
            - label: RSS/Atom 地址（通用）
              value: rss
            - label: 雪球 · 某用户的动态
              value: xueqiu_user
            - label: 雪球 · 热帖
              value: xueqiu_hots
            - label: 雪球 · 快讯
              value: xueqiu_livenews
            - label: 财联社 · 电报
              value: cls_telegraph
            - label: 东方财富 · 关键词搜索
              value: eastmoney_search
            - label: 金十数据 · 快讯
              value: jin10
          type: enum
        - desc: 按来源填：RSS 填 feed 地址；雪球用户填 uid（主页地址 xueqiu.com/u/<这一串>）；雪球热帖/快讯不用填；财联社电报填分类（留空 = 全量电报流）；东方财富填关键词（如某只票的名称或代码）；金十填频道号（留空 = 全部快讯）
          label: 目标
          name: target
          type: string
        - desc: 上一批返回的 next_cursor，**原样存回数据表**。留空 = 第一次拉（只取最近一批，不回溯全部历史）
          label: 游标
          name: cursor
          type: string
        - default: 50
          desc: 默认 50
          goType: int
          label: 最多几条
          name: max_items
          type: number
        - default: false
          desc: 只对雪球有效：转发内容通常不是原创观点
          label: 跳过转发
          name: skip_reposts
          type: boolean
      label: 取内容
      outputs:
        - desc: '**按时间正序**（老的在前），与游标推进方向一致'
          fields:
            - desc: 来源给的唯一标识；没有时用链接的哈希
              label: 条目 id
              name: id
              required: true
              type: string
            - label: 标题
              name: title
              type: string
            - label: 原文链接
              name: url
              type: string
            - desc: 纯文本，已去掉 HTML 标签
              label: 摘要
              name: summary
              type: string
            - desc: 来源给多少是多少；RSS 常常只有摘要
              label: 正文 HTML
              name: content_html
              type: string
            - label: 作者
              name: author
              type: string
            - desc: RFC3339；来源没给就是空
              label: 发布时间
              name: published_at
              type: string
            - desc: vendor 名 + 具体源（如 xueqiu_user:1234）
              label: 来源
              name: source
              type: string
            - itemType: string
              label: 标签
              name: tags
              type: array
            - itemType: string
              label: 图片地址
              name: images
              type: array
            - label: 去重键
              name: dedup_key
              type: string
          goType: Item
          label: 条目
          name: items
          required: true
          type: array
        - desc: 没有新内容时原样返回传入的游标
          label: 下一个游标
          name: next_cursor
          required: true
          type: string
        - desc: 为真表示这批拉满了，应当立刻再拉一次
          label: 还有更多
          name: has_more
          required: true
          type: boolean
        - goType: int
          label: 本批条数
          name: count
          required: true
          type: number
    - desc: 试着取一次雪球的匿名令牌。本插件多数来源不需要凭证，所以这里主要验网络是否通
      id: health_check
      label: 检查凭证
      outputs:
        - label: 可用
          name: ok
          required: true
          type: boolean
        - label: 说明
          name: message
          required: true
          type: string
plugin:
    desc: 从一个来源拉新条目，产出统一形状的 JSON。换来源不用改下游节点。
    doc: README.md
    label: Feed 订阅
    name: feed
    org: sokel
    version: v1.0.0
deployment:
  targets:
  - kind: container
    ref: ghcr.io/sokel-dev/sokel-plugins/sokel-plugin-feed:latest
