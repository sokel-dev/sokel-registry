# Generated by cmd/gen-from-db. The contract comes from ../plugin-builtin/gitlab/schema (the plugin's own declaration);
# display name and description come from the platform DB. Original platform id: gitlab;
# migration claims it under the same id.
credential:
    fields:
        - desc: 自建实例填根地址（如 https://git.example.com）；留空 = gitlab.com
          label: GitLab 地址
          name: base_url
          type: text
        - desc: 个人访问令牌（用户头像 → Preferences → Access Tokens），scope 至少 api；建议专建一个机器人账号的 token 并按需给 scope
          label: 访问令牌
          name: token
          required: true
          type: secret
        - desc: 平台代收 webhook 用：GitLab 项目 Settings→Webhooks 里填的 Secret token，两边一致才收（防伪造）。不用 webhook 可留空
          label: Webhook Secret
          name: webhook_secret
          type: secret
        - desc: path 形态逗号分隔（如 backend/server,infra/deploy）。**填了才启动事件源**：新提交/新 MR/合并/新 Issue/流水线失败 会触发工作流（轮询，约 1 分钟延迟；要零延迟用 GitLab Webhook 指平台的 Webhook 触发器）
          label: 事件盯哪些项目
          name: watch_projects
          type: text
events:
    - fields:
        - desc: path 形态（group/name）
          label: 项目
          name: project
          required: true
          type: string
        - label: 分支
          name: ref
          required: true
          type: string
        - label: 提交 ID
          name: commit_id
          required: true
          type: string
        - label: 提交标题
          name: commit_title
          type: string
        - goType: int
          label: 提交数
          name: commit_count
          required: true
          type: number
        - label: 推送人
          name: author
          required: true
          type: string
        - desc: poll = 轮询 Events API / webhook = GitLab 推送。**raw 的形状由它决定**
          label: 来自哪条路
          name: source
          required: true
          type: string
        - desc: 上游原始载荷。**两条路的形状不一样**：source=poll 时是 Events API 的事件对象，source=webhook 时是 Hook 的请求体。要下钻 raw 就必须先看 source，否则换一种部署方式就会取到空——优先用上面那些已归一的字段
          label: 原始事件
          name: raw
          opaque: true
          required: true
          type: json
          types:
            - json
            - array
            - string
            - number
            - boolean
      id: commit_pushed
      label: 有新提交
    - fields:
        - desc: path 形态（group/name）
          label: 项目
          name: project
          required: true
          type: string
        - goType: int
          label: Issue 编号
          name: iid
          required: true
          type: number
        - label: Issue 标题
          name: title
          type: string
        - desc: 这次说了什么——派活时把它当指令
          label: 评论内容
          name: comment
          required: true
          type: text
        - desc: '**防自触发靠它**：机器人回复也是评论，工作流里务必把机器人账号滤掉，否则无限循环'
          label: 评论人
          name: author
          required: true
          type: string
        - label: 评论链接
          name: url
          type: string
      id: issue_commented
      label: Issue 有新评论
    - fields:
        - desc: path 形态（group/name）
          label: 项目
          name: project
          required: true
          type: string
        - goType: int
          label: Issue 编号
          name: iid
          required: true
          type: number
        - label: 标题
          name: title
          required: true
          type: string
        - label: 正文
          name: description
          type: text
        - desc: '**判「该不该派活」用它**：labels 是当前全部标签，加一个无关标签也会让它含 claude'
          itemType: string
          label: 本次新增的标签
          name: added_labels
          required: true
          type: array
        - itemType: string
          label: 当前全部标签
          name: labels
          type: array
        - label: Issue 链接
          name: url
          type: string
        - desc: 打标签的人（轮询路径取不到，为空）
          label: 操作人
          name: author
          type: string
      id: issue_labeled
      label: Issue 被打标签
    - fields:
        - desc: path 形态（group/name）
          label: 项目
          name: project
          required: true
          type: string
        - goType: int
          label: Issue 编号
          name: iid
          required: true
          type: number
        - label: 标题
          name: title
          required: true
          type: string
        - desc: Issue 的正文。**要把 Issue 内容交给下游（如让 agent 照着做）时用的就是它**——标题往往只是一句话
          label: 正文
