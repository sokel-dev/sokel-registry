          label: 原始事件
          name: raw
          opaque: true
          required: true
          type: json
          types:
            - json
            - array
            - string
            - number
            - boolean
      id: issue_opened
      label: 新 Issue
    - fields:
        - desc: path 形态（group/name）
          label: 项目
          name: project
          required: true
          type: string
        - goType: int
          label: MR 编号
          name: iid
          required: true
          type: number
        - label: MR 标题
          name: title
          type: string
        - label: 评论内容
          name: comment
