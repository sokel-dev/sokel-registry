<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sokel Plugin Registry</title>
<meta name="description" content="Plugins for the Sokel workflow platform: what each one does, which credentials it needs, and how to run it.">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<nav class="nav">
  <div class="navin">
    <a class="brand" href="#"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 16.5 L7.5 13 L10.5 18 L15 6.5 L21 12"/><circle cx="15" cy="6.5" r="2"/></svg></span><b>Sokel</b><span class="brandsub" data-t="插件目录"></span></a>
    <span class="navlinks">
      <a href="#" data-nav="list" data-t="插件"></a>
      <a href="#/advisories" data-nav="advisories" data-t="安全通告"></a>
      <a id="contribute" class="gh" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-t="提交插件"></span></a>
      <button id="lang" class="langbtn" type="button"></button>
    </span>
  </div>
</nav>

<!-- The hero belongs to the list view only: on a detail view the plugin itself is the subject. -->
<header id="masthead" class="hero">
  <div class="wrap herogrid">
    <div class="herotext">
      <div class="eyebrow" data-t="Sokel 插件目录"></div>
      <h1 id="headline"></h1>
      <p class="lede" id="lede"></p>
      <label class="herosearch">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <dl class="stats" id="stats"></dl>
    </div>
    <!-- A cloud of real plugin marks: decoration, so it is hidden from assistive tech and on narrow screens. -->
    <div class="cloud" id="cloud" aria-hidden="true"></div>
  </div>
</header>

<div class="wrap page">
  <div id="err"></div>
  <div id="list" class="layout">
    <aside class="side" id="side"></aside>
    <main class="main">
      <div class="resulthead" id="resulthead"></div>
      <div id="grid"></div>
    </main>
  </div>
  <!-- Detail and advisories views: switched by the hash, so refresh and shared links work. -->
  <div id="view" hidden></div>
  <footer class="foot" id="note"></footer>
</div>
<!-- Markdown parser for plugin docs (they are full of tables). If it fails to load, docs fall back to plain text:
     a CDN never decides whether this page is readable, so it loads before app.js and without defer. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="./brands.js"></script>
<script src="./app.js"></script>
</body>
</html>
